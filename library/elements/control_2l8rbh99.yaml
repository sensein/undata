semantic:
  data_type: integer
provenance:
- source: nwb
  class: TimeSeries
  name: control
  description: Numerical labels that apply to each time point in data for the purpose
    of querying and slicing data by these values. If present, the length of this array
    should be the same size as the first dimension of data.
- source: nwb
  class: EventDetection
  name: source_idx
  description: Indices (zero-based) into the linked source ElectricalSeries::data
    array corresponding to time of event or time and channel of event. ''description''
    should define what is meant by time of event (e.g., .25 ms before action potential
    peak, zero-crossing time, etc). The index points to each event from the raw data.
- source: nwb
  class: Clustering
  name: num
  description: Cluster number of each event
- source: nwb
  class: PatchClampSeries
  name: sweep_number
  description: Sweep number, allows to group different PatchClampSeries together.
- source: nwb
  class: SweepTable
  name: sweep_number
  description: Sweep number of the PatchClampSeries in that row.
- source: nwb
  class: ImageSeries
  name: dimension
  description: Number of pixels on x, y, (and z) axes.
- source: nwb
  class: IndexSeries
  name: data
  description: Index of the image (using zero-indexing) in the linked Images object.
- source: nwb
  class: IntervalSeries
  name: data
  description: Use values >0 if interval started, <0 if interval ended.
- source: nwb
  class: OnePhotonSeries
  name: binning
  description: Amount of pixels combined into 'bins'; could be 1, 2, 4, 8, etc.
- source: nwb
  class: ImagingRetinotopy
  name: focal_depth_image
  description: 'Gray-scale image taken with same settings/parameters (e.g., focal
    depth, wavelength) as data collection. Array format: [rows][columns].'
- source: nwb
  class: ImagingRetinotopy
  name: vasculature_image
  description: 'Gray-scale anatomical image of cortical surface. Array structure:
    [rows][columns]'
