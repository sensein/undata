semantic:
  data_type: string
  constraints:
    allowed_values:
    - dandi:isChildOf
    - dandi:isParentOf
    - dandi:isSiblingOf
    - dandi:isMonozygoticTwinOf
    - dandi:isDizygoticTwinOf
provenance:
- source: dandi
  class: RelatedParticipant
  name: relation
  description: 'Indicates how the current participant or subject is related to the
    other participant or subject. This relation should satisfy: Participant/Subject
    <relation> relatedParticipant/Subject.'
