semantic:
  ontology_term: http://purl.obolibrary.org/obo/NCIT_C25150
  data_type: string
  unit: iso8601_duration
provenance:
- source: dandi
  class: Participant
  name: age
  description: A representation of age using ISO 8601 duration. This should include
    a valueReference if anything other than date of birth is used. (postnatal age
    (ISO 8601 duration, valueReference=BirthReference))
- source: nwb
  class: Subject
  name: age
  description: Age of subject. Can be supplied instead of 'date_of_birth'. The ISO
    8601 Duration format is recommended, e.g., 'P90D' for 90 days old. If the precise
    age is unknown, an age range can be given by '[lower bound]/[upper bound]' e.g.
    'P10D/P20D' would mean that the age is in between 10 and 20 days. If only the
    lower bound is known, then including only the slash after that lower bound can
    be used to indicate a missing bound. For instance, 'P90Y/' would indicate that
    the age is 90 years or older.
