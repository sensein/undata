versions:
- version_num: 1
  name: channel_conversion
  data_type: float
  description: Channel-specific conversion factor. Multiply the data in the 'data'
    dataset by these values along the channel axis (as indicated by axis attribute)
    AND by the global conversion factor in the 'conversion' attribute of 'data' to
    get the data values in Volts, i.e, data in Volts = data * data.conversion * channel_conversion.
    This approach allows for both global and per-channel data conversion factors needed
    to support the storage of electrical recordings as native values generated by
    data acquisition systems. If this dataset is not present, then there is no channel-specific
    conversion factor, i.e. it is 1 for all channels.
  created_at: '2026-03-15T22:28:31.423187+00:00'
