    '
- source: bids
  class: metadata
  name: NIRSChannelCount
  description: 'Total number of NIRS channels, including short channels.

    Corresponds to the number of rows in `channels.tsv` with any NIRS type.

    '
- source: bids
  class: metadata
  name: NIRSSourceOptodeCount
  description: 'Number of NIRS sources.

    Corresponds to the number of rows in `optodes.tsv` with type `"source"`.

    '
- source: bids
  class: metadata
  name: NIRSDetectorOptodeCount
  description: 'Number of NIRS detectors.

    Corresponds to the number of rows in `optodes.tsv` with type `"detector"`.

    '
- source: bids
  class: metadata
  name: NumberOfSpectralPoints
  description: 'The number of complex data points in each recorded transient of the
    detected time-domain MR

    signal, equivalent to the number of points in a single spectrum.

    '
- source: bids
  class: metadata
  name: NumberOfTransients
  description: 'The number of single applications of the pulse sequence recorded during
    an MRS acquisition.

    '
- source: bids
  class: metadata
  name: NumberOfVolumesDiscardedByScanner
  description: 'Number of volumes ("dummy scans") discarded by the scanner

    (as opposed to those discarded by the user post hoc)

    before saving the imaging file.

    For example, a sequence that automatically discards the first 4 volumes

    before saving would have this field as 4.

    A sequence that does not discard dummy scans would have this set to 0.

    Please note that the onsets recorded in the `events.tsv` file should always

    refer to the beginning of the acquisition of the first volume in the

    corresponding imaging file - independent of the value of

    `"NumberOfVolumesDiscardedByScanner"` field.

    '
- source: bids
  class: metadata
  name: NumberOfVolumesDiscardedByUser
  description: 'Number of volumes ("dummy scans") discarded by the user before including
    the

    file in the dataset.

    If possible, including all of the volumes is strongly recommended.

    Please note that the onsets recorded in the `events.tsv` file should always

    refer to the beginning of the acquisition of the first volume in the

    corresponding imaging file - independent of the value of

    `"NumberOfVolumesDiscardedByUser"` field.

    '
- source: bids
  class: metadata
  name: NumberReceiveCoilActiveElements
  description: 'The number of active RF elements used by the receive coil.

    '
- source: bids
  class: metadata
  name: NumberTransmitCoilActiveElements
  description: 'The number of active RF elements used by the transmit coil.

    '
- source: bids
  class: metadata
  name: ORNTChannelCount
  description: 'Number of orientation channels.

    '
- source: bids
  class: metadata
  name: POSChannelCount
  description: 'Number of position channels.

    '
- source: bids
  class: metadata
  name: SEEGChannelCount
  description: 'Number of SEEG channels.

    '
- source: bids
  class: metadata
  name: ShortChannelCount
  description: 'The number of short channels. 0 indicates no short channels.

    '
- source: bids
  class: metadata
  name: TriggerChannelCount
  description: 'Number of channels for digital (binary TTL) triggers or analog equivalents
