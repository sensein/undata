semantic:
  data_type: float
provenance:
- source: bids
  class: columns
  name: duration
  description: 'Duration of the event (measured from onset) in seconds.

    Must always be either zero or positive (or `n/a` if unavailable).

    A "duration" value of zero implies that the delta function or event is so

    short as to be effectively modeled as an impulse.

    '
- source: bids
  class: columns
  name: x_coordinate
  description: 'Gaze position x-coordinate of the recorded eye, in the coordinate

    units specified in the corresponding metadata sidecar.

    '
- source: bids
  class: columns
  name: y_coordinate
  description: 'Gaze position y-coordinate of the recorded eye, in the coordinate

    units specified in the corresponding metadata sidecar.

    '
- source: bids
  class: columns
  name: pupil_size
  description: 'Pupil size, as area or diameter, of the recorded eye, in the

    units specified in the corresponding metadata sidecar.

    It is RECOMMENDED to indicate the particular type of pupil size that is

    being recorded in the `Description` field of this column.

    It is RECOMMENDED to specify the `Units` field corresponding to this column.

    '
- source: bids
  class: columns
  name: timestamp__eyetrack
  description: 'Timestamp issued by the eye-tracker indexing the continuous recordings
    corresponding to

    the sampled eye.

    '
- source: bids
  class: columns
  name: high_cutoff
  description: 'Frequencies used for the low-pass filter applied to the channel in
    Hz.

    If no low-pass filter applied, use `n/a`.

    Note that hardware anti-aliasing in A/D conversion of all MEG/EEG/EMG electronics

    applies a low-pass filter; specify its frequency here if applicable.

    '
- source: bids
  class: columns
  name: hplc_recovery_fractions
  description: 'HPLC recovery fractions (the fraction of activity that gets loaded
    onto the HPLC).

    '
- source: bids
  class: columns
  name: impedance
  description: 'Impedance of the electrode, units MUST be in `kOhm`.

    '
- source: bids
  class: columns
  name: interelectrode_distance
  description: 'Distance between adjacent electrodes (in a pair or grid) that are
    rigidly attached to

    the same sensor device, or between the `signal_electrode` and its `reference`

    when each is independently placed.

    '
- source: bids
  class: columns
  name: low_cutoff
  description: 'Frequencies used for the high-pass filter applied to the channel in
    Hz.

    If no high-pass filter applied, use `n/a`.

    '
- source: bids
  class: columns
  name: metabolite_parent_fraction
  description: 'Parent fraction of the radiotracer (0-1).

    '
- source: bids
  class: columns
  name: metabolite_polar_fraction
  description: 'Polar metabolite fraction of the radiotracer (0-1).

    '
- source: bids
  class: columns
  name: onset
  description: 'Onset (in seconds) of the event, measured from the beginning of the
    acquisition

    of the first data point stored in the corresponding task data file.

    Negative onsets are allowed, to account for events that occur prior to the first

    stored data point.

    For example, in case there is an in-scanner training phase that begins before

    the scanning sequence has started events from this sequence should have

    negative onset time counting down to the beginning of the acquisition of the

    first volume.


    If any data points have been discarded before forming the data file

    (for example, "dummy volumes" in BOLD fMRI),

    a time of 0 corresponds to the first stored data point and not the first

    acquired data point.


    A value of `n/a` value indicates the onset time is unknown or unavailable.

    '
- source: bids
  class: columns
  name: onset__physioevents
  description: 'Onset of the event relative to the timeline defined by the corresponding

    physiological recording file.


    Typically, it will correspond to a timestamp issued by the recording device.

    '
- source: bids
  class: columns
  name: plasma_radioactivity
  description: 'Radioactivity in plasma, in unit of plasma radioactivity (for example,
    `kBq/mL`).

    '
- source: bids
  class: columns
  name: response_time
  description: 'Response time measured in seconds.

    A negative response time can be used to represent preemptive responses and

    `n/a` denotes a missed response.

    '
- source: bids
  class: columns
  name: sampling_frequency
  description: 'Sampling rate of the channel in Hz.

    '
- source: bids
  class: columns
  name: size
  description: 'Surface area of the electrode, units MUST be in `mm^2`.

    '
- source: bids
  class: columns
  name: time
  description: 'Time, in seconds, relative to `TimeZero` defined by the `*_pet.json`.

    For example, 5.

    '
- source: bids
  class: columns
  name: wavelength_nominal
  description: 'Specified wavelength of light in nm.

    `n/a` for channels that do not contain raw NIRS signals (for example, acceleration).

    This field is equivalent to `/nirs(i)/probe/wavelengths` in the SNIRF specification.

    '
- source: bids
  class: columns
  name: wavelength_actual
  description: 'Measured wavelength of light in nm.

    `n/a` for channels that do not contain raw NIRS signals (acceleration).

    This field is equivalent to `measurementList.wavelengthActual` in the SNIRF specification.

    '
- source: bids
  class: columns
  name: wavelength_emission_actual
  description: 'Measured emission wavelength of light in nm.

    `n/a` for channels that do not contain raw NIRS signals (acceleration).

    This field is equivalent to `measurementList.wavelengthEmissionActual` in the
    SNIRF specification.

    '
- source: bids
  class: columns
  name: whole_blood_radioactivity
  description: 'Radioactivity in whole blood samples,

    in unit of radioactivity measurements in whole blood samples (for example, `kBq/mL`).

    '
- source: bids
  class: columns
  name: x
  description: 'Recorded position along the x-axis.

    '
- source: bids
  class: columns
  name: y
  description: 'Recorded position along the y-axis.

    '
- source: bids
  class: columns
  name: z
  description: 'Recorded position along the z-axis.

    '
- source: bids
  class: columns
  name: x__optodes
  description: 'Recorded position along the x-axis.

    `"n/a"` if not available.

    '
- source: bids
  class: columns
  name: y__optodes
  description: 'Recorded position along the y-axis.

    `"n/a"` if not available.

    '
- source: bids
  class: columns
  name: z__optodes
  description: 'Recorded position along the z-axis.

    `"n/a"` if not available.

    '
- source: bids
  class: columns
  name: template_x
  description: 'Assumed or ideal position along the x axis.

    '
- source: bids
  class: columns
  name: template_y
  description: 'Assumed or ideal position along the y axis.

    '
- source: bids
  class: columns
  name: template_z
  description: 'Assumed or ideal position along the z axis.

    '
- source: bids
  class: metadata
  name: AcquisitionDuration
  description: 'Duration (in seconds) of scan acquisition, including all volumes for
    multi-volume scans.

    Corresponds to [DICOM Tag 0018, 9073](http://www.dicomlookup.com/dicomtags/(0018,9073))

    `Acquisition Duration`.

    '
- source: bids
  class: metadata
  name: AtlasSampleSize
  description: 'Number of items (typically, independent participants;

    although it could also refer to, for example, sessions)

    that were employed to create the corresponding atlas.

    '
- source: bids
  class: metadata
  name: AverageCalibrationError
  description: 'Average calibration error in degrees of visual angle.

    '
- source: bids
  class: metadata
  name: BackgroundSuppressionNumberPulses
  description: 'The number of background suppression pulses used.

    Note that this excludes any effect of background suppression pulses applied

    before the labeling.

    '
- source: bids
  class: metadata
  name: BloodDensity
  description: 'Measured blood density. Unit of blood density should be in `"g/mL"`.

    '
- source: bids
  class: metadata
  name: ChemicalShiftOffset
  description: 'The chemical shift at the center of `SpectralWidth` corresponding
    to 0 Hz,

    specified in ppm (for example, `4.65`).

    '
- source: bids
  class: metadata
  name: ChemicalShiftReference
  description: 'The chemical shift at the transmitter frequency, specified in ppm
    (for example, `2.68`).

    Corresponds to [DICOM Tag 0018, 9053](http://www.dicomlookup.com/dicomtags/(0018,9053))

    `Chemical Shift Reference`.

    '
- source: bids
  class: metadata
  name: DelayAfterTrigger
  description: 'Duration (in seconds) from trigger delivery to scan onset.

    This delay is commonly caused by adjustments and loading times.

    This specification is entirely independent of

    `"NumberOfVolumesDiscardedByScanner"` or `"NumberOfVolumesDiscardedByUser"`,

    as the delay precedes the acquisition.

    '
- source: bids
  class: metadata
  name: DelayTime
  description: 'User specified time (in seconds) to delay the acquisition of data
    for the

    following volume.

    If the field is not present it is assumed to be set to zero.

    Corresponds to Siemens CSA header field `lDelayTimeInTR`.

    This field is REQUIRED for sparse sequences using the `"RepetitionTime"` field

    that do not have the `"SliceTiming"` field set to allowed for accurate

    calculation of "acquisition time".

    This field is mutually exclusive with `"VolumeTiming"`.

    '
- source: bids
  class: metadata
  name: DispersionConstant
  description: 'External dispersion time constant resulting from tubing in default
    unit

    seconds.

    '
- source: bids
  class: metadata
  name: DoseCalibrationFactor
  description: 'Multiplication factor used to transform raw data (in counts/sec) to
    meaningful unit (Bq/ml).

    Corresponds to [DICOM Tag 0054, 1322](http://www.dicomlookup.com/dicomtags/(0054,1322))

    `Dose Calibration Factor`.

    '
- source: bids
  class: metadata
  name: DwellTime
  description: 'Actual dwell time (in seconds) of the receiver per point in the readout

    direction, including any oversampling.

    For Siemens, this corresponds to DICOM field 0019, 1018 (in ns).

    This value is necessary for the optional readout distortion correction of

    anatomicals in the HCP Pipelines.

    It also usefully provides a handle on the readout bandwidth,

    which isn''t captured in the other metadata tags.

    Not to be confused with `"EffectiveEchoSpacing"`, and the frequent mislabeling

    of echo spacing (which is spacing in the phase encoding direction) as

    "dwell time" (which is spacing in the readout direction).

    '
- source: bids
  class: metadata
  name: EchoTime1
  description: 'The time (in seconds) when the first (shorter) echo occurs.

    '
- source: bids
  class: metadata
  name: EchoTime2
  description: 'The time (in seconds) when the second (longer) echo occurs.

    '
- source: bids
  class: metadata
  name: EchoTime__fmap
  description: 'The time (in seconds) when the echo corresponding to this map was
    acquired.

    '
- source: bids
  class: metadata
  name: EffectiveEchoSpacing
  description: 'The "effective" sampling interval, specified in seconds,

    between lines in the phase-encoding direction,

    defined based on the size of the reconstructed image in the phase direction.

    It is frequently, but incorrectly, referred to as "dwell time"

    (see the `"DwellTime"` parameter for actual dwell time).

    It is required for unwarping distortions using field maps.

    Note that beyond just in-plane acceleration,

    a variety of other manipulations to the phase encoding need to be accounted

    for properly, including partial fourier, phase oversampling,

    phase resolution, phase field-of-view and interpolation.

    '
- source: bids
  class: metadata
  name: EpochLength
  description: 'Duration of individual epochs in seconds (for example, `1`)

    in case of epoched data.

    If recording was continuous or discontinuous, leave out the field.

    '
- source: bids
  class: metadata
  name: FrameAcquisitionDuration
  description: 'Duration (in seconds) of volume acquisition.

    Corresponds to DICOM Tag 0018, 9220 `Frame Acquisition Duration`.

    '
- source: bids
  class: metadata
  name: Gain
  description: 'Signal gain from an in-line amplifier, applied between the EMG sensor/device
    and the data acquisition computer.

    See also Preamplification.

    '
- source: bids
  class: metadata
  name: Haematocrit
  description: 'Measured haematocrit, meaning the volume of erythrocytes divided by
    the

    volume of whole blood.

    '
- source: bids
  class: metadata
  name: HeadCircumference
  description: 'Circumference of the participant''s head, expressed in cm (for example,
    `58`).

    '
- source: bids
  class: metadata
  name: ImageDecayCorrectionTime
  description: 'Point in time from which the decay correction was applied with respect
    to

    `"TimeZero"` in the default unit seconds.

    '
- source: bids
  class: metadata
  name: InfusionRadioactivity
  description: 'Amount of radioactivity infused into the patient.

    This value must be less than or equal to the total injected radioactivity

    (`"InjectedRadioactivity"`).

    Units should be the same as `"InjectedRadioactivityUnits"`.

    '
- source: bids
  class: metadata
  name: InfusionSpeed
  description: 'If given, infusion speed.

    '
- source: bids
  class: metadata
  name: InfusionStart
  description: 'Time of start of infusion with respect to `"TimeZero"` in the default
    unit

    seconds.

    '
- source: bids
  class: metadata
  name: InjectedMassPerWeight
  description: 'Injected mass per kilogram bodyweight.

    '
- source: bids
  class: metadata
  name: InjectedRadioactivity
  description: 'Total amount of radioactivity injected into the patient (for example,
    `400`).

    For bolus-infusion experiments, this value should be the sum of all injected

    radioactivity originating from both bolus and infusion.

    Corresponds to [DICOM Tag 0018, 1074](http://www.dicomlookup.com/dicomtags/(0018,1074))

    `Radionuclide Total Dose`.

    '
- source: bids
  class: metadata
  name: InjectedVolume
  description: 'Injected volume of the radiotracer in the unit `"mL"`.

    '
- source: bids
  class: metadata
  name: InjectionEnd
  description: 'Time of end of injection with respect to `"TimeZero"` in the default
    unit

    seconds.

    '
- source: bids
  class: metadata
  name: InjectionStart
  description: 'Time of start of injection with respect to `"TimeZero"` in the default
    unit

    seconds.

    This corresponds to [DICOM Tag 0018, 1072](http://www.dicomlookup.com/dicomtags/(0018,1072))

    `Contrast/Bolus Start Time` converted to seconds relative to `"TimeZero"`.

    '
- source: bids
  class: metadata
  name: InterelectrodeDistance
  description: 'Distance between pairs or grids of electrodes rigidly attached to
    the same sensor device.

    If multiple sensor devices with heterogeneous inter-electrode distances are recorded
    into

    the same data file,

    inter-electrode distance SHOULD be recorded in the `interelectrode_distance` column
    of

    `*_electrodes.tsv` instead.

    If instead those devices were recorded into separate data files (distinguished
    for example

    by the `recording` entity),

    separate `*_emg.json` files (similarly distinguished) MAY be included,

    each with their own `InterelectrodeDistance` values.

    '
- source: bids
  class: metadata
  name: InversionTime
  description: 'The inversion time (TI) for the acquisition, specified in seconds.

    Inversion time is the time after the middle of inverting RF pulse to middle

    of excitation pulse to detect the amount of longitudinal magnetization.

    Corresponds to [DICOM Tag 0018, 0082](http://www.dicomlookup.com/dicomtags/(0018,0082))

    `Inversion Time`

    (please note that the DICOM term is in milliseconds not seconds).

    '
- source: bids
  class: metadata
  name: LabelingDistance
  description: 'Distance from the center of the imaging slab to the center of the
    labeling

    plane (`(P)CASL`) or the leading edge of the labeling slab (`PASL`),

    in millimeters.

    If the labeling is performed inferior to the isocenter,

    this number should be negative.

    Based on DICOM macro C.8.13.5.14.

    '
- source: bids
  class: metadata
  name: LabelingEfficiency
  description: 'Labeling efficiency, specified as a number between zero and one,

    only if obtained externally (for example phase-contrast based).

    '
- source: bids
  class: metadata
  name: LabelingPulseAverageB1
  description: 'The average B1-field strength of the RF labeling pulses, in microteslas.

    As an alternative, `"LabelingPulseFlipAngle"` can be provided.

    '
- source: bids
  class: metadata
  name: LabelingPulseAverageGradient
  description: 'The average labeling gradient, in milliteslas per meter.

    '
- source: bids
  class: metadata
  name: LabelingPulseDuration
  description: 'Duration of the individual labeling pulses, in milliseconds.

    '
- source: bids
  class: metadata
  name: LabelingPulseFlipAngle
  description: 'The flip angle of a single labeling pulse, in degrees,

    which can be given as an alternative to `"LabelingPulseAverageB1"`.

    '
- source: bids
  class: metadata
  name: LabelingPulseInterval
  description: 'Delay between the peaks of the individual labeling pulses, in milliseconds.

    '
- source: bids
  class: metadata
  name: LabelingPulseMaximumGradient
  description: 'The maximum amplitude of the gradient switched on during the application
    of

    the labeling RF pulse(s), in milliteslas per meter.

    '
- source: bids
  class: metadata
  name: LabelingSlabThickness
  description: 'Thickness of the labeling slab in millimeters.

    For non-selective FAIR a zero is entered.

    Corresponds to [DICOM Tag 0018, 9254](http://www.dicomlookup.com/dicomtags/(0018,9254))

    `ASL Slab Thickness`.

    '
- source: bids
  class: metadata
  name: M0Estimate
  description: 'A single numerical whole-brain M0 value (referring to the M0 of blood),

    only if obtained externally

    (for example retrieved from CSF in a separate measurement).

    '
- source: bids
  class: metadata
  name: MTNumberOfPulses
  description: 'The number of magnetization transfer RF pulses applied before the
    readout.

    '
- source: bids
  class: metadata
  name: MTOffsetFrequency
  description: 'The frequency offset of the magnetization transfer pulse with respect
    to the

    central H1 Larmor frequency in Hertz (Hz).

    '
- source: bids
  class: metadata
  name: MTPulseBandwidth
  description: 'The excitation bandwidth of the magnetization transfer pulse in Hertz
    (Hz).

    '
- source: bids
  class: metadata
  name: MTPulseDuration
  description: 'Duration of the magnetization transfer RF pulse in seconds.

    '
- source: bids
  class: metadata
  name: MagneticFieldStrength
  description: 'Nominal field strength of MR magnet in Tesla.

    Corresponds to [DICOM Tag 0018, 0087](http://www.dicomlookup.com/dicomtags/(0018,0087))

    `Magnetic Field Strength`.

    '
- source: bids
  class: metadata
  name: Magnification
  description: 'Lens magnification (for example: `40`). If the file format is OME-TIFF,

    the value MUST be consistent with the `"NominalMagnification"` OME metadata field.

    '
- source: bids
  class: metadata
  name: MaxMovement
  description: 'Maximum head movement (in mm) detected during the recording,

    as measured by the head localization coils (for example, `4.8`).

    '
- source: bids
  class: metadata
  name: MaximalCalibrationError
  description: 'Maximal calibration error in degrees of visual angle.

    '
- source: bids
  class: metadata
  name: Maximum
  description: 'Maximum value a column entry is permitted to have.

    '
- source: bids
  class: metadata
  name: Minimum
  description: 'Minimum value a column entry is permitted to have.

    '
- source: bids
  class: metadata
  name: MixingTime
  description: 'In the context of a stimulated- and spin-echo 3D EPI sequence for
    B1+ mapping

    or a stimulated-echo MRS sequence,

    corresponds to the interval between spin- and stimulated-echo pulses.

    In the context of a diffusion-weighted double spin-echo sequence,

    corresponds to the interval between two successive diffusion sensitizing

    gradients, specified in seconds.

    '
- source: bids
  class: metadata
  name: MolarActivity
  description: 'Molar activity of compound injected.

    Corresponds to [DICOM Tag 0018, 1077](http://www.dicomlookup.com/dicomtags/(0018,1077))

    `Radiopharmaceutical Specific Activity`.

    '
- source: bids
  class: metadata
  name: MultibandAccelerationFactor
  description: 'The multiband factor, for multiband acquisitions.

    '
- source: bids
  class: metadata
  name: NumericalAperture
  description: 'Lens numerical aperture (for example: `1.4`). If the file format is
    OME-TIFF,

    the value MUST be consistent with the `LensNA` OME metadata field.

    '
- source: bids
  class: metadata
  name: ParallelReductionFactorInPlane
  description: 'The parallel imaging (for instance, GRAPPA) factor in plane.

    Use the denominator of the fraction of k-space encoded for each slice.

    For example, 2 means half of k-space is encoded.

    Corresponds to [DICOM Tag 0018, 9069](http://www.dicomlookup.com/dicomtags/(0018,9069))

    `Parallel Reduction Factor In-plane`.

    '
- source: bids
  class: metadata
  name: ParallelReductionFactorOutOfPlane
  description: 'The parallel imaging (for instance, GRAPPA) factor in the second phase
    encoding dimension of 3D sequences.

    Use the denominator of the fraction of k-space encoded in the second phase encoding
    dimension.

    For example, 2 means half of k-space is encoded.

    Will typically be 1 for 2D sequences, as each slice in a 2D acquisition is usually
    fully encoded.

    `ParallelReductionFactorOutOfPlane` should not be confused with `MultibandAccelerationFactor`,

    as they imply different methods of accelerating the acquisition.

    Corresponds to [DICOM Tag 0018, 9155](http://www.dicomlookup.com/dicomtags/(0018,9155))

    `Parallel Reduction Factor out-of-plane`.

    '
- source: bids
  class: metadata
  name: PartialFourier
  description: 'The fraction of partial Fourier information collected.

    '
- source: bids
  class: metadata
  name: PlasmaFreeFraction
  description: 'Measured free fraction in plasma, meaning the concentration of free
    compound

    in plasma divided by total concentration of compound in plasma

    (Units: 0-100%).

    '
- source: bids
  class: metadata
  name: Preamplification
  description: 'Amplification built into an EMG bipolar sensor, electrode grid, or
    other device.

    See also Gain.

    '
- source: bids
  class: metadata
  name: PulseDuration
  description: 'Pulse duration if spectral editing was applied, in milliseconds

    '
- source: bids
  class: metadata
  name: Purity
  description: 'Purity of the radiolabeled compound (between 0 and 100%).

    '
- source: bids
  class: metadata
  name: RecordingDuration
  description: 'Length of the recording in seconds (for example, `3600`).

    '
- source: bids
  class: metadata
  name: RepetitionTime
  description: 'The time in seconds between the beginning of an acquisition of one
    volume

    and the beginning of acquisition of the volume following it (TR).

    When used in the context of functional acquisitions this parameter best

    corresponds to

    [DICOM Tag 0020, 0110](http://www.dicomlookup.com/dicomtags/(0020,0110)):

    the "time delta between images in a

    dynamic of functional set of images" but may also be found in

    [DICOM Tag 0018, 0080](http://www.dicomlookup.com/dicomtags/(0018,0080)):

    "the period of time in msec between the beginning

    of a pulse sequence and the beginning of the succeeding

    (essentially identical) pulse sequence".

    This definition includes time between scans (when no data has been acquired)

    in case of sparse acquisition schemes.

    This value MUST be consistent with the ''pixdim[4]'' field (after accounting

    for units stored in ''xyzt_units'' field) in the NIfTI header.

    This field is mutually exclusive with VolumeTiming.

    '
- source: bids
  class: metadata
  name: RepetitionTimeExcitation
  description: 'The interval, in seconds, between two successive excitations.

    [DICOM Tag 0018, 0080](http://www.dicomlookup.com/dicomtags/(0018,0080))

    best refers to this parameter.

    This field may be used together with the `"RepetitionTimePreparation"` for

    certain use cases, such as

    [MP2RAGE](https://doi.org/10.1016/j.neuroimage.2009.10.002).

    Use `RepetitionTimeExcitation` (in combination with

    `"RepetitionTimePreparation"` if needed) for anatomy imaging data rather than

    `"RepetitionTime"` as it is already defined as the amount of time that it takes

    to acquire a single volume in the

    [task imaging data](SPEC_ROOT/modality-specific-files/magnetic-resonance-\

    imaging-data.md#task-including-resting-state-imaging-data)

    section.

    '
- source: bids
  class: metadata
  name: SamplingFrequency
  description: 'Sampling frequency (in Hz) of all the data in the recording,

    regardless of their type (for example, `2400`).

    '
- source: bids
  class: metadata
  name: SamplingFrequencyEffective
  description: 'Effective sampling frequency (in Hz) of all the data in the recording,

    regardless of their type (for example, `2400`) which can be determined if timestamps

    per sample are provided.

    '
- source: bids
  class: metadata
  name: ScanStart
  description: 'Time of start of scan with respect to `TimeZero` in the default unit
    seconds.

    '
- source: bids
  class: metadata
  name: ScreenRefreshRate
  description: 'Refresh rate of the screen (when used), in Hertz (equivalent to frames
    per second, "FPS").

    '
- source: bids
  class: metadata
  name: SliceThickness
  description: 'Slice thickness of the tissue sample in the unit micrometers (`"um"`)
    (for example: `5`).

    '
- source: bids
  class: metadata
  name: SpectralWidth
  description: 'The spectral bandwidth of the MR signal that is sampled, specified
    in Hz.

    Corresponds to [DICOM Tag 0018, 9052](http://www.dicomlookup.com/dicomtags/(0018,9052))

    `Spectral Width`.

    '
- source: bids
  class: metadata
  name: SpoilingGradientDuration
  description: 'The duration of the spoiler gradient lobe in seconds.

    The duration of a trapezoidal lobe is defined as the summation of ramp-up

    and plateau times.

    '
- source: bids
  class: metadata
  name: SpoilingGradientMoment
  description: 'Zeroth moment of the spoiler gradient lobe in

    millitesla times second per meter (mT.s/m).

    '
- source: bids
  class: metadata
  name: SpoilingRFPhaseIncrement
  description: 'The amount of incrementation described in degrees,

    which is applied to the phase of the excitation pulse at each TR period for

    achieving RF spoiling.

    '
- source: bids
  class: metadata
  name: StartTime
  description: 'Start time in seconds in relation to the start of acquisition of the
    first

    data sample in the corresponding (neural) dataset (negative values are allowed).

    This data MAY be specified with sub-second precision using the syntax `s[.000000]`,

    where `s` reflects whole seconds, and `.000000` reflects OPTIONAL fractional seconds.

    '
- source: bids
  class: metadata
  name: TissueDeformationScaling
  description: 'Estimated deformation of the tissue, given as a percentage of the
    original

    tissue size (for examples: for a shrinkage of 3%, the value is `97`;

    and for an expansion of 100%, the value is `200`).

    '
- source: bids
  class: metadata
  name: TotalAcquiredPairs
  description: 'The total number of acquired `control`-`label` pairs.

    A single pair consists of a single `control` and a single `label` image.

    '
- source: bids
  class: metadata
  name: TotalReadoutTime
  description: 'This is actually the "effective" total readout time,

    defined as the readout duration, specified in seconds,

    that would have generated data with the given level of distortion.

    It is NOT the actual, physical duration of the readout train.

    If `"EffectiveEchoSpacing"` has been properly computed,

    it is just `EffectiveEchoSpacing * (ReconMatrixPE - 1)`.

    '
- source: bids
  class: metadata
  name: TracerMolecularWeight
  description: 'Accurate molecular weight of the tracer used.

    '
- source: bids
  class: metadata
  name: TubingLength
  description: 'The length of the blood tubing, from the subject to the detector in
    meters.

    '
- source: bids
  class: metadata
  name: TrackedPointsCount
  description: 'Number of different tracked points tracked in a motion tracking system.

    '
- source: bids
  class: metadata
  name: WithdrawalRate
  description: 'The rate at which the blood was withdrawn from the subject.

    The unit of the specified withdrawal rate should be in `"mL/s"`.

    '
