- source: nwb
  class: NWBData
  name: NWBData
  description: An abstract data type for a dataset.
- source: nwb
  class: BaseImage
  name: BaseImage
  description: An abstract base type for image data. Parent type for Image and ExternalImage
    types.
- source: nwb
  class: BaseImage
  name: description
  description: Description of the image.
- source: nwb
  class: Image
  name: Image
  description: A type for storing image data directly. Shape can be 2-D (x, y), or
    3-D where the third dimension can have three or four elements, e.g. (x, y, (r,
    g, b)) or (x, y, (r, g, b, a)).
- source: nwb
  class: ExternalImage
  name: ExternalImage
  description: A type for referencing an external image file. The single file path
    or URI to the external image file should be stored in the dataset. This type should
    NOT be used if the image is stored in another NWB file and that file is linked
    to this file.
- source: nwb
  class: ExternalImage
  name: image_mode
  description: Image mode (color mode) of the image, e.g., "RGB", "RGBA", "grayscale",
    and "LA".
- source: nwb
  class: ExternalImage
  name: image_format
  description: Common name of the image file format. Only widely readable, open file
    formats are allowed. Allowed values are "PNG", "JPEG", and "GIF".
- source: nwb
  class: ImageReferences
  name: ImageReferences
  description: Ordered dataset of references to BaseImage (e.g., Image or ExternalImage)
