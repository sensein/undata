provenance:
- source: bids
  class: entities
  name: sample
  description: 'A sample pertaining to a subject such as tissue, primary cell or cell-free
    sample.

    The `sample-<label>` entity is used to distinguish between different samples from
    the same subject.

    The label MUST be unique per subject and is RECOMMENDED to be unique throughout
    the dataset.

    '
