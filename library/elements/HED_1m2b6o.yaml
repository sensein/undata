  class: enums
  name: fsaverage
  description: 'The `fsaverage` is a surface reference system

    (formerly described as fsaverage\[3\|4\|5\|6\|sym\]).

    Additionally, by convention,

    `fsaverage` is used as shorthand for a **dual template** providing both volumetric
    and

    surface coordinates references,

    where the surface template is `fsaverage` and the volumetric template corresponds
    to a

    FreeSurfer variant of `MNI305` space.


    Used by Freesurfer.

    '
- source: bids
