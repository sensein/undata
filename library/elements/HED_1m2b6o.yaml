  description: 'A directory to store any stimulus files used during an experiment.

    See the [relevant section](SPEC_ROOT/modality-agnostic-files/events.md#stimuli-directory)

    for more information.

    '
- source: bids
  class: formats
  name: index
  description: 'Non-negative, optionally prefixed with leading zeros for better visual
    homogeneity and sorting.

    '
- source: bids
  class: formats
  name: label
  description: 'Free-form labels with alphanumeric and plus (+) characters.


    Plus signs MAY be used to concatenate multiple applicable labels,

    but no relationship is established by a partial match.

    In particular, the inheritance principle does not connect files

    containing entities such as `<name>-x+y` with either `<name>-x` or `<name>-y`.

    For example, metadata stored in a file at the root of the dataset with name `/acq-6p_T2w.json`

    does not apply to files with partially matching "acquisition" entity values

    such as `/sub-1/anat/sub-1_acq-6p+s2_T2w.nii`.

    '
- source: bids
  class: formats
  name: boolean
  description: 'A boolean.

    Must be either "true" or "false".

    '
- source: bids
  class: formats
  name: integer
  description: 'An integer which may be positive or negative.

    '
- source: bids
  class: formats
