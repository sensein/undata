  description: 'A number which may be an integer or float, positive or negative.

    '
- source: bids
  class: formats
  name: string
  description: 'The basic string type (not a specific format).

    This should allow any free-form string.

    '
- source: bids
  class: formats
  name: hed_version
  description: 'The version string of the used HED schema.

    '
- source: bids
  class: formats
  name: bids_uri
  description: 'A BIDS uniform resource indicator.


    The validation for this format is minimal.

    It simply ensures that the value is a string with any characters that may appear
    in a valid URI,

    starting with "bids:".

    '
- source: bids
  class: formats
  name: dataset_relative
  description: 'A path to a file, relative to the dataset directory.


    The validation for this format is minimal.

    It simply ensures that the value is a string with any characters that may appear
    in a valid path,

    without starting with "/" (an absolute path).

    '
- source: bids
  class: formats
  name: date
  description: 'A date in the form `"YYYY-MM-DD[Z]"`,

    where [Z] is an optional, valid timezone code.

    '
- source: bids
  class: formats
  name: datetime
  description: 'An [RFC 3339](https://doi.org/10.17487/RFC3339) timestamp, with OPTIONAL
    time offset.

    Datetimes take the form `"YYYY-MM-DDThh:mm:ss[.000000][Z|+hh:mm|-hh:mm]"`,

    where `[.000000]` is an OPTIONAL subsecond resolution between 1 and 6 decimal
    points,

    and `[Z|+hh:mm|-hh:mm]` is a time offset.

    The character `Z` indicates Coordinated Universal Time (UTC),

    or else an integral number of minutes may be specified.


    For simplicity, this format validates RFC3339-invalid dates such as 2024-02-31,

    but implementations SHOULD error on non-existent dates and times.

    '
- source: bids
  class: formats
  name: file_relative
  description: 'A path to a file, relative to the file in which the field is defined.


    The validation for this format is minimal.

    It simply ensures that the value is a string with any characters that may appear
    in a valid path,

    without starting with "/" (an absolute path).

    '
- source: bids
  class: formats
  name: participant_relative
  description: 'A path to a file, relative to the participant''s directory in the
    dataset.


    The validation for this format is minimal.

    It simply ensures that the value is a string with any characters that may appear
    in a valid path,

    without starting with "/" (an absolute path) or "sub/"

    (a relative path starting with the participant directory, rather than relative
    to that directory).

    '
- source: bids
  class: formats
  name: rrid
  description: 'A [research resource identifier](https://rrid.site).

    '
- source: bids
  class: formats
  name: stimuli_relative
  description: 'A path to a stimulus file, relative to a `/stimuli` directory somewhere.


    The validation for this format is minimal.

    It simply ensures that the value is a string with any characters that may appear
    in a valid path,

    without starting with "/" (an absolute path) or "stimuli/"

    (a relative path starting with the stimuli directory, rather than relative to
    that directory).

    '
- source: bids
  class: formats
  name: time
  description: 'A time in the form `"hh:mm:ss"`.

    '
- source: bids
  class: formats
  name: unit
  description: 'A unit.

    SI units in CMIXF formatting are RECOMMENDED

    (see [Units](SPEC_ROOT/common-principles.md#units)).


    Currently this matches any string.


    TODO: Somehow reference the actual unit options in the Units appendix.

    '
- source: bids
  class: formats
  name: uri
  description: 'A uniform resource indicator.

    '
- source: bids
  class: metadata
  name: AnchorElectrode
  description: 'Name of the electrode in the child (device) coordinate system whose
    coordinates in

    the parent (anatomical) coordinate system are given in `AnchorCoordinates`.

    '
- source: bids
  class: metadata
  name: Acknowledgements
  description: 'Text acknowledging contributions of individuals or institutions beyond

    those listed in Authors or Funding.

    '
- source: bids
  class: metadata
  name: AcquisitionMode
  description: 'Type of acquisition of the PET data (for example, `"list mode"`).

    '
- source: bids
  class: metadata
  name: Anaesthesia
  description: 'Details of anaesthesia used, if any.

    '
- source: bids
  class: metadata
  name: AnalyticalApproach
  description: 'Methodology or methodologies used to analyze the `"GeneticLevel"`.

    Values MUST be taken from the

    [database of Genotypes and Phenotypes

    (dbGaP)](https://www.ncbi.nlm.nih.gov/gap/advanced)

    under /Study/Molecular Data Type (for example, SNP Genotypes (Array) or

    Methylation (CpG).

    '
- source: bids
  class: metadata
  name: AnatomicalImage
  description: 'The path(s) to the anatomical MR image file(s), if present,

    to which the associated MRS data file corresponds.

    Contains one or more [BIDS URIs](SPEC_ROOT/common-principles.md#bids-uri).

    '
- source: bids
  class: metadata
  name: AnatomicalLandmarkCoordinateSystem
  description: 'Defines the coordinate system for the anatomical landmarks.

    See the [Coordinate Systems Appendix](SPEC_ROOT/appendices/coordinate-systems.md)

    for a list of restricted keywords for coordinate systems.

    If `"Other"`, provide definition of the coordinate system in

    `"AnatomicalLandmarkCoordinateSystemDescription"`.

    '
- source: bids
  class: metadata
  name: AnatomicalLandmarkCoordinateSystemDescription
  description: 'Free-form text description of the coordinate system.

    May also include a link to a documentation page or paper describing the

    system in greater detail.

    '
- source: bids
  class: metadata
  name: AnatomicalLandmarkCoordinateUnits
  description: 'Units of the coordinates of `"AnatomicalLandmarkCoordinateSystem"`.

    '
- source: bids
  class: metadata
  name: ArterialSpinLabelingType
  description: 'The arterial spin labeling type.

    '
- source: bids
  class: metadata
  name: AssociatedEmptyRoom
  description: 'One or more [BIDS URIs](SPEC_ROOT/common-principles.md#bids-uri)

    pointing to empty-room file(s) associated with the subject''s MEG recording.

    Using forward-slash separated paths relative to the dataset root is

    [DEPRECATED](SPEC_ROOT/common-principles.md#definitions).

    '
- source: bids
  class: metadata
  name: AtlasName
  description: 'Name of the atlas.

    '
- source: bids
  class: metadata
  name: AttenuationCorrection
  description: 'Short description of the attenuation correction method used.

    '
- source: bids
  class: metadata
  name: AttenuationCorrectionMethodReference
  description: 'Reference paper for the attenuation correction method used.

    '
- source: bids
  class: metadata
  name: B0FieldIdentifier
  description: 'The presence of this key states that this particular 3D or 4D image
    MAY be

    used for fieldmap estimation purposes.

    Each `"B0FieldIdentifier"` MUST be a unique string within one participant''s tree,

    shared only by the images meant to be used as inputs for the estimation of a

    particular instance of the *B<sub>0</sub> field* estimation.

    It is RECOMMENDED to derive this identifier from DICOM Tags, for example,

    DICOM tag 0018, 1030 `Protocol Name`, or DICOM tag 0018, 0024 `Sequence Name`

    when the former is not defined (for example, in GE devices.)

    '
- source: bids
  class: metadata
  name: B0FieldSource
  description: 'At least one existing `"B0FieldIdentifier"` defined by images in the

    participant''s tree.

    This field states the *B<sub>0</sub> field* estimation designated by the

    `"B0FieldIdentifier"` that may be used to correct the dataset for distortions

    caused by B<sub>0</sub> inhomogeneities.

    `"B0FieldSource"` and `"B0FieldIdentifier"` MAY both be present for images that

    are used to estimate their own B<sub>0</sub> field, for example, in "pepolar"

    acquisitions.

    '
- source: bids
  class: metadata
  name: B0ShimmingTechnique
  description: 'The technique used to shim the *B*<sub>0</sub> field (for example,
    `"Dynamic shim updating"`

    or `"FASTMAP"`).

    '
- source: bids
  class: metadata
  name: B1ShimmingTechnique
  description: 'The technique used to shim the *B*<sub>1</sub> field (for example,
    `"Simple phase align"`

    or `"Pre-saturated TurboFLASH"`).

    '
- source: bids
  class: metadata
  name: BIDSVersion
  description: 'The version of the BIDS standard that was used.

    '
- source: bids
  class: metadata
  name: BasedOn
  description: 'List of files in a file collection to generate the map.

    Fieldmaps are also listed, if involved in the processing.

    This field is DEPRECATED, and this metadata SHOULD be recorded in the

    `Sources` field using [BIDS URIs](SPEC_ROOT/common-principles.md#bids-uri)

    to distinguish sources from different datasets.

    '
- source: bids
  class: metadata
  name: BodyPart
  description: 'Body part of the organ / body region scanned.

    '
- source: bids
  class: metadata
  name: BodyPartDetails
  description: 'Additional details about body part or location (for example: `"corpus
    callosum"`).

    '
- source: bids
  class: metadata
  name: BodyPartDetailsOntology
  description: '[URI](SPEC_ROOT/common-principles.md#uniform-resource-indicator) of
    ontology used for

    BodyPartDetails (for example: `"https://www.ebi.ac.uk/ols/ontologies/uberon"`).

    '
- source: bids
  class: metadata
  name: BolusCutOffDelayTime
  description: 'Duration between the end of the labeling and the start of the bolus
    cut-off

    saturation pulse(s), in seconds.

    This can be a number or array of numbers, of which the values must be

    non-negative and monotonically increasing, depending on the number of bolus

    cut-off saturation pulses.

    For Q2TIPS, only the values for the first and last bolus cut-off saturation

    pulses are provided.

    Based on [DICOM Tag 0018, 925F](http://www.dicomlookup.com/dicomtags/(0018,925F))

    `ASL Bolus Cut-off Delay Time`.

    '
- source: bids
  class: metadata
  name: BolusCutOffTechnique
  description: 'Name of the technique used, for example `"Q2TIPS"`, `"QUIPSS"`, `"QUIPSSII"`.

    Corresponds to [DICOM Tag 0018, 925E](http://www.dicomlookup.com/dicomtags/(0018,925E))

    `ASL Bolus Cut-off Technique`.

    '
- source: bids
  class: metadata
  name: BrainLocation
  description: 'Refers to the location in space of the `"TissueOrigin"`.

    Values may be an MNI coordinate,

    a label taken from the

    [Allen Brain Atlas](https://atlas.brain-map.org/atlas?atlas=265297125&plate=\

    112360888&structure=4392&x=40348.15104166667&y=46928.75&zoom=-7&resolution=\

    206.60&z=3),

    or layer to refer to layer-specific gene expression,

    which can also tie up with laminar fMRI.

    '
- source: bids
  class: metadata
  name: CalibrationType
  description: 'The type of the calibration procedure executed last.

    For example the `"H3"` for horizontal calibration with 3 positions

    or `"HV9"` for horizontal and vertical calibration with 9 positions,

    or one point calibration.

    '
- source: bids
  class: metadata
  name: CalibrationUnit
  description: 'Unit of `"CalibrationPosition"`.

    '
- source: bids
  class: metadata
  name: CASLType
  description: 'Describes if a separate coil is used for labeling.

    '
- source: bids
  class: metadata
  name: CapManufacturer
  description: 'Name of the cap manufacturer (for example, `"EasyCap"`).

    '
- source: bids
  class: metadata
  name: CapManufacturersModelName
  description: 'Manufacturer''s designation of the cap model

    (for example, `"actiCAP 64 Ch Standard-2"`).

    '
- source: bids
  class: metadata
  name: CellType
  description: 'Describes the type of cell analyzed.

    Values SHOULD come from the

    [cell ontology](https://obofoundry.org/ontology/cl.html).

    '
- source: bids
  class: metadata
  name: ChunkTransformationMatrix
  description: '3x3 or 4x4 affine transformation matrix describing spatial chunk transformation,

    for 2D and 3D respectively (for examples: `[[2, 0, 0], [0, 3, 0], [0, 0, 1]]`

    in 2D for 2x and 3x scaling along the first and second axis respectively; or

    `[[1, 0, 0, 0], [0, 2, 0, 0], [0, 0, 3, 0], [0, 0, 0, 1]]` in 3D for 2x and 3x

    scaling along the second and third axis respectively).

    Note that non-spatial dimensions like time and channel are not included in the

    transformation matrix.

    '
- source: bids
  class: metadata
  name: Code
  description: '[URI](SPEC_ROOT/common-principles.md#uniform-resource-indicator)

    of the code used to present the stimuli.

    Persistent identifiers such as DOIs are preferred.

    If multiple versions of code may be hosted at the same location,

    revision-specific URIs are recommended.

    '
- source: bids
  class: metadata
  name: CodeValue
  description: 'An identifier that is unambiguous within the Coding Scheme

    denoted by Coding Scheme Designator and Coding Scheme Version.

    Corresponds to [DICOM Tag 0008, 0100](http://www.dicomlookup.com/dicomtags/(0008,0100))

    `Code Value`.

    '
- source: bids
  class: metadata
  name: CodeMeaning
  description: 'Text that has meaning to a human and conveys the meaning of the term

    Corresponds to [DICOM Tag 0008, 0104](http://www.dicomlookup.com/dicomtags/(0008,0104))

    `Code Meaning`.

    '
- source: bids
  class: metadata
  name: CodingSchemeDesignator
  description: 'The identifier of the coding scheme in which the coded entry is defined.

    Corresponds to [DICOM Tag 0008, 0102](http://www.dicomlookup.com/dicomtags/(0008,0102))

    `Coding Scheme Designator`.

    '
- source: bids
  class: metadata
  name: CodingSchemeVersion
  description: 'An identifier of the version of the coding scheme if necessary to
    resolve ambiguity.

    Corresponds to [DICOM Tag 0008, 0103](http://www.dicomlookup.com/dicomtags/(0008,0103))

    `Coding Scheme Version`.

    '
- source: bids
  class: metadata
  name: CodeURL
  description: URL where the code used to generate the dataset may be found.
- source: bids
  class: metadata
  name: CogAtlasID
  description: '[URI](SPEC_ROOT/common-principles.md#uniform-resource-indicator)

    of the corresponding [Cognitive Atlas](https://www.cognitiveatlas.org/)

    Task term.

    '
- source: bids
  class: metadata
  name: CogPOID
  description: '[URI](SPEC_ROOT/common-principles.md#uniform-resource-indicator)

    of the corresponding [CogPO](http://www.cogpo.org/) term.

    '
- source: bids
  class: metadata
  name: CoilCombinationMethod
  description: 'Almost all fMRI studies using phased-array coils use root-sum-of-squares

    (rSOS) combination, but other methods exist.

    The image reconstruction is changed by the coil combination method

    (as for the matrix coil mode above),

    so anything non-standard should be reported.

    '
- source: bids
  class: metadata
  name: ContainerTag
  description: 'Tag of software container image used to produce the dataset

    '
- source: bids
  class: metadata
  name: ContainerType
  description: 'Type of software container image used to produce the dataset

    '
- source: bids
  class: metadata
  name: ContainerURI
  description: 'URI for software container image used to produce the dataset

    '
- source: bids
  class: metadata
  name: ContrastBolusIngredient
  description: 'Active ingredient of agent.

    Corresponds to [DICOM Tag 0018, 1048](http://www.dicomlookup.com/dicomtags/(0018,1048))

    `Contrast/Bolus Ingredient`.

    '
- source: bids
  class: metadata
  name: CoordinateReportStrategy
  description: 'Indicate the method of coordinate reporting in statistically significant
    clusters.

    Could be the "peak" statistical coordinate in the cluster or the

    "center_of_mass" of the cluster.

    '
- source: bids
  class: metadata
  name: DCOffsetCorrection
  description: 'A description of the method (if any) used to correct for a DC offset.

    If the method used was subtracting the mean value for each channel,

    use "mean".

    '
- source: bids
  class: metadata
  name: Database
  description: '[URI](SPEC_ROOT/common-principles.md#uniform-resource-indicator)

    of database where the dataset is hosted.

    '
- source: bids
  class: metadata
  name: Dataset
  description: '[URI](SPEC_ROOT/common-principles.md#uniform-resource-indicator)

    where data can be retrieved.

    '
- source: bids
  class: metadata
  name: DatasetDOI
  description: 'The Digital Object Identifier of the dataset (not the corresponding
    paper).

    DOIs SHOULD be expressed as a valid

    [URI](SPEC_ROOT/common-principles.md#uniform-resource-indicator);

    bare DOIs such as `10.0.2.3/dfjj.10` are

    [DEPRECATED](SPEC_ROOT/common-principles.md#definitions).

    '
- source: bids
  class: metadata
  name: DatasetType
  description: 'The interpretation of the dataset.

    For backwards compatibility, the default value is `"raw"`.

    '
- source: bids
  class: metadata
  name: Delimiter
  description: 'If rows in a column may be interpreted as a lists of values, the character
    that

    separates one value from the next.

    '
- source: bids
  class: metadata
  name: Density
  description: 'Specifies the interpretation of the density keyword.

    If an object is used, then the keys should be values for the `den` entity

    and values should be descriptions of those `den` values.

    '
- source: bids
  class: metadata
  name: DerivedFrom
  description: 'Indicate what data modality the atlas was derived from; for example,
    "cytoarchitecture", "resting-state", or "task".

    '
- source: bids
  class: metadata
  name: Description
  description: 'Free-form natural language description.

    '
- source: bids
  class: metadata
  name: Description__GeneratedBy
  description: 'Plain-text description of the pipeline or process that generated the
    outputs.

    RECOMMENDED if `Name` is `"Manual"`.

    '
- source: bids
  class: metadata
  name: DetectorType
  description: 'Type of detector. This is a free form description with the following
    suggested terms:

    `"SiPD"`, `"APD"`. Preferably a specific model/part number is supplied.

    If individual channels have different `DetectorType`,

    then the field here should be specified as `"mixed"`

    and this column should be included in `optodes.tsv`.

    '
- source: bids
  class: metadata
  name: Descriptors
  description: 'List of relevant descriptors (for example, journal articles) for dataset

    using a valid

    [URI](SPEC_ROOT/common-principles.md#uniform-resource-indicator)

    when possible.

    '
- source: bids
  class: metadata
  name: DeviceSerialNumber
  description: 'The serial number of the equipment that produced the measurements.

    A pseudonym can also be used to prevent the equipment from being

    identifiable, so long as each pseudonym is unique within the dataset.

    '
- source: bids
  class: metadata
  name: DewarPosition
  description: "Position of the dewar during the MEG scan:\n`\"upright\"`, `\"supine\"\
    ` or `\"degrees\"` of angle from vertical:\nfor example on CTF systems, `\"upright=15\xB0\
    , supine=90\xB0\"`.\n"
- source: bids
  class: metadata
  name: DigitizedHeadPoints__coordsystem
  description: 'Relative path to the file containing the locations of digitized head
    points

    collected during the session (for example, `"sub-01_headshape.pos"`).

    RECOMMENDED for all MEG systems, especially for CTF and BTi/4D.

    For Neuromag/Elekta/MEGIN, the head points will be stored in the `.fif` file.

    '
- source: bids
  class: metadata
  name: DigitizedHeadPointsCoordinateSystem
  description: 'Defines the coordinate system for the digitized head points.

    See the

    [Coordinate Systems Appendix](SPEC_ROOT/appendices/coordinate-systems.md)

    for a list of restricted keywords for coordinate systems.

    If `"Other"`, provide definition of the coordinate system in

    `"DigitizedHeadPointsCoordinateSystemDescription"`.

    '
- source: bids
  class: metadata
  name: DigitizedHeadPointsCoordinateSystemDescription
  description: 'Free-form text description of the coordinate system.

    May also include a link to a documentation page or paper describing the

    system in greater detail.

    '
- source: bids
  class: metadata
  name: DigitizedHeadPointsCoordinateUnits
  description: 'Units of the coordinates of `"DigitizedHeadPointsCoordinateSystem"`.

    '
- source: bids
  class: metadata
  name: DOI
  description: 'A Digital Object Identifier (DOI) is a persistent, resolvable name
    for a digital resource.

    (see [URI](SPEC_ROOT/common-principles.md#uniform-resource-indicator))

    '
- source: bids
  class: metadata
  name: EEGCoordinateSystem
  description: 'Defines the coordinate system for the EEG sensors.


    See the

    [Coordinate Systems Appendix](SPEC_ROOT/appendices/coordinate-systems.md)

    for a list of restricted keywords for coordinate systems.

    If `"Other"`, provide definition of the coordinate system in

    `EEGCoordinateSystemDescription`.

    '
- source: bids
  class: metadata
  name: EEGCoordinateSystemDescription
  description: 'Free-form text description of the coordinate system.

    May also include a link to a documentation page or paper describing the

    system in greater detail.

    '
- source: bids
  class: metadata
  name: EEGCoordinateUnits
  description: 'Units of the coordinates of `EEGCoordinateSystem`.

    '
- source: bids
  class: metadata
  name: EEGGround
  description: 'Description of the location of the ground electrode

    (for example, `"placed on right mastoid (M2)"`).

    '
- source: bids
  class: metadata
  name: EEGPlacementScheme
  description: 'Placement scheme of EEG electrodes.

    Either the name of a standardized placement system (for example, `"10-20"`)

    or a list of standardized electrode names (for example, `["Cz", "Pz"]`).

    '
- source: bids
  class: metadata
  name: EEGReference
  description: 'General description of the reference scheme used and (when applicable)
    of

    location of the reference electrode in the raw recordings

    (for example, `"left mastoid"`, `"Cz"`, `"CMS"`).

    If different channels have a different reference,

    this field should have a general description and the channel specific

    reference should be defined in the `channels.tsv` file.

    '
- source: bids
  class: metadata
  name: ElectrodeMaterial
  description: 'Material of the electrode (for example, `Tin`, `Ag/AgCl`, `Gold`).

    If multiple sensor devices with heterogeneous electrode materials are recorded
    into

    the same data file,

    electrode material SHOULD be recorded in the `material` column of `*_electrodes.tsv`
    instead.

    If instead those devices were recorded into separate data files (distinguished
    for example

    by the `recording` entity),

    separate `*_emg.json` files (similarly distinguished) MAY be included,

    each with their own `ElectrodeMaterial` values.

    '
- source: bids
  class: metadata
  name: ElectrodeType
  description: 'Type of the electrode (for example, cup, ring, clip-on, wire, needle).

    '
- source: bids
  class: metadata
  name: EMGCoordinateSystem
  description: 'Defines the coordinate system for the EMG sensors.


    See the

    [Coordinate Systems Appendix](SPEC_ROOT/appendices/coordinate-systems.md)

    for a list of restricted keywords for coordinate systems.

    If `"Other"`, provide definition of the coordinate system in

    `EMGCoordinateSystemDescription`.

    '
- source: bids
  class: metadata
  name: EMGCoordinateSystemDescription
  description: 'Free-form text description of the coordinate system, typically defining
    the origin

    and positive x,y,z axis directions, relative to anatomical landmarks.

    May also include a link to a documentation page or paper describing the

    system in greater detail.

    '
- source: bids
  class: metadata
  name: EMGCoordinateUnits
  description: 'Units of the coordinates of `EMGCoordinateSystem`.

    '
- source: bids
  class: metadata
  name: EMGGround
  description: 'Description of the location of the ground electrode

    (for example, `"right radial styloid process"`).

    '
- source: bids
  class: metadata
  name: EMGPlacementScheme
  description: 'The way in which electrode placement locations were determined.

    If electrode locations are provided as coordinates in `*_electrodes.tsv` in reference

    to a coordinate system defined in `*_coordsystem.json`, then specify `"Measured"`.

    If approach to placement varied across sensor devices, specify `"ChannelSpecific"`

    and include placement details in the `placement_scheme` column of `*_channels.tsv`.

    If a standardized electrode placement procedure (for example, SENIAM 8) was followed,

    or if an ad-hoc procedure was followed, specify `"Other"` and provide details
    in

    `EMGPlacementSchemeDescription`.

    '
- source: bids
  class: metadata
  name: EMGPlacementSchemeDescription
  description: 'Additional details of the approach to EMG sensor placement.

    Descriptions SHOULD NOT simply give the name of the targeted muscle (use the

    `target_muscle` column in `*_channels.tsv` for that), but rather SHOULD reflect
    the

    process used by the researcher(s) when placing electrodes.

    For example, EMG electrode sites may be chosen by *measured distance* from anatomical

    landmarks, by *visual reference* to (parts of) target muscles, by *palpation*
    of the

    skin to locate target muscles, or by *functional localization* (temporary electrode

    placement at several sites during prescribed behavior, until a site yielding strong

    EMG signal is found).

    '
- source: bids
  class: metadata
  name: EMGReference
  description: 'Description of the approach to signal referencing.

    If the same signal source is used as reference for all channels (often called
    a

    "monopolar" recording), specify the signal source (typically an electrode name).

    If different channels have different reference electrodes, this field SHOULD contain

    the string `"ChannelSpecific"` and each channel''s reference SHOULD be given in
    the

    `reference` column of `*_channels.tsv`.

    For bipolar recording devices (where a single sensor unit contains two rigidly

    separated contacts, and the paired contacts are not listed independently in

    `*_electrodes.tsv`), this field SHOULD be `"Bipolar"`.

    '
- source: bids
  class: metadata
  name: EchoAcquisition
  description: 'How the detected echo was acquired when the analog-to-digital converter
    was turned on.

    For example, `"Half echo"`, `"Full echo"`.

    '
- source: bids
  class: metadata
  name: EchoTime
  description: 'The echo time (TE) for the acquisition, specified in seconds.

    Corresponds to [DICOM Tag 0018, 0081](http://www.dicomlookup.com/dicomtags/(0018,0081))

    `Echo Time`

    (please note that the DICOM term is in milliseconds not seconds).

    The data type number may apply to files from any MRI modality concerned with

    a single value for this field, or to the files in a

    [file collection](SPEC_ROOT/appendices/file-collections.md)

    where the value of this field is iterated using the

    [`echo` entity](SPEC_ROOT/appendices/entities.md#echo).

    '
- source: bids
  class: metadata
  name: EditCondition
  description: 'If spectral editing was applied, this lists the application order
    of `"EditPulse"`.

    For example, `["ON", "OFF"]` for a MEGA-edited experiment or

    `["A", "B", "C", "D"]` for a HERMES-edited experiment.

    '
- source: bids
  class: metadata
  name: EditTarget
  description: 'If spectral editing was applied, this describes the metabolites that
    were selectively targeted

    (for example, `"GABA"` or `"Lac"`).

    If multiple metabolites were targeted (for example, in a HERMES acquisition),

    an array can be used: `["GABA", "GSH"]`.

    '
- source: bids
  class: metadata
  name: ElectricalStimulationParameters
  description: 'Free form description of stimulation parameters, such as frequency
    or shape.

    Specific onsets can be specified in the `events.tsv` file.

    Specific shapes can be described here in freeform text.

    '
- source: bids
  class: metadata
  name: ElectrodeManufacturer
  description: 'Can be used if all electrodes are of the same manufacturer

    (for example, `"AD-TECH"`, `"DIXI"`).

    If electrodes of different manufacturers are used,

    please use the corresponding table in the `_electrodes.tsv` file.

    '
- source: bids
  class: metadata
  name: ElectrodeManufacturersModelName
  description: 'If different electrode types are used,

    please use the corresponding table in the `_electrodes.tsv` file.

    '
- source: bids
  class: metadata
  name: EncodingTechnique
  description: 'The encoding technique used during readout.

    For example, `"Cartesian"`, `"EPSI"`, `"Spiral"`,

    or `"Density-weighted concentric ring trajectory"`.

    '
- source: bids
  class: metadata
  name: EstimationAlgorithm
  description: 'Type of algorithm used to perform fitting

    (for example, `"linear"`, `"non-linear"`, `"LM"` and such).

    '
- source: bids
  class: metadata
  name: EstimationReference
  description: 'Reference to the study/studies on which the implementation is based.

    '
- source: bids
  class: metadata
  name: EyeTrackerDistance
  description: 'Distance (in meters) between the eye-tracker and the participant eye(s).

    Distance can either be expressed as a single numeric value indicating the shortest
    distance

    between the participant''s eye and the eye-tracker''s camera, or a three-coordinates
    array

    indicating the X, Y, Z distances between the participant''s eye and the eye-tracker''s

    camera.

    '
- source: bids
  class: metadata
  name: EyeTrackingMethod
  description: "Method used to track gaze or pupil position:\n\"P\u2013CR\" for video\
    \ based eye-tracking using pupil and corneal reflection;\n\"DPI\" for Dual-Purkinje\
    \ Imaging system, \"SSC\" for scleral search coils;\n\"EOG\" for electro-oculogram;\
    \ \"Limbus\" for trackers estimating limbus borders\nbetween the iris and sclera;\
    \ or other.\n"
- source: bids
  class: metadata
  name: FiducialsCoordinateSystem
  description: 'Defines the coordinate system for the fiducials.

    Preferably the same as the `"EEGCoordinateSystem"`.

    See the

    [Coordinate Systems Appendix](SPEC_ROOT/appendices/coordinate-systems.md)

    for a list of restricted keywords for coordinate systems.

    If `"Other"`, provide definition of the coordinate system in

    `"FiducialsCoordinateSystemDescription"`.

    '
- source: bids
  class: metadata
  name: FiducialsCoordinateSystemDescription
  description: 'Free-form text description of the coordinate system.

    May also include a link to a documentation page or paper describing the

    system in greater detail.

    '
- source: bids
  class: metadata
  name: FiducialsCoordinateUnits
  description: 'Units in which the coordinates that are  listed in the field

    `"FiducialsCoordinateSystem"` are represented.

    '
- source: bids
  class: metadata
  name: FiducialsDescription
  description: 'Free-form text description of how the fiducials such as vitamin-E
    capsules

    were placed relative to anatomical landmarks,

    and how the position of the fiducials were measured

    (for example, `"both with Polhemus and with T1w MRI"`).

    '
- source: bids
  class: metadata
  name: FlipAngle
  description: 'Flip angle (FA) for the acquisition, specified in degrees.

    Corresponds to: [DICOM Tag 0018, 1314](http://www.dicomlookup.com/dicomtags/(0018,1314))

    `Flip Angle`.

    The data type number may apply to files from any MRI modality concerned with

    a single value for this field, or to the files in a

    [file collection](SPEC_ROOT/appendices/file-collections.md)

    where the value of this field is iterated using the

    [`flip` entity](SPEC_ROOT/appendices/entities.md#flip).

    '
- source: bids
  class: metadata
  name: OnsetSource
  description: 'An existing column name in an corresponding recoding data TSV file
    that

    indexes or is correspondent to the `"onset"` column of the present TSV file.

    For example, `"timestamp"` column.

    '
- source: bids
  class: metadata
  name: Format
  description: 'Permitted formats for values in the described column.

    '
- source: bids
  class: metadata
  name: FrequencyOffset
  description: 'List or value for frequency offset for spectral editing in ppm. See
    EditPulse

    '
- source: bids
  class: metadata
  name: GeneticLevel
  description: 'Describes the level of analysis.

    Values MUST be one of `"Genetic"`, `"Genomic"`, `"Epigenomic"`,

    `"Transcriptomic"`, `"Metabolomic"`, or `"Proteomic"`.


    For more information on these levels, see

    [Multi-omics approaches to disease](https://genomebiology.biomedcentral.com/articles/10.1186/s13059-017-1215-1)

    by Hasin et al. 2017.

    '
- source: bids
  class: metadata
  name: GradientSetType
  description: 'It should be possible to infer the gradient coil from the scanner
    model.

    If not, for example because of a custom upgrade or use of a gradient

    insert set, then the specifications of the actual gradient coil should be

    reported independently.

    '
- source: bids
  class: metadata
  name: HED
  description: 'Hierarchical Event Descriptor (HED) information,

    see the [HED Appendix](SPEC_ROOT/appendices/hed.md) for details.

    '
- source: bids
  class: metadata
  name: HEDVersion
  description: 'If HED tags are used:

    The version of the HED schema used to validate HED tags for study.

    May include a single schema or a base schema and one or more library schema.

    '
- source: bids
  class: metadata
  name: HardcopyDeviceSoftwareVersion
  description: 'Manufacturer''s designation of the software of the device that created
    this

    Hardcopy Image (the printer).

    Corresponds to [DICOM Tag 0018, 101A](http://www.dicomlookup.com/dicomtags/(0018,101A))

    `Hardcopy Device Software Version`.

    '
- source: bids
  class: metadata
  name: HardwareFilters
  description: 'Object of temporal hardware filters applied, or `"n/a"` if the data
    is not

    available. Each key-value pair in the JSON object is a name of the filter and

    an object in which its parameters are defined as key-value pairs.

    For example, `{"Highpass RC filter": {"Half amplitude cutoff (Hz)":

    0.0159, "Roll-off": "6dB/Octave"}}`.

    '
- source: bids
  class: metadata
  name: HeadCoilCoordinateSystem
  description: 'Defines the coordinate system for the head coils.

    See the

    [Coordinate Systems Appendix](SPEC_ROOT/appendices/coordinate-systems.md)

    for a list of restricted keywords for coordinate systems.

    If `"Other"`, provide definition of the coordinate system in

    `HeadCoilCoordinateSystemDescription`.

    '
- source: bids
  class: metadata
  name: HeadCoilCoordinateSystemDescription
  description: 'Free-form text description of the coordinate system.

    May also include a link to a documentation page or paper describing the system
    in greater detail.

    '
- source: bids
  class: metadata
  name: HeadCoilCoordinateUnits
  description: 'Units of the coordinates of `HeadCoilCoordinateSystem`.

    '
- source: bids
  class: metadata
  name: HeadCoilFrequency
  description: 'List of frequencies (in Hz) used by the head localization coils

    (''HLC'' in CTF systems, ''HPI'' in Neuromag/Elekta/MEGIN, ''COH'' in BTi/4D)

    that track the subject''s head position in the MEG helmet

    (for example, `[293, 307, 314, 321]`).

    '
- source: bids
  class: metadata
  name: HeadStabilization
  description: 'Head restraint method used during the experiment

    to prevent rotation and/or translation of the head.

    Example: "chin-rest", "head-rest", "bite-bar", "chin-rest and head-rest", "none"

    '
- source: bids
  class: metadata
  name: HowToAcknowledge
  description: 'Text containing instructions on how researchers using this dataset
    should

    acknowledge the original authors.

    This field can also be used to define a publication that should be cited in

    publications that use the dataset.

    '
- source: bids
  class: metadata
  name: ImageAcquisitionProtocol
  description: 'Description of the image acquisition protocol or

    [URI](SPEC_ROOT/common-principles.md#uniform-resource-indicator)

    (for example from [protocols.io](https://www.protocols.io/)).

    '
- source: bids
  class: metadata
  name: Immersion
  description: 'Lens immersion medium. If the file format is OME-TIFF, the value MUST
    be consistent

    with the `Immersion` OME metadata field.

    '
- source: bids
  class: metadata
  name: InfusionSpeedUnits
  description: 'Unit of infusion speed (for example, `"mL/s"`).

    '
- source: bids
  class: metadata
  name: InjectedMass
  description: 'Total mass of radiolabeled compound injected into subject (for example,
    `10`).

    This can be derived as the ratio of the `"InjectedRadioactivity"` and

    `"MolarRadioactivity"`.

    **For those tracers in which injected mass is not available (for example FDG)

    can be set to `"n/a"`)**.

    '
- source: bids
  class: metadata
  name: InjectedMassPerWeightUnits
  description: 'Unit format of the injected mass per kilogram bodyweight

    (for example, `"ug/kg"`).

    '
- source: bids
  class: metadata
  name: InjectedMassUnits
  description: 'Unit format of the mass of compound injected (for example, `"ug"`
    or

    `"umol"`).

    **Note this is not required for an FDG acquisition, since it is not available,

    and SHOULD be set to `"n/a"`**.

    '
- source: bids
  class: metadata
  name: InjectedRadioactivityUnits
  description: 'Unit format of the specified injected radioactivity (for example,
    `"MBq"`).

    '
- source: bids
  class: metadata
  name: InstitutionAddress
  description: 'The address of the institution in charge of the equipment that produced
    the

    measurements.

    '
- source: bids
  class: metadata
  name: InstitutionName
  description: 'The name of the institution in charge of the equipment that produced
    the

    measurements.

    '
- source: bids
  class: metadata
  name: InstitutionalDepartmentName
  description: 'The department in the institution in charge of the equipment that
    produced

    the measurements.

    '
- source: bids
  class: metadata
  name: Instructions
  description: 'Text of the instructions given to participants before the recording.

    '
- source: bids
  class: metadata
  name: IntendedFor
  description: 'The paths to files for which the associated file is intended to be
    used.

    Contains one or more [BIDS URIs](SPEC_ROOT/common-principles.md#bids-uri).

    Using forward-slash separated paths relative to the participant subdirectory is

    [DEPRECATED](SPEC_ROOT/common-principles.md#definitions).

    '
- source: bids
  class: metadata
  name: IntendedFor__ds_relative
  description: 'The paths to files for which the associated file is intended to be
    used.

    Contains one or more [BIDS URIs](SPEC_ROOT/common-principles.md#bids-uri).

    Using forward-slash separated paths relative to the dataset root is

    [DEPRECATED](SPEC_ROOT/common-principles.md#definitions).

    '
- source: bids
  class: metadata
  name: LabelingDuration
  description: 'Total duration of the labeling pulse train, in seconds,

    corresponding to the temporal width of the labeling bolus for

    `"PCASL"` or `"CASL"`.

    In case all control-label volumes (or deltam or CBF) have the same

    `LabelingDuration`, a scalar must be specified.

    In case the control-label volumes (or deltam or cbf) have a different

    `"LabelingDuration"`, an array of numbers must be specified,

    for which any `m0scan` in the timeseries has a `"LabelingDuration"` of zero.

    In case an array of numbers is provided,

    its length should be equal to the number of volumes specified in

    `*_aslcontext.tsv`.

    Corresponds to [DICOM Tag 0018, 9258](http://www.dicomlookup.com/dicomtags/(0018,9258))

    `ASL Pulse Train Duration`.

    '
- source: bids
  class: metadata
  name: LabelingLocationDescription
  description: 'Description of the location of the labeling plane (`"CASL"` or `"PCASL"`)
    or

    the labeling slab (`"PASL"`) that cannot be captured by fields

    `LabelingOrientation` or `LabelingDistance`.

    May include a link to a deidentified screenshot of the planning of the

    labeling slab/plane with respect to the imaging slab or slices

    `*_asllabeling.*`.

    Based on DICOM macro C.8.13.5.14.

    '
- source: bids
  class: metadata
  name: LevelType
  description: 'Indicate what analysis level the atlas was derived from; for example,
    "group" or "individual".

    '
- source: bids
  class: metadata
  name: License
  description: 'The license for the dataset.

    The use of license name abbreviations is RECOMMENDED for specifying a license

    (see [Licenses](SPEC_ROOT/appendices/licenses.md)).

    The corresponding full license text MAY be specified in an additional

    `LICENSE` file.

    '
- source: bids
  class: metadata
  name: LongName
  description: 'Long (unabbreviated) name of the column.

    '
- source: bids
  class: metadata
  name: M0Type
  description: 'Describes the presence of M0 information.

    `"Separate"` means that a separate `*_m0scan.nii[.gz]` is present.

    `"Included"` means that an m0scan volume is contained within the current

    `*_asl.nii[.gz]`.

    `"Estimate"` means that a single whole-brain M0 value is provided.

    `"Absent"` means that no specific M0 information is present.

    '
- source: bids
  class: metadata
  name: MEGCoordinateSystem
  description: 'Defines the coordinate system for the MEG sensors.

    See the

    [Coordinate Systems Appendix](SPEC_ROOT/appendices/coordinate-systems.md)

    for a list of restricted keywords for coordinate systems.

    If `"Other"`, provide definition of the coordinate system in

    `"MEGCoordinateSystemDescription"`.

    '
- source: bids
  class: metadata
  name: MEGCoordinateSystemDescription
  description: 'Free-form text description of the coordinate system.

    May also include a link to a documentation page or paper describing the

    system in greater detail.

    '
- source: bids
  class: metadata
  name: MEGCoordinateUnits
  description: 'Units of the coordinates of `"MEGCoordinateSystem"`.

    '
- source: bids
  class: metadata
  name: MRAcquisitionType
  description: 'Type of sequence readout.

    Corresponds to [DICOM Tag 0018, 0023](http://www.dicomlookup.com/dicomtags/(0018,0023))

    `MR Acquisition Type`.

    '
- source: bids
  class: metadata
  name: MRTransmitCoilSequence
  description: 'This is a relevant field if a non-standard transmit coil is used.

    Corresponds to [DICOM Tag 0018, 9049](http://www.dicomlookup.com/dicomtags/(0018,9049))

    `MR Transmit Coil Sequence`.

    '
- source: bids
  class: metadata
  name: MTPulseShape
  description: 'Shape of the magnetization transfer RF pulse waveform.

    The value `"GAUSSHANN"` refers to a Gaussian pulse with a Hanning window.

    The value `"SINCHANN"` refers to a sinc pulse with a Hanning window.

    The value `"SINCGAUSS"` refers to a sinc pulse with a Gaussian window.

    '
- source: bids
  class: metadata
  name: Manufacturer
  description: 'Manufacturer of the equipment that produced the measurements.

    '
- source: bids
  class: metadata
  name: ManufacturersModelName
  description: 'Manufacturer''s model name of the equipment that produced the measurements.

    '
- source: bids
  class: metadata
  name: MatrixCoilMode
  description: '(If used)

    A method for reducing the number of independent channels by combining in

    analog the signals from multiple coil elements.

    There are typically different default modes when using un-accelerated or

    accelerated (for example, `"GRAPPA"`, `"SENSE"`) imaging.

    '
- source: bids
  class: metadata
  name: MetaboliteMethod
  description: 'Method used to measure metabolites.

    '
- source: bids
  class: metadata
  name: MissingValues
  description: 'Describes how missing values are represented in the given recording
    system

    (for example a tracking system in motion), can take values such as, "NaN", "0".

    '
- source: bids
  class: metadata
  name: ModeOfAdministration
  description: 'Mode of administration of the injection

    (for example, `"bolus"`, `"infusion"`, or `"bolus-infusion"`).

    '
- source: bids
  class: metadata
  name: MolarActivityMeasTime
  description: 'Time to which molar radioactivity measurement above applies in the
    default

    unit `"hh:mm:ss"`.

    '
- source: bids
  class: metadata
  name: MolarActivityUnits
  description: 'Unit of the specified molar radioactivity (for example, `"GBq/umol"`).

    '
- source: bids
  class: metadata
  name: MultipartID
  description: 'A unique (per participant) label tagging DWI runs that are part of
    a

    multipart scan.

    '
- source: bids
  class: metadata
  name: Name
  description: 'Name of the dataset.

    '
- source: bids
  class: metadata
  name: Name__GeneratedBy
  description: 'Name of the pipeline or process that generated the outputs. Use `"Manual"`
    to

    indicate the derivatives were generated by hand, or adjusted manually after an

    initial run of an automated pipeline.

    '
- source: bids
  class: metadata
  name: NIRSPlacementScheme
  description: 'Placement scheme of NIRS optodes.

    Either the name of a standardized placement system (for example, `"10-20"`)

    or an array of standardized position names (for example, `["Cz", "Pz"]`).

    This field should only be used if a cap was not used.

    If a standard cap was used, then it should be specified in `CapManufacturer`

    and `CapManufacturersModelName` and this field should be set to `"n/a"`

    '
- source: bids
  class: metadata
  name: NIRSCoordinateSystem
  description: 'Defines the coordinate system in which the optode positions are expressed.


    See

    [Appendix VIII](SPEC_ROOT/appendices/coordinate-systems.md)

    for a list of restricted keywords for coordinate systems.

    If `"Other"`, a definition of the coordinate system MUST be

    provided in `NIRSCoordinateSystemDescription`.

    '
- source: bids
  class: metadata
  name: NIRSCoordinateSystemDescription
  description: 'Free-form text description of the coordinate system.

    May also include a link to a documentation page or paper describing the

    system in greater detail.

    '
- source: bids
  class: metadata
  name: NIRSCoordinateUnits
  description: 'Units of the coordinates of `NIRSCoordinateSystem`.

    '
- source: bids
  class: metadata
  name: NIRSCoordinateProcessingDescription
  description: 'Has any post-processing (such as projection) been done on the optode

    positions (for example, `"surface_projection"`, `"n/a"`).

    '
- source: bids
  class: metadata
  name: NumberShots
  description: 'The number of RF excitations needed to reconstruct a slice or volume

    (may be referred to as partition).

    Please mind that this is not the same as Echo Train Length which denotes the

    number of k-space lines collected after excitation in a multi-echo readout.

    The data type array is applicable for specifying this parameter before and

    after the k-space center is sampled.

    Please see

    [`"NumberShots"` metadata field]\

    (SPEC_ROOT/appendices/qmri.md#numbershots-metadata-field)

    in the qMRI appendix for corresponding calculations.

    '
- source: bids
  class: metadata
  name: OperatingSystem
  description: 'Operating system used to run the stimuli presentation software

    (for formatting recommendations, see examples below this table).

    '
- source: bids
  class: metadata
  name: OtherAcquisitionParameters
  description: 'Description of other relevant image acquisition parameters.

    '
- source: bids
  class: metadata
  name: PASLType
  description: 'Type of the labeling pulse of the `PASL` labeling,

    for example `"FAIR"`, `"EPISTAR"`, or `"PICORE"`.

    '
- source: bids
  class: metadata
  name: PCASLType
  description: 'The type of gradient pulses used in the `control` condition.

    '
- source: bids
  class: metadata
  name: ParallelAcquisitionTechnique
  description: 'The type of parallel imaging used (for example `"GRAPPA"`, `"SENSE"`).

    Corresponds to [DICOM Tag 0018, 9078](http://www.dicomlookup.com/dicomtags/(0018,9078))

    `Parallel Acquisition Technique`.

    '
- source: bids
  class: metadata
  name: ParentCoordinateSystem
  description: 'The name of a JSON mapping key that defines the parent (anatomical)
    coordinate system

    in which this child (device) coordinate system is anchored.

    '
- source: bids
  class: metadata
  name: PartialFourierDirection
  description: 'The direction where only partial Fourier information was collected.

    Corresponds to [DICOM Tag 0018, 9036](http://www.dicomlookup.com/dicomtags/(0018,9036))

    `Partial Fourier Direction`.

    '
- source: bids
  class: metadata
  name: PharmaceuticalDoseAmount
  description: 'Dose amount of administered pharmaceutical.

    '
- source: bids
  class: metadata
  name: PharmaceuticalDoseRegimen
  description: 'Details of the pharmaceutical dose regimen.

    Either adequate description or short-code relating to regimen documented

    elsewhere (for example, `"single oral bolus"`).

    '
- source: bids
  class: metadata
  name: PharmaceuticalDoseTime
  description: 'Time of administration of pharmaceutical dose, relative to time zero.

    For an infusion, this should be a vector with two elements specifying the

    start and end of the infusion period. For more complex dose regimens,

    the regimen description should be complete enough to enable unambiguous

    interpretation of `"PharmaceuticalDoseTime"`.

    Unit format of the specified pharmaceutical dose time MUST be seconds.

    '
- source: bids
  class: metadata
  name: PharmaceuticalDoseUnits
  description: 'Unit format relating to pharmaceutical dose

    (for example, `"mg"` or `"mg/kg"`).

    '
- source: bids
  class: metadata
  name: PharmaceuticalName
  description: 'Name of pharmaceutical.

    '
- source: bids
  class: metadata
  name: PhaseEncodingDirection
  description: 'The letters `i`, `j`, `k` correspond to the first, second and third
    axis of

    the data in the NIFTI file.

    The polarity of the phase encoding is assumed to go from zero index to

    maximum index unless `-` sign is present

    (then the order is reversed - starting from the highest index instead of

    zero).

    `PhaseEncodingDirection` is defined as the direction along which phase is was

    modulated which may result in visible distortions.

    Note that this is not the same as the DICOM term

    `InPlanePhaseEncodingDirection` which can have `ROW` or `COL` values.

    '
- source: bids
  class: metadata
  name: PhotoDescription
  description: 'Description of the photo.

    '
- source: bids
  class: metadata
  name: PhysioType
  description: 'Defines the specific type of physiological recording.

    For backwards compatibility, the default value is `"generic"`.

    '
- source: bids
  class: metadata
  name: PixelSizeUnits
  description: 'Unit format of the specified `"PixelSize"`. MUST be one of: `"mm"`
    (millimeter), `"um"`

    (micrometer) or `"nm"` (nanometer).

    '
- source: bids
  class: metadata
  name: PlasmaFreeFractionMethod
  description: 'Method used to estimate free fraction.

    '
- source: bids
  class: metadata
  name: PostLabelingDelay
  description: 'This is the postlabeling delay (PLD) time, in seconds, after the end
    of the

    labeling (for `"CASL"` or `"PCASL"`) or middle of the labeling pulse

    (for `"PASL"`) until the middle of the excitation pulse applied to the

    imaging slab (for 3D acquisition) or first slice (for 2D acquisition).

    Can be a number (for a single-PLD time series) or an array of numbers

    (for multi-PLD and Look-Locker).

    In the latter case, the array of numbers contains the PLD of each volume,

    namely each `control` and `label`, in the acquisition order.

    Any image within the time-series without a PLD, for example an `m0scan`,

    is indicated by a zero.

    Based on DICOM Tags 0018, 9079 `Inversion Times` and 0018, 0082

    `InversionTime`.

    '
- source: bids
  class: metadata
  name: PowerLineFrequency
  description: 'Frequency (in Hz) of the power grid at the geographical location of
    the

    instrument (for example, `50` or `60`).

    '
- source: bids
  class: metadata
  name: PulseSequenceDetails
  description: 'Information beyond pulse sequence type that identifies the specific
    pulse

    sequence used (for example,

    `"Standard Siemens Sequence distributed with the VB17 software"`,

    `"Siemens WIP ### version #.##,"` or

    `"Sequence written by X using a version compiled on MM/DD/YYYY"`).

    '
- source: bids
  class: metadata
  name: PulseSequenceType
  description: 'A general description of the pulse sequence used for the scan.

    '
- source: bids
  class: metadata
  name: PupilFitMethod
  description: 'The method employed for fitting the pupil, for example

    `"centre-of-mass"` or `"ellipse"`.

    If `"centre-of-mass"` or `"ellipse"` method is used, it is RECOMMENDED to

    use these exact labels.

    '
- source: bids
  class: metadata
  name: RRID
  description: '[Research Resource Identifier](https://rrid.site) of the file,

    dataset or atlas being described.

    '
- source: bids
  class: metadata
  name: RawDataFilters
  description: 'Filter settings applied to eye-movement raw data.

    '
- source: bids
  class: metadata
  name: ReceiveCoilActiveElements
  description: 'Information describing the active/selected elements of the receiver
    coil.

    This does not correspond to a tag in the DICOM ontology.

    The vendor-defined terminology for active coil elements can go in this field.

    '
- source: bids
  class: metadata
  name: ReceiveCoilName
  description: 'Information describing the receiver coil.

    Corresponds to [DICOM Tag 0018, 1250](http://www.dicomlookup.com/dicomtags/(0018,1250))

    `Receive Coil Name`,

    although not all vendors populate that DICOM Tag,

    in which case this field can be derived from an appropriate

    private DICOM field.

    '
- source: bids
  class: metadata
  name: ReceiveGain
  description: 'The gain of the receive coil.

    '
- source: bids
  class: metadata
  name: ReconFilterSize
  description: 'Kernel size of post-recon filter (FWHM) in default units `"mm"`.

    '
- source: bids
  class: metadata
  name: ReconFilterType
  description: 'Type of post-recon smoothing (for example, `["Shepp"]`).

    '
- source: bids
  class: metadata
  name: ReconMethodImplementationVersion
  description: 'Identification for the software used, such as name and version.

    '
- source: bids
  class: metadata
  name: ReconMethodName
  description: 'Reconstruction method or algorithm (for example, `"3d-op-osem"`).

    '
- source: bids
  class: metadata
  name: RecordedEye
  description: 'Indicates the eye being tracked, for example, `"left"` or `"right"`.

    It SHOULD be set to `"cyclopean"` for recordings combining both eyes

    as potentially generated by binocular eye-trackers.

    '
- source: bids
  class: metadata
  name: RecordingType
  description: 'Defines whether the recording is `"continuous"`, `"discontinuous"`,
    or

    `"epoched"`, where `"epoched"` is limited to time windows about events of

    interest (for example, stimulus presentations or subject responses).

    '
- source: bids
  class: metadata
  name: ReferenceSignal
  description: 'The path(s) to the MRS reference file(s), if present, to which the
    associated

    MRS data file corresponds.

    Contains one or more [BIDS URIs](SPEC_ROOT/common-principles.md#bids-uri).

    '
- source: bids
  class: metadata
  name: RepetitionTimePreparation
  description: 'The interval, in seconds, that it takes a preparation pulse block
    to

    re-appear at the beginning of the succeeding (essentially identical) pulse

    sequence block.

    The data type number may apply to files from any MRI modality concerned with

    a single value for this field.

    The data type array provides a value for each volume in a 4D dataset and

    should only be used when the volume timing is critical for interpretation of

    the data, such as in

    [ASL](SPEC_ROOT/modality-specific-files/magnetic-resonance-imaging-data.md\

    #arterial-spin-labeling-perfusion-data).

    '
- source: bids
  class: metadata
  name: Resolution
  description: 'Specifies the interpretation of the resolution keyword.

    If an object is used, then the keys should be values for the `res` entity

    and values should be descriptions of those `res` values.

    '
- source: bids
  class: metadata
  name: ResonantNucleus
  description: 'The isotope of interest of an MR experiment (for example, `"1H"`,
    `"13C"`, `"31P"`).

    For multi-nuclei experiments such as <sup>1</sup>H-[<sup>13</sup>C] MR,

    an array can be used: `["1H", "13C"]`.

    Corresponds to [DICOM Tag 0018, 9100](http://www.dicomlookup.com/dicomtags/(0018,9100))

    `Resonant Nucleus`.

    '
- source: bids
  class: metadata
  name: RotationOrder
  description: 'Specify the sequence in which the elemental 3D extrinsic rotations
    are applied around the three distinct axes.

    '
- source: bids
  class: metadata
  name: RotationRule
  description: 'In case orientation channels are present, indicate whether rotations
    are applied

    clockwise around an axis when seen from the positive direction (left-hand rule)
    or

    counter-clockwise (right-hand rule). Must be one of: "left-hand", "right-hand".

    '
- source: bids
  class: metadata
  name: SampleCoordinateSystem
  description: 'Coordinate system of the gaze position recordings.

    Generally eye-trackers are set to use `"gaze-on-screen"` coordinate system, but
    you may use

    `"eye-in-head"` or `"gaze-in-world"`.

    If none of the three default options properly describe the coordinate system,
    the

    `"custom"` keyword MUST be employed and the coordinate system MUST be described

    using additional metadata entries.

    '
- source: bids
  class: metadata
  name: SampleEmbedding
  description: 'Description of the tissue sample embedding (for example: `"Epoxy resin"`).

    '
- source: bids
  class: metadata
  name: SampleEnvironment
  description: 'Environment in which the sample was imaged. MUST be one of: `"in vivo"`,
    `"ex vivo"`

    or `"in vitro"`.

    '
- source: bids
  class: metadata
  name: SampleExtractionInstitution
  description: 'The name of the institution in charge of the extraction of the sample,

    if different from the institution in charge of the equipment that produced the
    image.

    '
- source: bids
  class: metadata
  name: SampleExtractionProtocol
  description: 'Description of the sample extraction protocol or

    [URI](SPEC_ROOT/common-principles.md#uniform-resource-indicator)

    (for example from [protocols.io](https://www.protocols.io/)).

    '
- source: bids
  class: metadata
  name: SampleFixation
  description: 'Description of the tissue sample fixation

    (for example: `"4% paraformaldehyde, 2% glutaraldehyde"`).

    '
- source: bids
  class: metadata
  name: SampleOrigin
  description: 'Describes from which tissue the genetic information was extracted.

    '
- source: bids
  class: metadata
  name: SamplePrimaryAntibody
  description: 'Description(s) of the primary antibody used for immunostaining.

    Either an [RRID](https://rrid.site) or the name, supplier and catalog

    number of a commercial antibody.

    For non-commercial antibodies either an [RRID](https://rrid.site) or the

    host-animal and immunogen used (for examples: `"RRID:AB_2122563"` or

    `"Rabbit anti-Human HTR5A Polyclonal Antibody, Invitrogen, Catalog # PA1-2453"`).

    MAY be an array of strings if different antibodies are used in each channel of
    the file.

    '
- source: bids
  class: metadata
  name: SampleSecondaryAntibody
  description: 'Description(s) of the secondary antibody used for immunostaining.

    Either an [RRID](https://rrid.site) or the name, supplier and catalog

    number of a commercial antibody.

    For non-commercial antibodies either an [RRID](https://rrid.site) or the

    host-animal and immunogen used (for examples: `"RRID:AB_228322"` or

    `"Goat anti-Mouse IgM Secondary Antibody, Invitrogen, Catalog # 31172"`).

    MAY be an array of strings if different antibodies are used in each channel of
    the file.

    '
- source: bids
  class: metadata
  name: SampleStaining
  description: 'Description(s) of the tissue sample staining (for example: `"Osmium"`).

    MAY be an array of strings if different stains are used in each channel of the
    file

    (for example: `["LFB", "PLP"]`).

    '
- source: bids
  class: metadata
  name: SamplingFrequency__nirs
  description: 'Sampling frequency (in Hz) of all the data in the recording,

    regardless of their type (for example, `2400`).

    '
- source: bids
  class: metadata
  name: ScanDate
  description: 'Date of scan in the format `"YYYY-MM-DD[Z]"`.

    This field is DEPRECATED, and this metadata SHOULD be recorded in the `acq_time`
    column of the

    corresponding [Scans file](SPEC_ROOT/modality-agnostic-files/data-summary-files.md#scans-file).

    '
- source: bids
  class: metadata
  name: ScanOptions
  description: 'Parameters of ScanningSequence.

    Corresponds to [DICOM Tag 0018, 0022](http://www.dicomlookup.com/dicomtags/(0018,0022))

    `Scan Options`.

    '
- source: bids
  class: metadata
  name: ScanningSequence
  description: 'Description of the type of data acquired.

    Corresponds to [DICOM Tag 0018, 0020](http://www.dicomlookup.com/dicomtags/(0018,0020))

    `Scanning Sequence`.

    '
- source: bids
  class: metadata
  name: ScanningSequence__mrs
  description: 'Description of the type of data acquired.

    '
- source: bids
  class: metadata
  name: ScreenDistance
  description: 'Distance between the participant''s eye and the screen. If no screen
    was used, use `n/a`.

    Distance can either be expressed as a single numeric value indicating the shortest
    distance between

    the participant''s eye and the screen, or a three-coordinates array indicating
    the X, Y, Z distances

    between the participant''s eye and the center of the screen.

    '
- source: bids
  class: metadata
  name: ScreenResolution
  description: 'Screen resolution in pixel

    (for example `[1920, 1200]` for a screen of 1920-width by 1080-height pixels),

    if no screen use `n/a`.

    `ScreenResolution` is REQUIRED when the experiment included simultaneous eye-tracking

    recordings with `SampleCoordinateSystem` matching `"gaze-on-screen"`.

    '
- source: bids
  class: metadata
  name: ScreenSize
  description: 'Screen size in m, excluding potential screen borders

    (for example `[0.472, 0.295]` for a screen of 47.2-width by 29.5-height cm),

    if no screen use `n/a`.

    `ScreenSize` is REQUIRED when the experiment included simultaneous eye-tracking

    recordings with `SampleCoordinateSystem` matching `"gaze-on-screen"`.

    '
- source: bids
  class: metadata
  name: SequenceName
  description: 'Manufacturer''s designation of the sequence name.

    Corresponds to [DICOM Tag 0018, 0024](http://www.dicomlookup.com/dicomtags/(0018,0024))

    `Sequence Name`.

    '
- source: bids
  class: metadata
  name: SequenceVariant
  description: 'Variant of the ScanningSequence.

    Corresponds to [DICOM Tag 0018, 0021](http://www.dicomlookup.com/dicomtags/(0018,0021))

    `Sequence Variant`.

    '
- source: bids
  class: metadata
  name: SkinPreparation
  description: 'How skin was prepared prior to sensor device placement, for example,
    `"alcohol wipe"`

    or `"abrasive gel"`.

    '
- source: bids
  class: metadata
  name: SliceEncodingDirection
  description: 'The axis of the NIfTI data along which slices were acquired,

    and the direction in which `"SliceTiming"` is defined with respect to.

    `i`, `j`, `k` identifiers correspond to the first, second and third axis of

    the data in the NIfTI file.

    A `-` sign indicates that the contents of `"SliceTiming"` are defined in

    reverse order - that is, the first entry corresponds to the slice with the

    largest index, and the final entry corresponds to slice index zero.

    When present, the axis defined by `"SliceEncodingDirection"` needs to be

    consistent with the `slice_dim` field in the NIfTI header.

    When absent, the entries in `"SliceTiming"` must be in the order of increasing

    slice index as defined by the NIfTI header.

    '
- source: bids
  class: metadata
  name: SoftwareFilters
  description: '[Object](https://www.json.org/json-en.html)

    of temporal software filters applied, or `"n/a"` if the data is

    not available.

    Each key-value pair in the JSON object is a name of the filter and an object

    in which its parameters are defined as key-value pairs

    (for example, `{"Anti-aliasing filter":

    {"half-amplitude cutoff (Hz)": 500, "Roll-off": "6dB/Octave"}}`).

    '
- source: bids
  class: metadata
  name: SoftwareName
  description: 'Name of the software that was used to present the stimuli.

    '
- source: bids
  class: metadata
  name: SoftwareRRID
  description: '[Research Resource Identifier](https://rrid.site) of the

    software that was used to present the stimuli.

    Examples: The RRID for Psychtoolbox is ''SCR_002881'',

    and that of PsychoPy is ''SCR_006571''.

    '
- source: bids
  class: metadata
  name: SoftwareVersion
  description: 'Version of the software that was used to present the stimuli.

    '
- source: bids
  class: metadata
  name: SoftwareVersions
  description: 'Manufacturer''s designation of software version of the equipment that
    produced

    the measurements.

    '
- source: bids
  class: metadata
  name: SourceType
  description: 'Type of source. Preferably a specific model/part number is supplied.

    This is a freeform description, but the following keywords are suggested:

    `"LED"`, `"LASER"`, `"VCSEL"`. If individual channels have different SourceType,

    then the field here should be specified as "mixed"

    and this column should be included in optodes.tsv.

    '
- source: bids
  class: metadata
  name: SpatialAxes
  description: 'Refers to the coordinate system in which the motion data are to be
    interpreted,

    if the recorded data can be mapped to a fixed reference frame. A sequence of

    characters F/B (forward-backward), L/R (left-right), and U/D (up-down). The

    position of a character in the sequence determines which of the X,Y,Z axes it

    maps to. For example, "FRD" for X-forward, Y-right, Z-down. For 1D or 2D cases,

    only specify the used axes and use the character "_" for unused axes

    ("F_R" when the Y axis is not used, for instance).

    '
- source: bids
  class: metadata
  name: SpatialReference
  description: 'String or object describing the reference image to which the current
    image is aligned.

    For images with a single reference, the value MUST be a single string.

    For images with multiple references, such as surface and volume references,

    a JSON object MUST be used.

    '
- source: bids
  class: metadata
  name: Species
  description: 'The `species` column SHOULD be a binomial species name from the

    [NCBI Taxonomy](https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi)

    (for example, `homo sapiens`, `mus musculus`, `rattus norvegicus`).

    For backwards compatibility, if `species` is absent, the participant is assumed
    to be

    `homo sapiens`.

    '
- source: bids
  class: metadata
  name: SpecificRadioactivity
  description: 'Specific activity of compound injected.

    **Note this is not required for an FDG acquisition, since it is not available,

    and SHOULD be set to `"n/a"`**.

    '
- source: bids
  class: metadata
  name: SpecificRadioactivityMeasTime
  description: 'Time to which specific radioactivity measurement above applies in
    the default

    unit `"hh:mm:ss"`.

    '
- source: bids
  class: metadata
  name: SpecificRadioactivityUnits
  description: 'Unit format of specified specific radioactivity (for example, `"Bq/g"`).

    **Note this is not required for an FDG acquisition, since it is not available,

    and SHOULD be set to `"n/a"`**.

    '
- source: bids
  class: metadata
  name: SpectrometerFrequency
  description: 'The frequency of the spectrometer, specified in MHz.

    For example, this could be `127.764` for a 3T scanner tuned

    to the resonant frequency of <sup>1</sup>H.

    For multi-nuclei experiments such as <sup>1</sup>H-[<sup>13</sup>C] MR at 3T,

    an array can be used: `[127.731, 32.125]`.

    '
- source: bids
  class: metadata
  name: SpoilingType
  description: 'Specifies which spoiling method(s) are used by a spoiled sequence.

    '
- source: bids
  class: metadata
  name: StationName
  description: 'Institution defined name of the machine that produced the measurements.

    '
- source: bids
  class: metadata
  name: SubjectArtefactDescription
  description: 'Freeform description of the observed subject artifact and its possible
    cause

    (for example, `"Vagus Nerve Stimulator"`, `"non-removable implant"`).

    If this field is set to `"n/a"`, it will be interpreted as absence of major

    source of artifacts except cardiac and blinks.

    '
- source: bids
  class: metadata
  name: TaskDescription
  description: 'Longer description of the task.

    '
- source: bids
  class: metadata
  name: TaskName
  description: 'Name of the task.

    No two tasks should have the same name.

    The task label included in the filename MAY be derived from this `"TaskName"`
    field

    by removing all non-alphanumeric or `+` characters (that is, all except those
    matching `[0-9a-zA-Z+]`),

    and potentially replacing spaces with `+` to ease readability.

    For example `"TaskName"` `"faces n-back"` or `"head nodding"` could correspond
    to task labels

    `faces+n+back` or `facesnback` and `head+nodding` or `headnodding`, respectively.

    '
- source: bids
  class: metadata
  name: TermURL
  description: 'URL pointing to a formal definition of this type of data in an ontology
    available on the web.

    For example: https://www.ncbi.nlm.nih.gov/mesh/68008297 for "male".

    '
- source: bids
  class: metadata
  name: TimeZero
  description: 'Time zero to which all scan and/or blood measurements have been adjusted
    to,

    in the unit "hh:mm:ss".

    This should be equal to `"InjectionStart"` or `"ScanStart"`.

    '
- source: bids
  class: metadata
  name: TissueOrigin
  description: 'Describes the type of tissue analyzed for `"SampleOrigin"` `brain`.

    '
- source: bids
  class: metadata
  name: TracerMolecularWeightUnits
  description: 'Unit of the molecular weights measurement (for example, `"g/mol"`).

    '
- source: bids
  class: metadata
  name: TracerName
  description: 'Name of the tracer compound used (for example, `"CIMBI-36"`)

    '
- source: bids
  class: metadata
  name: TracerRadLex
  description: 'ID of the tracer compound from the RadLex Ontology.

    '
- source: bids
  class: metadata
  name: TracerRadionuclide
  description: 'Radioisotope labeling tracer (for example, `"C11"`).

    '
- source: bids
  class: metadata
  name: TracerSNOMED
  description: 'ID of the tracer compound from the SNOMED Ontology

    (subclass of Radioactive isotope).

    '
- source: bids
  class: metadata
  name: TrackingSystemName
  description: 'A human-readable name of the tracking system to complement `"tracksys"`
    label

    of the corresponding *_motion.tsv filename.

    '
- source: bids
  class: metadata
  name: TubingType
  description: 'Description of the type of tubing used, ideally including the material
    and

    (internal) diameter.

    '
- source: bids
  class: metadata
  name: Type
  description: 'Short identifier of the mask.

    The value `"Brain"` refers to a brain mask.

    The value `"Lesion"` refers to a lesion mask.

    The value `"Face"` refers to a face mask.

    The value `"ROI"` refers to a region of interest mask.

    '
- source: bids
  class: metadata
  name: Units
  description: 'Measurement units for the associated variable.

    SI units in CMIXF formatting are RECOMMENDED

    (see [Units](SPEC_ROOT/common-principles.md#units)).

    '
- source: bids
  class: metadata
  name: URL
  description: 'A Uniform Resource Locator (URL) is a structured reference to an object
    that

    includes a resource transfer scheme and a location.

    (see [URI](SPEC_ROOT/common-principles.md#uniform-resource-indicator))

    '
- source: bids
  class: metadata
  name: VascularCrushingVENC
  description: 'The crusher gradient strength, in centimeters per second.

    Specify either one number for the total time-series, or provide an array of

    numbers, for example when using QUASAR, using the value zero to identify

    volumes for which `VascularCrushing` was turned off.

    Corresponds to [DICOM Tag 0018, 925A](http://www.dicomlookup.com/dicomtags/(0018,925A))

    `ASL Crusher Flow Limit`.

    '
- source: bids
  class: metadata
  name: Version__Dataset
  description: Version of the dataset.
- source: bids
  class: metadata
  name: Version__GeneratedBy
  description: Version of the pipeline
- source: bids
  class: metadata
  name: VisionCorrection
  description: 'Equipment used to correct participant vision during an experiment.

    Example: "spectacles", "lenses", "none".

    '
- source: bids
  class: metadata
  name: WaterSuppressionTechnique
  description: 'The name of the pulse sequence used for water suppression (for example,
    `"CHESS"`, `"VAPOR"`).

    '
- source: bids
  class: metadata
  name: iEEGCoordinateProcessingDescription
  description: 'Has any post-processing (such as projection) been done on the electrode

    positions (for example, `"surface_projection"`, `"none"`).

    '
- source: bids
  class: metadata
  name: iEEGCoordinateProcessingReference
  description: 'A reference to a paper that defines in more detail the method used
    to

    localize the electrodes and to post-process the electrode positions.

    '
- source: bids
  class: metadata
  name: iEEGCoordinateSystem
  description: 'Defines the coordinate system for the iEEG sensors.

    See the

    [Coordinate Systems Appendix](SPEC_ROOT/appendices/coordinate-systems.md)

    for a list of restricted keywords for coordinate systems.

    If `"Other"`, provide definition of the coordinate system in

    `iEEGCoordinateSystemDescription`.

    If positions correspond to pixel indices in a 2D image

    (of either a volume-rendering, surface-rendering, operative photo, or

    operative drawing), this MUST be `"Pixels"`.

    For more information, see the section on

    [2D coordinate systems](SPEC_ROOT/modality-specific-files/intracranial\

    -electroencephalography.md#allowed-2d-coordinate-systems).

    '
- source: bids
  class: metadata
  name: iEEGCoordinateSystemDescription
  description: 'Free-form text description of the coordinate system.

    May also include a link to a documentation page or paper describing the

    system in greater detail.

    '
- source: bids
  class: metadata
  name: iEEGCoordinateUnits
  description: 'Units of the `*_electrodes.tsv`.

    MUST be `"pixels"` if `iEEGCoordinateSystem` is `Pixels`.

    '
- source: bids
  class: metadata
  name: iEEGElectrodeGroups
  description: 'Field to describe the way electrodes are grouped into strips, grids
    or depth

    probes.

    For example, `"grid1: 10x8 grid on left temporal pole, strip2: 1x8 electrode

    strip on xxx"`.

    '
- source: bids
  class: metadata
  name: iEEGGround
  description: 'Description of the location of the ground electrode

    (`"placed on right mastoid (M2)"`).

    '
- source: bids
  class: metadata
  name: iEEGPlacementScheme
  description: 'Freeform description of the placement of the iEEG electrodes.

    Left/right/bilateral/depth/surface

    (for example, `"left frontal grid and bilateral hippocampal depth"` or

    `"surface strip and STN depth"` or

    `"clinical indication bitemporal, bilateral temporal strips and left grid"`).

    '
- source: bids
  class: metadata
  name: iEEGReference
  description: 'General description of the reference scheme used and (when applicable)
    of

    location of the reference electrode in the raw recordings

    (for example, `"left mastoid"`, `"bipolar"`,

    `"T01"` for electrode with name T01,

    `"intracranial electrode on top of a grid, not included with data"`,

    `"upside down electrode"`).

    If different channels have a different reference,

    this field should have a general description and the channel specific

    reference should be defined in the `channels.tsv` file.

    '
- source: bids
  class: metaentities
  name: matches
  description: '`matches` is used as a placeholder in BIDS filenames templates to
    denote that several files

    share exactly the same sequence of entities and labels in their basename.


    For example, in the following filename template:


    ```Text

    <matches>_bold.nii.gz

    <matches>_events.tsv

    <matches>_events.json

    ```


    `<matches>` could correspond to `sub-control01_task-nback_run-1`.

    '
- source: bids
  class: metaentities
  name: source-entities
  description: '`source-entities` is used as a placeholder in BIDS derivatives filenames
    templates.


    `source-entities` MUST be the entire source filename, with the omission of

    the source suffix and extension.

    One exception to this rule is filename entities that are no longer relevant.

    '
- source: bids
  class: modalities
  name: mri
  description: 'Data acquired with an MRI scanner.

    '
- source: bids
  class: modalities
  name: eeg
  description: 'Data acquired with EEG.

    '
- source: bids
  class: modalities
  name: emg
  description: 'Data acquired with EMG.

    '
- source: bids
  class: modalities
  name: ieeg
  description: 'Data acquired with iEEG.

    '
- source: bids
  class: modalities
  name: meg
  description: 'Data acquired with an MEG scanner.

    '
- source: bids
  class: modalities
  name: beh
  description: 'Behavioral data acquired without accompanying neuroimaging data.

    '
- source: bids
  class: modalities
  name: pet
  description: 'Data acquired with PET.

    '
- source: bids
  class: modalities
  name: micr
  description: 'Data acquired with a microscope.

    '
- source: bids
  class: modalities
  name: motion
  description: 'Data acquired with Motion-Capture systems.

    '
- source: bids
  class: modalities
  name: nirs
  description: Data acquired with NIRS.
- source: bids
  class: modalities
  name: mrs
  description: Data acquired with MRS.
- source: bids
  class: suffixes
  name: TwoPE
  description: '2-photon excitation microscopy imaging data

    '
- source: bids
  class: suffixes
  name: ADC
  description: Apparent diffusion coefficient (ADC) map
- source: bids
  class: suffixes
  name: BF
  description: 'Bright-field microscopy imaging data

    '
- source: bids
  class: suffixes
  name: Chimap
  description: 'In parts per million (ppm).

    QSM allows for determining the underlying magnetic susceptibility of tissue

    (Chi)

    ([Wang & Liu, 2014](https://doi.org/10.1002/mrm.25358)).

    Chi maps are REQUIRED to use this suffix regardless of the method used to

    generate them.

    '
- source: bids
  class: suffixes
  name: CARS
  description: 'Coherent anti-Stokes Raman spectroscopy imaging data

    '
- source: bids
  class: suffixes
  name: CONF
  description: 'Confocal microscopy imaging data

    '
- source: bids
  class: suffixes
  name: DIC
  description: 'Differential interference contrast microscopy imaging data

    '
- source: bids
  class: suffixes
  name: DF
  description: 'Dark-field microscopy imaging data

    '
- source: bids
  class: suffixes
  name: FA
  description: 'Scanner-generated derivative parametric map

    reflecting the anisotropy of the diffusion tensor

    '
- source: bids
  class: suffixes
  name: FLAIR
  description: 'In arbitrary units (arbitrary).

    Structural images with predominant T2 contribution (also known as T2-FLAIR),

    in which signal from fluids (for example, CSF) is nulled out by adjusting

    inversion time, coupled with notably long repetition and echo times.

    '
- source: bids
  class: suffixes
  name: FLASH
  description: 'FLASH (Fast-Low-Angle-Shot) is a vendor-specific implementation for
    spoiled

    gradient echo acquisition.

    It is commonly used for rapid anatomical imaging and also for many different

    qMRI applications.

    When used for a single file, it does not convey any information about the

    image contrast.

    When used in a file collection, it may result in conflicts across filenames of

    different applications.

    **Change:** Removed from suffixes.

    '
- source: bids
  class: suffixes
  name: FLUO
  description: 'Fluorescence microscopy imaging data

    '
- source: bids
  class: suffixes
  name: IRT1
  description: 'The IRT1 method involves multiple inversion recovery spin-echo images

    acquired at different inversion times

    ([Barral et al. 2010](https://doi.org/10.1002/mrm.22497)).

    '
- source: bids
  class: suffixes
  name: M0map
  description: 'In arbitrary units (arbitrary).

    A common quantitative MRI (qMRI) fitting variable that represents the amount

    of magnetization at thermal equilibrium.

    M0 maps are RECOMMENDED to use this suffix if generated by qMRI applications

    (for example, variable flip angle T1 mapping).

    '
- source: bids
  class: suffixes
  name: MEGRE
  description: 'Anatomical gradient echo images acquired at different echo times.

    Please note that this suffix is not intended for the logical grouping of

    images acquired using an Echo Planar Imaging (EPI) readout.

    '
- source: bids
  class: suffixes
  name: MESE
  description: 'The MESE method involves multiple spin echo images acquired at different
    echo

    times and is primarily used for T2 mapping.

    Please note that this suffix is not intended for the logical grouping of

    images acquired using an Echo Planar Imaging (EPI) readout.

    '
- source: bids
  class: suffixes
  name: MP2RAGE
  description: 'The MP2RAGE method is a special protocol that collects several images
    at

    different flip angles and inversion times to create a parametric T1map by

    combining the magnitude and phase images

    ([Marques et al. 2010](https://doi.org/10.1016/j.neuroimage.2009.10.002)).

    '
- source: bids
  class: suffixes
  name: MPE
  description: 'Multi-photon excitation microscopy imaging data

    '
- source: bids
  class: suffixes
  name: MPM
  description: 'The MPM approaches (a.k.a hMRI) involves the acquisition of highly-similar

    anatomical images that differ in terms of application of a magnetization

    transfer RF pulse (MTon or MToff), flip angle and (optionally) echo time and

    magnitue/phase parts

    ([Weiskopf et al. 2013](https://doi.org/10.3389/fnins.2013.00095)).

    See [here](https://owncloud.gwdg.de/index.php/s/iv2TOQwGy4FGDDZ) for

    suggested MPM acquisition protocols.

    '
- source: bids
  class: suffixes
  name: MTR
  description: 'This method is to calculate a semi-quantitative magnetization transfer
    ratio

    map.

    '
- source: bids
  class: suffixes
  name: MTRmap
  description: 'In arbitrary units (arbitrary).

    MTR maps are REQUIRED to use this suffix regardless of the method used to

    generate them.

    MTRmap intensity values are RECOMMENDED to be represented in percentage in

    the range of 0-100%.

    '
- source: bids
  class: suffixes
  name: MTS
  description: 'This method is to calculate a semi-quantitative magnetization transfer

    saturation index map.

    The MTS method involves three sets of anatomical images that differ in terms

    of application of a magnetization transfer RF pulse (MTon or MToff) and flip

    angle ([Helms et al. 2008](https://doi.org/10.1002/mrm.21732)).

    '
- source: bids
  class: suffixes
  name: MTVmap
  description: 'In arbitrary units (arbitrary).

    MTV maps are REQUIRED to use this suffix regardless of the method used to

    generate them.

    '
- source: bids
  class: suffixes
  name: MTsat
  description: 'In arbitrary units (arbitrary).

    MTsat maps are REQUIRED to use this suffix regardless of the method used to

    generate them.

    '
- source: bids
  class: suffixes
  name: MWFmap
  description: 'In arbitrary units (arbitrary).

    MWF maps are REQUIRED to use this suffix regardless of the method used to

    generate them.

    MWF intensity values are RECOMMENDED to be represented in percentage in the

    range of 0-100%.

    '
- source: bids
  class: suffixes
  name: NLO
  description: 'Nonlinear optical microscopy imaging data

    '
- source: bids
  class: suffixes
  name: OCT
  description: 'Optical coherence tomography imaging data

    '
- source: bids
  class: suffixes
  name: PC
  description: 'Phase-contrast microscopy imaging data

    '
- source: bids
  class: suffixes
  name: PD
  description: 'Ambiguous, may refer to a parametric image or to a conventional image.

    **Change:** Replaced by `PDw` or `PDmap`.

    '
- source: bids
  class: suffixes
  name: PDT2
  description: 'In arbitrary units (arbitrary).

    A two-volume 4D image, where the volumes are, respectively, PDw and T2w

    images acquired simultaneously.

    If separated into 3D volumes, the `PDw` and `T2w` suffixes SHOULD be used instead,

    and an acquisition entity MAY be used to distinguish the images from others with

    the same suffix, for example, `acq-PDT2_PDw.nii` and `acq-PDT2_T2w.nii`.

    '
- source: bids
  class: suffixes
  name: PDmap
  description: 'In arbitrary units (arbitrary).

    PD maps are REQUIRED to use this suffix regardless of the method used to

    generate them.

    '
- source: bids
  class: suffixes
  name: PDw
  description: 'In arbitrary units (arbitrary).

    The contrast of these images is mainly determined by spatial variations in

    the spin density (1H) of the imaged specimen.

    This contrast is achieved at short echo times and long repetition times;

    for gradient echo, this weighting is also possible with a short TR (TR<<T1) and
    a small flip angle.

    '
- source: bids
  class: suffixes
  name: PLI
  description: 'Polarized-light microscopy imaging data

    '
- source: bids
  class: suffixes
  name: R1map
  description: 'In seconds<sup>-1</sup> (1/s).

    R1 maps (R1 = 1/T1) are REQUIRED to use this suffix regardless of the method

    used to generate them.

    '
- source: bids
  class: suffixes
  name: R2map
  description: 'In seconds<sup>-1</sup> (1/s).

    R2 maps (R2 = 1/T2) are REQUIRED to use this suffix regardless of the method

    used to generate them.

    '
- source: bids
  class: suffixes
  name: R2starmap
  description: 'In seconds<sup>-1</sup> (1/s).

    R2-star maps (R2star = 1/T2star) are REQUIRED to use this suffix regardless

    of the method used to generate them.

    '
- source: bids
  class: suffixes
  name: RB1COR
  description: 'Low resolution images acquired by the body coil

    (in the gantry of the scanner) and the head coil using identical acquisition

    parameters to generate a combined sensitivity map as described in

    [Papp et al. (2016)](https://doi.org/10.1002/mrm.26058).

    '
- source: bids
  class: suffixes
  name: RB1map
  description: 'In arbitrary units (arbitrary).

    Radio frequency (RF) receive (B1-) sensitivity maps are REQUIRED to use this

    suffix regardless of the method used to generate them.

    RB1map intensity values are RECOMMENDED to be represented as percent

    multiplicative factors such that Amplitude<sub>effective</sub> =

    B1-<sub>intensity</sub>\*Amplitude<sub>ideal</sub>.

    '
- source: bids
  class: suffixes
  name: S0map
  description: 'In arbitrary units (arbitrary).

    This represents a model-based estimate of signal intensity

    in the absence of the contrast under investigation.

    For a multi-echo sequence

    (for example, multi-echo spin echo T2 relaxometry or multi-echo fMRI),

    S0 maps index the baseline signal at a hypothetical echo time of zero

    (that is, in the absence of any T2 or T2-star decay).

    In other words: the exponential of the intercept for a linear decay model

    across log-transformed echos. For more information, please see, for example,

    [the tedana documentation](https://tedana.readthedocs.io/en/latest/\

    approach.html#monoexponential-decay-model-fit).

    S0 maps are RECOMMENDED to use this suffix if derived from an ME-FMRI dataset.

    For a diffusion-weighted sequence,

    S0 maps represent the model-based estimate of the signal intensity

    in the absence of any diffusion weighting;

    in other words, the image intensity at *b*=0

    as estimated by a diffusion model fit.

    '
- source: bids
  class: suffixes
  name: SEM
  description: 'Scanning electron microscopy imaging data

    '
- source: bids
  class: suffixes
  name: SPIM
  description: 'Selective plane illumination microscopy imaging data

    '
- source: bids
  class: suffixes
  name: SR
  description: 'Super-resolution microscopy imaging data

    '
- source: bids
  class: suffixes
  name: T1map
  description: 'In seconds (s).

    T1 maps are REQUIRED to use this suffix regardless of the method used to

    generate them.

    See [this interactive book on T1 mapping](https://qmrlab.org/t1_book/intro)

    for further reading on T1-mapping.

    '
- source: bids
  class: suffixes
  name: T1rho
  description: 'In seconds (s).

    T1-rho maps are REQUIRED to use this suffix regardless of the method used to

    generate them.

    '
- source: bids
  class: suffixes
  name: T1w
  description: 'In arbitrary units (arbitrary).

    The contrast of these images is mainly determined by spatial variations in

    the longitudinal relaxation time of the imaged specimen.

    In spin-echo sequences this contrast is achieved at relatively short

    repetition and echo times.

    To achieve this weighting in gradient-echo images, again, short repetition

    and echo times are selected; however, at relatively large flip angles.

    Another common approach to increase T1 weighting in gradient-echo images is

    to add an inversion preparation block to the beginning of the imaging

    sequence (for example, `TurboFLASH` or `MP-RAGE`).

    '
- source: bids
  class: suffixes
  name: T2map
  description: 'In seconds (s).

    T2 maps are REQUIRED to use this suffix regardless of the method used to

    generate them.

    '
- source: bids
  class: suffixes
  name: T2star
  description: 'Ambiguous, may refer to a parametric image or to a conventional image.

    **Change:** Replaced by `T2starw` or `T2starmap`.

    '
- source: bids
  class: suffixes
  name: T2starmap
  description: 'In seconds (s).

    T2-star maps are REQUIRED to use this suffix regardless of the method used to

    generate them.

    '
- source: bids
  class: suffixes
  name: T2starw
  description: 'In arbitrary units (arbitrary).

    The contrast of these images is mainly determined by spatial variations in

    the (observed) transverse relaxation time of the imaged specimen.

    In spin-echo sequences, this effect is negated as the excitation is followed

    by an inversion pulse.

    The contrast of gradient-echo images natively depends on T2-star effects.

    However, for T2-star variation to dominate the image contrast,

    gradient-echo acquisitions are carried out at long repetition and echo times,

    and at small flip angles.

    '
- source: bids
  class: suffixes
  name: T2w
  description: 'In arbitrary units (arbitrary).

    The contrast of these images is mainly determined by spatial variations in

    the (true) transverse relaxation time of the imaged specimen.

    In spin-echo sequences this contrast is achieved at relatively long

    repetition and echo times.

    Generally, gradient echo sequences are not the most suitable option for

    achieving T2 weighting, as their contrast natively depends on T2-star rather

    than on T2.

    '
- source: bids
  class: suffixes
  name: TB1AFI
  description: 'This method ([Yarnykh 2007](https://doi.org/10.1002/mrm.21120))

    calculates a B1<sup>+</sup> map from two images acquired at interleaved (two)

    TRs with identical RF pulses using a steady-state sequence.

    '
- source: bids
  class: suffixes
  name: TB1DAM
  description: 'The double-angle B1<sup>+</sup> method

    ([Insko and Bolinger 1993](https://doi.org/10.1006/jmra.1993.1133)) is based

    on the calculation of the actual angles from signal ratios,

    collected by two acquisitions at different nominal excitation flip angles.

    Common sequence types for this application include spin echo and echo planar

    imaging.

    '
- source: bids
  class: suffixes
  name: TB1EPI
  description: 'This B1<sup>+</sup> mapping method

    ([Jiru and Klose 2006](https://doi.org/10.1002/mrm.21083)) is based on two

    EPI readouts to acquire spin echo (SE) and stimulated echo (STE) images at

    multiple flip angles in one sequence, used in the calculation of deviations

    from the nominal flip angle.

    '
- source: bids
  class: suffixes
  name: TB1RFM
  description: 'The result of a Siemens `rf_map` product sequence.

    This sequence produces two images.

    The first image appears like an anatomical image and the second output is a

    scaled flip angle map.

    '
- source: bids
  class: suffixes
  name: TB1SRGE
  description: 'Saturation-prepared with 2 rapid gradient echoes (SA2RAGE) uses a
    ratio of

    two saturation recovery images with different time delays,

    and a simulated look-up table to estimate B1+

    ([Eggenschwiler et al. 2011](https://doi.org/10.1002/mrm.23145)).

    This sequence can also be used in conjunction with MP2RAGE T1 mapping to

    iteratively improve B1+ and T1 map estimation

    ([Marques & Gruetter 2013](https://doi.org/10.1371/journal.pone.0069294)).

    '
- source: bids
  class: suffixes
  name: TB1TFL
  description: 'The result of a Siemens `tfl_b1_map` product sequence.

    This sequence produces two images.

    The first image appears like an anatomical image and the second output is a

    scaled flip angle map.

    '
- source: bids
  class: suffixes
  name: TB1map
  description: 'In arbitrary units (arbitrary).

    Radio frequency (RF) transmit (B1+) field maps are REQUIRED to use this

    suffix regardless of the method used to generate them.

    TB1map intensity values are RECOMMENDED to be represented as percent

    multiplicative factors such that FlipAngle<sub>effective</sub> =

    B1+<sub>intensity</sub>\*FlipAngle<sub>nominal</sub> .

    '
- source: bids
  class: suffixes
  name: TEM
  description: 'Transmission electron microscopy imaging data

    '
- source: bids
  class: suffixes
  name: UNIT1
  description: 'In arbitrary units (arbitrary).

    UNIT1 images are REQUIRED to use this suffix regardless of the method used to

    generate them.

    Note that although this image is T1-weighted, regions without MR signal will

    contain white salt-and-pepper noise that most segmentation algorithms will

    fail on.

    Therefore, it is important to dissociate it from `T1w`.

    Please see [`MP2RAGE` specific notes](SPEC_ROOT/appendices/qmri.md#unit1-images)

    in the qMRI appendix for further information.

    '
- source: bids
  class: suffixes
  name: VFA
  description: 'The VFA method involves at least two spoiled gradient echo (SPGR)
    of

    steady-state free precession (SSFP) images acquired at different flip angles.

    Depending on the provided metadata fields and the sequence type,

    data may be eligible for DESPOT1, DESPOT2 and their variants

    ([Deoni et al. 2005](https://doi.org/10.1002/mrm.20314)).

    '
- source: bids
  class: suffixes
  name: angio
  description: 'Magnetic resonance angiography sequences focus on enhancing the contrast
    of

    blood vessels (generally arteries, but sometimes veins) against other tissue

    types.

    '
- source: bids
  class: suffixes
  name: asl
  description: 'The complete ASL time series stored as a 4D NIfTI file in the original

    acquisition order, with possible volume types including: control, label,

    m0scan, deltam, cbf.

    '
- source: bids
  class: suffixes
  name: aslcontext
  description: 'A TSV file defining the image types for volumes in an associated ASL
    file.

    '
- source: bids
  class: suffixes
  name: asllabeling
  description: 'A deidentified screenshot of the planning of the labeling slab/plane

    with respect to the imaging slab or slices.

    This screenshot is based on DICOM macro C.8.13.5.14.

    '
- source: bids
  class: suffixes
  name: beh
  description: 'Behavioral recordings from tasks.

    These files are similar to events files, but do not include the `"onset"` and

    `"duration"` columns that are mandatory for events files.

    '
- source: bids
  class: suffixes
  name: blood
  description: 'Blood measurements of radioactivity stored in

    [tabular files](SPEC_ROOT/common-principles.md#tabular-files)

    and located in the `pet/` directory along with the corresponding PET data.

    '
- source: bids
  class: suffixes
  name: bold
  description: 'Blood-Oxygen-Level Dependent contrast (specialized T2\* weighting)

    '
- source: bids
  class: suffixes
  name: cbv
  description: 'Cerebral Blood Volume contrast (specialized T2\* weighting or difference
    between T1 weighted images)

    '
- source: bids
  class: suffixes
  name: channels
  description: 'Channel information.

    '
- source: bids
  class: suffixes
  name: colFA
  description: 'Scanner-derived parametric map encoding both the anisotropy and principal
    direction of the diffusion tensor.

    Image intensity is proportional to the Fractional Anisotropy (FA) measure;

    image color is determined by the principal eigenvector of the diffusion tensor,

    where red encodes the magnitude of the left-right component of that orientation,

    with green and blue similarly encoding the anterior-posterior and inferior-superior
    components respectively.

    '
- source: bids
  class: suffixes
  name: coordsystem
  description: 'A JSON document specifying the coordinate system(s) used for the MEG,
    EEG,

    head localization coils, and anatomical landmarks.

    '
- source: bids
  class: suffixes
  name: defacemask
  description: 'A binary mask that was used to remove facial features from an anatomical
    MRI

    image.

    '
- source: bids
  class: suffixes
  name: description
  description: 'A JSON file describing the entities that occur in the filename.


    At present, this is used for atlas descriptions.


    This file MUST be located at the root of the dataset.

    '
- source: bids
  class: suffixes
  name: descriptions
  description: 'A TSV file describing labels found for the `desc` entity in a Derivatives
    dataset.


    This file MAY be located at the root of the derivative dataset,

    or at the subject or session level.


    The use of `descriptions.tsv` files together with the desc entity are helpful
    to

    document how files are generated,

    even if their use may not be sufficient to provide full computational reproducibility.

    '
- source: bids
  class: suffixes
  name: dseg
  description: 'A discrete segmentation.


    This suffix may only be used in derivative datasets.

    '
- source: bids
  class: suffixes
  name: dwi
  description: 'Diffusion-weighted imaging contrast (specialized T2 weighting).

    '
- source: bids
  class: suffixes
  name: eeg
  description: 'Electroencephalography recording data.

    '
- source: bids
  class: suffixes
  name: electrodes
  description: 'File that gives the location of (i)EEG or EMG electrodes.

    '
- source: bids
  class: suffixes
  name: emg
  description: 'Electromyography recording data.

    '
- source: bids
  class: suffixes
  name: epi
  description: 'The phase-encoding polarity (PEpolar) technique combines two or more
    Spin Echo

    EPI scans with different phase encoding directions to estimate the underlying

    inhomogeneity/deformation map.

    '
- source: bids
  class: suffixes
  name: events
  description: 'Event timing information from a behavioral task.

    '
- source: bids
  class: suffixes
  name: expADC
  description: 'Exponental ADC / Attenuation Coefficient / Attenuation Factor map,

    as the ratio of trace-weighted to non-diffusion-weighted image intensity

    '
- source: bids
  class: suffixes
  name: fieldmap
  description: 'Some MR schemes such as spiral-echo imaging (SEI) sequences are able
    to

    directly provide maps of the *B<sub>0</sub>* field inhomogeneity.

    '
- source: bids
  class: suffixes
  name: headshape
  description: 'The 3-D locations of points that describe the head shape and/or electrode

    locations can be digitized and stored in separate files.

    '
- source: bids
  class: suffixes
  name: XPCT
  description: 'X-ray phase-contrast tomography imaging data

    '
- source: bids
  class: suffixes
  name: ieeg
  description: 'Intracranial electroencephalography recording data.

    '
- source: bids
  class: suffixes
  name: inplaneT1
  description: 'In arbitrary units (arbitrary).

    T1 weighted structural image matched to a functional (task) image.

    '
- source: bids
  class: suffixes
  name: inplaneT2
  description: 'In arbitrary units (arbitrary).

    T2 weighted structural image matched to a functional (task) image.

    '
- source: bids
  class: suffixes
  name: m0scan
  description: 'The M0 image is a calibration image, used to estimate the equilibrium

    magnetization of blood.

    '
- source: bids
  class: suffixes
  name: magnitude
  description: 'Field-mapping MR schemes such as gradient-recalled echo (GRE) generate
    a

    Magnitude image to be used for anatomical reference.

    Requires the existence of Phase, Phase-difference or Fieldmap maps.

    '
- source: bids
  class: suffixes
  name: magnitude1
  description: 'Magnitude map generated by GRE or similar schemes, associated with
    the first

    echo in the sequence.

    '
- source: bids
  class: suffixes
  name: magnitude2
  description: 'Magnitude map generated by GRE or similar schemes, associated with
    the second

    echo in the sequence.

    '
- source: bids
  class: suffixes
  name: markers
  description: 'Another manufacturer-specific detail pertains to the KIT/Yokogawa/Ricoh

    system, which saves the MEG sensor coil positions in a separate file with two

    possible filename extensions  (`.sqd`, `.mrk`).

    For these files, the `markers` suffix MUST be used.

    For example: `sub-01_task-nback_markers.sqd`

    '
- source: bids
  class: suffixes
  name: mask
  description: 'A binary mask that functions as a discrete "label" for a single structure.


    This suffix may only be used in derivative datasets.

    '
- source: bids
  class: suffixes
  name: meg
  description: 'Unprocessed MEG data stored in the native file format of the MEG instrument

    with which the data was collected.

    '
- source: bids
  class: suffixes
  name: motion
  description: 'Data recorded from a tracking system store.

    '
- source: bids
  class: suffixes
  name: mrsi
  description: 'MRS acquisitions where additional imaging gradients are used

    to detect the MR signal from 1, 2, or 3 spatial dimensions.

    '
- source: bids
  class: suffixes
  name: mrsref
  description: 'An MRS acquisition collected to serve as a concentration reference
    for absolute quantification

    or as a calibration reference for preprocessing (for example, eddy-current correction).

    '
- source: bids
  class: suffixes
  name: nirs
  description: Data associated with a Shared Near Infrared Spectroscopy Format file.
- source: bids
  class: suffixes
  name: noRF
  description: 'An MR noise scan often acquired alongside another MR scan.


    These noise scans are acquired by disabling the radio frequency excitation,

    while maintaining all other parameters from the associated scan.

    These can be acquired using some other sequence with RF excitation removed

    or as part of sequences that turns off RF at the beginning or end of a run.

    For example a `bold` scan where a few volumes are acquired with RF off.

    There is no consistent DICOM denotation for these scans.


    If multiple sequences with different suffixes but otherwise the same entities
    have `noRF`

    sequences, they SHOULD be disambiguated using the modality entity

    (for example, `mod-bold_noRF.nii.gz` and `mod-cbv_noRF.nii`).


    `noRF` are typically used to estimate properties of the scanner and

    sequence that are independent from the object being imaged.

    '
- source: bids
  class: suffixes
  name: optodes
  description: 'Either a light emitting device, sometimes called a transmitter, or
    a photoelectric transducer, sometimes called a

    receiver.

    '
- source: bids
  class: suffixes
  name: pet
  description: 'PET imaging data SHOULD be stored in 4D

    (or 3D, if only one volume was acquired) NIfTI files with the `_pet` suffix.

    Volumes MUST be stored in chronological order

    (the order they were acquired in).

    '
- source: bids
  class: suffixes
  name: phase
  description: '[DEPRECATED](SPEC_ROOT/common-principles.md#definitions).

    Phase information associated with magnitude information stored in BOLD

    contrast.

    This suffix should be replaced by the

    [`part-phase`](SPEC_ROOT/appendices/entities.md#part)

    in conjunction with the `bold` suffix.

    '
- source: bids
  class: suffixes
  name: phase1
  description: 'Phase map generated by GRE or similar schemes, associated with the
    first

    echo in the sequence.

    '
- source: bids
  class: suffixes
  name: phase2
  description: 'Phase map generated by GRE or similar schemes, associated with the
    second

    echo in the sequence.

    '
- source: bids
  class: suffixes
  name: phasediff
  description: 'Some scanners subtract the `phase1` from the `phase2` map and generate
    a

    unique `phasediff` file.

    For instance, this is a common output for the built-in fieldmap sequence of

    Siemens scanners.

    '
- source: bids
  class: suffixes
