semantic:
  data_type: string
provenance:
- source: bids
  class: columns
  name: HED
  description: 'Hierarchical Event Descriptor (HED) tags.

    See the [HED Appendix](SPEC_ROOT/appendices/hed.md) for details.

    '
- source: bids
  class: columns
  name: abbreviation
  description: 'The unique label abbreviation

    '
- source: bids
  class: columns
  name: acq_time__scans
  description: 'Acquisition time refers to when the first data point in each run was
    acquired.

    Furthermore, if this header is provided, the acquisition times of all files

    from the same recording MUST be identical.

    Datetime format and their deidentification are described in

    [Units](SPEC_ROOT/common-principles.md#units).

    '
- source: bids
  class: columns
  name: acq_time__sessions
  description: 'Acquisition time refers to when the first data point of the first
    run was acquired.

    Datetime format and their deidentification are described in

    [Units](SPEC_ROOT/common-principles.md#units).

    '
- source: bids
  class: columns
  name: age
  description: 'Numeric value in years (float or integer value).


    For privacy purposes, participant ages should be capped at 89.

    Using "89+" for ages above 88 is DEPRECATED.

    '
- source: bids
  class: columns
  name: cardiac
  description: 'continuous pulse measurement

    '
- source: bids
  class: columns
  name: channel
  description: 'Channel(s) associated with an event.

    If multiple channels are specified, they MUST be separated by a delimiter

    specified in the `"Delimiter"` field describing the `channel` column.

    For example, channels separated with a comma (`,`) require the `events.json`

    file to contain `"channel": {"Delimiter": ","}`.

    In the absence of a delimiter, tools MUST interpret any character as being part

    of a channel name.

    '
- source: bids
  class: columns
  name: color
  description: 'Hexadecimal. Label color for visualization.

    '
- source: bids
  class: columns
  name: component
  description: 'Description of the spatial axis or label of quaternion component associated
    with the channel.

    For example, `x`,`y`,`z` for position channels,

    or `quat_x`, `quat_y`, `quat_z`, `quat_w` for quaternion orientation channels.

    '
- source: bids
  class: columns
  name: coordinate_system
  description: 'Name of the coordinate system defined in `coordsystem.json` in which
    the electrode''s

    `x`, `y`, and (optionally) `z` coordinates are given.

    '
- source: bids
  class: columns
  name: detector__channels
  description: 'Name of the detector as specified in the `*_optodes.tsv` file.

    `n/a` for channels that do not contain NIRS signals (for example, acceleration).

    '
- source: bids
  class: columns
  name: detector_type
  description: 'The type of detector. Only to be used if the field `DetectorType`
    in `*_nirs.json` is set to `mixed`.

    '
- source: bids
  class: columns
  name: derived_from
  description: '`sample-<label>` entity from which a sample is derived,

    for example a slice of tissue (`sample-02`) derived from a block of tissue (`sample-01`).

    '
- source: bids
  class: columns
  name: desc_id
  description: 'A `desc-<label>` entity present in the derivatives dataset.


    The `desc_id` column contains the labels used with the

    [`desc` entity](SPEC_ROOT/appendices/entities.md#desc),

    within the particular nesting that the `descriptions.tsv` file is placed.


    For example, if the `descriptions.tsv` file is placed at the root of the derivative
    dataset,

    its `desc_id` column SHOULD contain all labels of the `desc` entity)

    used across the entire derivative dataset.

    '
- source: bids
  class: columns
  name: description
  description: 'Brief free-text description of the channel, or other information of
    interest.

    '
- source: bids
  class: columns
  name: description__optode
  description: 'Free-form text description of the optode, or other information of
    interest.

    '
- source: bids
  class: columns
  name: description__entities
  description: 'Free-form text description of the entity''s label (defined in `<entity>_id`
    column).

    '
- source: bids
  class: columns
  name: dimension
  description: 'Size of the group (grid/strip/probe) that this electrode belongs to.

    Must be of form `[AxB]` with the smallest dimension first (for example, `[1x8]`).

    '
- source: bids
  class: columns
  name: filename
  description: 'Relative paths to files.

    '
- source: bids
  class: columns
  name: group__channel
  description: 'Which group of channels (grid/strip/seeg/depth) this channel belongs
    to.

    This is relevant because one group has one cable-bundle and noise can be shared.

    This can be a name or number.

    '
- source: bids
  class: columns
  name: group__emg
  description: 'Which group the electrode or channel belongs to (typically this indicates
    electrodes

    or bipolar channels on the same grid, strip, or other device).

    '
- source: bids
  class: columns
  name: handedness
  description: 'String value indicating one of "left", "right", "ambidextrous".


    For "left", use one of these values: `left`, `l`, `L`, `LEFT`, `Left`.


    For "right", use one of these values: `right`, `r`, `R`, `RIGHT`, `Right`.


    For "ambidextrous", use one of these values: `ambidextrous`, `a`, `A`, `AMBIDEXTROUS`,

    `Ambidextrous`.

    '
- source: bids
  class: columns
  name: hemisphere
  description: 'The hemisphere in which the electrode is placed.

    '
- source: bids
  class: columns
  name: manufacturer
  description: 'The manufacturer for each electrode.

    Can be used if electrodes were manufactured by more than one company.

    '
- source: bids
  class: columns
  name: message
  description: 'Brief free-text description of a message (for example in a log generated

    by a device), or other information of interest.

    '
- source: bids
  class: columns
  name: material
  description: 'Material of the electrode (for example, `Tin`, `Ag/AgCl`, `Gold`).

    '
- source: bids
  class: columns
  name: name__channels
  description: 'Label of the channel.

    '
- source: bids
  class: columns
  name: name__electrodes
  description: 'Name of the electrode contact point.

    '
- source: bids
  class: columns
  name: name__optodes
  description: 'Name of the optode, must be unique.

    '
- source: bids
  class: columns
  name: name__segmentations
  description: 'The unique label name.

    '
- source: bids
  class: columns
  name: notch
  description: 'Frequencies used for the notch filter applied to the channel, in Hz.

    If notch filters are applied at multiple frequencies,

    these frequencies MAY be specified as a list,

    for example, `[60, 120, 180]`.

    If no notch filter was applied, use `n/a`.

    '
- source: bids
  class: columns
  name: pathology
  description: 'String value describing the pathology of the sample or type of control.

    When different from `healthy`, pathology SHOULD be specified.

    The pathology may be specified in either `samples.tsv` or

    `sessions.tsv`, depending on whether the pathology changes over time.

    '
- source: bids
  class: columns
  name: participant_id
  description: 'A participant identifier of the form `sub-<label>`,

    matching a participant entity found in the dataset.

    '
- source: bids
  class: columns
  name: placement_description
  description: 'Additional details of the approach to EMG sensor placement.

    See description of the `EMGPlacementSchemeDescription` field in `*_emg.json`.

    '
- source: bids
  class: columns
  name: placement_scheme
  description: 'A description of the electrode placement procedure used.

    See description of the `EMGPlacementScheme` field in `*_emg.json`.

    '
- source: bids
  class: columns
  name: placement__motion
  description: 'Placement of the tracked point on the body (for example,

    participant, avatar centroid, torso, left arm).

    It can refer to an external vocabulary for describing body parts.

    '
- source: bids
  class: columns
  name: reference__eeg
  description: 'Name of the reference electrode(s).

    This column is not needed when it is common to all channels.

    In that case the reference electrode(s) can be specified in `*_eeg.json` as `EEGReference`).

    '
- source: bids
  class: columns
  name: reference__emg
  description: 'The reference for the given channel.

    When the reference is an electrode in `*_electrodes.tsv`, use the name of that
    electrode.

    For channels originating from bipolar devices, use `"bipolar"`.

    For non-EMG channels (for example, trigger channels, microphones) use `"n/a"`.

    '
- source: bids
  class: columns
  name: reference__ieeg
  description: 'Specification of the reference (for example, `mastoid`, `ElectrodeName01`,
    `intracranial`, `CAR`, `other`, `n/a`).

    If the channel is not an electrode channel (for example, a microphone channel)
    use `n/a`.

    '
- source: bids
  class: columns
  name: reference_frame
  description: 'Specification of a reference frame in which the motion data are to
    be interpreted.

    The description of the levels in `*_channels.json` SHOULD use `RotationRule`,

    `RotationOrder`, and `SpatialAxes`, and MAY use `Description` for the specification.

    '
- source: bids
  class: columns
  name: respiratory
  description: 'continuous breathing measurement

    '
- source: bids
  class: columns
  name: sample_id
  description: 'A sample identifier of the form `sample-<label>`,

    matching a sample entity found in the dataset.

    '
- source: bids
  class: columns
  name: sample_type
  description: 'Biosample type defined by

    [ENCODE Biosample Type](https://www.encodeproject.org/profiles/biosample_type).

    '
- source: bids
  class: columns
  name: session_id
  description: 'A session identifier of the form `ses-<label>`,

    matching a session found in the dataset.

    '
- source: bids
  class: columns
  name: sex
  description: 'String value indicating phenotypical sex, one of "male", "female",
    "other".


    For "male", use one of these values: `male`, `m`, `M`, `MALE`, `Male`.


    For "female", use one of these values: `female`, `f`, `F`, `FEMALE`, `Female`.


    For "other", use one of these values: `other`, `o`, `O`, `OTHER`, `Other`.

    '
- source: bids
  class: columns
  name: signal_electrode
  description: 'The name of the electrode from which the `reference`''s signal is
    subtracted to yield the channel''s data.

    For channels originating from bipolar devices, the `signal_electrode` MAY be the
    same as the channel `name`.

    '
- source: bids
  class: columns
  name: software_filters
  description: 'List of temporal and/or spatial software filters applied

    (for example, `SSS`, `SpatialCompensation`).

    Note that parameters should be defined in the general MEG sidecar .json file.

    Indicate `n/a` in the absence of software filters applied.

    '
- source: bids
  class: columns
  name: source__channels
  description: 'Name of the source as specified in the `*_optodes.tsv` file.

    `n/a` for channels that do not contain fNIRS signals (for example, acceleration).

    '
- source: bids
  class: columns
  name: source__optodes
  description: 'The type of source. Only to be used if the field `SourceType` in `*_nirs.json`
    is set to `mixed`.

    '
- source: bids
  class: columns
  name: species
  description: 'The `species` column SHOULD be a binomial species name from the

    [NCBI Taxonomy](https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi)

    (for example, `homo sapiens`, `mus musculus`, `rattus norvegicus`).

    For backwards compatibility, if `species` is absent, the participant is assumed
    to be

    `homo sapiens`.

    '
- source: bids
  class: columns
  name: status
  description: 'Data quality observed on the channel.

    A channel is considered `bad` if its data quality is compromised by excessive
    noise.

    If quality is unknown, then a value of `n/a` may be used.

    Description of noise type SHOULD be provided in `[status_description]`.

    '
- source: bids
  class: columns
  name: status_description
  description: 'Freeform text description of noise or artifact affecting data quality
    on the channel.

    It is meant to explain why the channel was declared bad in the `status` column.

    '
- source: bids
  class: columns
  name: stim_file
  description: 'Represents the location of the stimulus file (such as an image, video,
    or

    audio file) presented at the given onset time.

    There are no restrictions on the file formats of the stimuli files,

    but they should be stored in the `/stimuli/` directory

    (under the root directory of the dataset; with optional subdirectories).

    The values under the `stim_file` column correspond to a path relative to

    `/stimuli`.

    For example `images/cat03.jpg` will be translated to `/stimuli/images/cat03.jpg`.

    '
- source: bids
  class: columns
  name: strain
  description: 'For species different from `homo sapiens`, string value indicating

    the strain of the species, for example: `C57BL/6J`.

    '
- source: bids
  class: columns
  name: strain_rrid
  description: 'For species different from `homo sapiens`, research resource identifier

    ([RRID](https://rrid.site/data/source/nlx_154697-1/search))

    of the strain of the species, for example: `RRID:IMSR_JAX:000664`.

    '
- source: bids
  class: columns
  name: target_muscle
  description: 'Name of the muscle(s) from which the EMG signal in this channel is
    believed to originate.

    When exact muscle is unknown (such as when using electrode grids that cover multiple
    muscles),

    groups of muscles may be named instead (for example "flexors of the left forearm").

    '
- source: bids
  class: columns
  name: tracked_point__channels
  description: 'Label of the point that is being tracked, for example, label of a
    tracker

    or a marker (for example,`"LeftFoot"`, `"RightWrist"`).

    '
- source: bids
  class: columns
  name: trial_type
  description: 'Primary categorisation of each trial to identify them as instances
    of the

    experimental conditions.

    For example: for a response inhibition task, it could take on values `go` and

    `no-go` to refer to response initiation and response inhibition experimental

    conditions.

    '
- source: bids
  class: columns
  name: trigger
  description: 'continuous measurement of the scanner trigger signal

    '
- source: bids
  class: columns
  name: type__channels
  description: 'Type of channel; MUST use the channel types listed below.

    Note that the type MUST be in upper-case.

    '
- source: bids
  class: columns
  name: type__electrodes
  description: 'Type of the electrode (for example, cup, ring, clip-on, wire, needle).

    '
- source: bids
  class: columns
  name: type__optodes
  description: 'The type of the optode.

    '
- source: bids
  class: columns
  name: units
  description: 'Physical unit of the value represented in this channel,

    for example, `V` for Volt, or `fT/cm` for femto Tesla per centimeter

    (see [Units](SPEC_ROOT/common-principles.md#units)).

    '
- source: bids
  class: columns
  name: units__nirs
  description: 'Physical unit of the value represented in this channel,

    specified according to the SI unit symbol and possibly prefix symbol,

    or as a derived SI unit (for example, `V`, or unitless for changes in optical
    densities).

    For guidelines about units see the [Appendix](SPEC_ROOT/appendices/units.md)

    and [Common Principles](SPEC_ROOT/common-principles.md#units) pages.

    '
- source: bids
  class: columns
  name: units__motion
  description: 'Physical or virtual unit of the value represented in this channel,

    for example, ''"rad"'' or ''"deg"'' for angular quantities or ''"m"'' for position
    data.

    If motion data is recorded in a virtual space and deviate from standard SI units,

    the unit used MUST be specified in the sidecar `*_motion.json`

    file (for example `"vm"` for virtual meters). `"rad"` is used for Euler angles

    and `"n/a"` for quaternions.

    For guidelines about units see the [Appendix](SPEC_ROOT/appendices/units.md)

    and [Common Principles](SPEC_ROOT/common-principles.md#units) pages.

    '
- source: bids
  class: columns
  name: volume_type
  description: 'The `*_aslcontext.tsv` table consists of a single column of labels
    identifying

    the `volume_type` of each volume in the corresponding `*_asl.nii[.gz]` file.

    '
- source: bids
  class: common_principles
  name: atlas
  description: 'An *atlas* is structured neuroanatomical or neurofunctional information
    expressed as spatial annotations,

    such as anatomical landmarks, segmentations, parcellations, probabilistic maps,
    or feature maps,

    typically defined in relation to a *space* engendered by a specific *template*.

    Within BIDS, atlases provide standardized spatially-organized knowledge to label,
    localize,

    and interpret data features.

    Atlases often rely on or embed templates as their reference framework.

    In BIDS, templates establish the spatial coordinate frames for atlases,

    independently of whether or not they are considered part of specific atlases''
    outcomes.

    '
- source: bids
  class: common_principles
  name: data_acquisition
  description: 'A continuous uninterrupted block of time during which a brain scanning
    instrument

    or an electromyography recording device was acquiring data

    according to a particular scanning sequence/protocol.

    '
- source: bids
  class: common_principles
  name: data_type
  description: "A functional group of different types of data.\nData files are contained\
    \ in a directory named for the data type.\nBIDS defines the following data types:\n\
    \n    1.  `func` (task based and resting state functional MRI)\n\n    2.  `dwi`\
    \ (diffusion weighted imaging)\n\n    3.  `fmap` (field inhomogeneity mapping\
    \ data such as field maps)\n\n    4.  `anat` (structural imaging such as T1, T2,\
    \ PD, and so on)\n\n    5.  `perf` (perfusion)\n\n    6.  `meg` (magnetoencephalography)\n\
    \n    7.  `eeg` (electroencephalography)\n\n    8.  `ieeg` (intracranial electroencephalography)\n\
    \n    9.  `beh` (behavioral)\n\n    10. `pet` (positron emission tomography)\n\
    \n    11. `micr` (microscopy)\n\n    12. `nirs` (near infrared spectroscopy)\n\
    \n    13. `motion` (motion)\n\n    14. `mrs` (magnetic resonance spectroscopy)\n\
    \n    15. `phenotype` (measurement and survey data)\n\n    16. `emg` (electromyography)\n\
    \nFor files that are subject- and session- specific, the data type directory\n\
    is nested inside those directories.\n`phenotype` data files are aggregated across\
    \ subjects and sessions,\nand so the `phenotype/` directory is placed in the dataset\
    \ root.\n"
- source: bids
  class: common_principles
  name: dataset
  description: 'A set of neuroimaging and behavioral data acquired for a purpose of
    a particular study.

    A dataset consists of data acquired from one or more subjects, possibly from multiple
    sessions.

    '
- source: bids
  class: common_principles
  name: deprecated
  description: 'A "deprecated" entity or metadata field SHOULD NOT be used in the
    generation of new datasets.

    It remains in the standard in order to preserve the interpretability of existing
    datasets.

    Validating software SHOULD warn when deprecated practices are detected

    and provide a suggestion for updating the dataset to preserve the curator''s intent.

    '
- source: bids
  class: common_principles
  name: event
  description: 'Something that happens or may be perceived by a test subject as happening

    at a particular instant during the recording.

    Events are most commonly associated with on- or offset of stimulus presentations,

    or with the distinct marker of on- or offset of a subject''s response or motor
    action.

    Other events may include unplanned incidents

    (for example, sudden onset of noise and vibrations due to construction work,

    laboratory device malfunction),

    changes in task instructions (for example, switching the response hand),

    or experiment control parameters (for example, changing the stimulus presentation
    rate over experimental blocks),

    and noted data feature occurrences (for example, a recording electrode producing
    noise).

    In BIDS, each event has an onset time and duration.

    Note that not all tasks will have recorded events (for example, "resting state").

    '
- source: bids
  class: common_principles
  name: extension
  description: 'A portion of the filename after the left-most period (`.`) preceded
    by any other alphanumeric.

    For example, `.gitignore` does not have a file extension,

    but the file extension of `test.nii.gz` is `.nii.gz`.

    Note that the left-most period is included in the file extension.

    '
- source: bids
  class: common_principles
  name: index
  description: 'A nonnegative integer, possibly prefixed with arbitrary number of
    0s for consistent indentation,

    for example, it is `01` in `run-01` following `run-<index>` specification.

    '
- source: bids
  class: common_principles
  name: label
  description: 'An alphanumeric (and possibly including `+` character(s)) value, possibly
    prefixed with arbitrary

    number of 0s for consistent indentation,

    for example, it is `rest` in `task-rest` following `task-<label>` specification.

    Note that labels MUST not collide when casing is ignored

    (see [Case collision intolerance](SPEC_ROOT/common-principles.md#case-collision-intolerance)).

    '
- source: bids
  class: common_principles
  name: modality
  description: 'The category of brain data recorded by a file.

    For MRI data, different pulse sequences are considered distinct modalities,

    such as `T1w`, `bold` or `dwi`.

    For passive recording techniques, such as EEG, MEG or iEEG,

    the technique is sufficiently uniform to define the modalities `eeg`, `meg` and
    `ieeg`.

    When applicable, the modality is indicated in the **suffix**.

    The modality may overlap with, but should not be confused with the **data type**.

    '
- source: bids
  class: common_principles
  name: run
  description: 'An uninterrupted repetition of data acquisition that has the same
    acquisition parameters and task

    (however events can change from run to run due to different subject response

    or randomized nature of the stimuli).

    Run is a synonym of a data acquisition.

    Note that "uninterrupted" may look different by modality due to the nature of
    the recording.

    For example, in [MRI](SPEC_ROOT/modality-specific-files/magnetic-resonance-imaging-data.md)

    or [MEG](SPEC_ROOT/modality-specific-files/magnetoencephalography.md),

    if a subject leaves the scanner, the acquisition must be restarted.

    For some types of [PET](SPEC_ROOT/modality-specific-files/positron-emission-tomography.md)
    acquisitions,

    a subject may leave and re-enter the scanner without interrupting the scan.

    '
- source: bids
  class: common_principles
  name: sample
  description: 'A sample pertaining to a subject such as tissue, primary cell or cell-free
    sample.

    Sample labels MUST be unique within a subject and it is RECOMMENDED

    that they be unique throughout the dataset.

    '
- source: bids
  class: common_principles
  name: session
  description: 'A logical grouping of neuroimaging and behavioral data consistent
    across subjects.

    Session can (but doesn''t have to) be synonymous to a visit in a longitudinal
    study.

    In general, subjects will stay in the scanner during one session.

    However, for example, if a subject has to leave the scanner room

    and then be re-positioned on the scanner bed,

    the set of MRI acquisitions will still be considered as a session

    and match sessions acquired in other subjects.

    Similarly, in situations where different data types are obtained over several
    visits

    (for example fMRI on one day followed by DWI the day after) those can be grouped
    in one session.

    Defining multiple sessions is appropriate when several identical or similar data
    acquisitions

    are planned and performed on all -or most- subjects,

    often in the case of some intervention between sessions (for example, training).

    In the [PET](SPEC_ROOT/modality-specific-files/positron-emission-tomography.md)
    context,

    a session may also indicate a group of related scans, taken in one or more visits.

    '
- source: bids
  class: common_principles
  name: space
  description: 'A space in BIDS is a reference [coordinate system](SPEC_ROOT/appendices/coordinate-systems.md)

    defined by neuroimaging data, which may originate from an individual participant
    (native space)

    or a standardized reference derived from multiple participants (template space).

    '
- source: bids
  class: common_principles
  name: suffix
  description: 'An alphanumeric string that forms part of a filename, located after
    all

    [entities](SPEC_ROOT/common-principles.md#entities) and

    following a final `_`, right before the **file extension**;

    for example, it is `eeg` in `sub-05_task-matchingpennies_eeg.vhdr`.

    '
- source: bids
  class: common_principles
  name: subject
  description: 'A person or animal participating in the study.

    Used interchangeably with term **Participant**.

    '
- source: bids
  class: common_principles
  name: task
  description: 'A set of structured activities performed by the participant.

    Tasks are usually accompanied by stimuli and responses, and can greatly vary in
    complexity.

    For the purpose of this specification we consider the so-called "resting state"
    a task.

    In the context of brain scanning, a task is always tied to one data acquisition.

    Therefore, even if during one acquisition the subject performed multiple conceptually
    different behaviors

    (with different sets of instructions) they will be considered one (combined) task.

    '
- source: bids
  class: common_principles
  name: template
  description: 'A template (sometimes called an *atlas template*) is any aggregation
    of data across subjects.

    Templates MAY operationalize the notion of a common spatial frame of reference

    (see *space*) beyond individual subjects.

    In practical BIDS usage, templates can be recognized (via the `tpl-` entity) as

    standard spaces that enable analyses of data from multiple individuals.

    '
- source: bids
  class: datatypes
  name: anat
  description: 'Magnetic resonance imaging sequences designed to characterize static,
    anatomical features.

    '
- source: bids
  class: datatypes
  name: beh
  description: 'Behavioral data.

    '
- source: bids
  class: datatypes
  name: dwi
  description: 'Diffusion-weighted imaging (DWI).

    '
- source: bids
  class: datatypes
  name: eeg
  description: Electroencephalography
- source: bids
  class: datatypes
  name: emg
  description: Measurements of muscular activity.
- source: bids
  class: datatypes
  name: fmap
  description: 'MRI scans for estimating B0 inhomogeneity-induced distortions.

    '
