- source: bids
  class: enums
  name: fsLR
  description: 'The `fsLR` is a surface template.

    Additionally, by convention,

    `fsLR` is used as shorthand for a **dual template** providing both volumetric
    and surface

    coordinates references,

    where the surface template is `fsLR` and the volumetric template corresponds to
    `MNI152NLin6Asym`.

    Surface templates are given at several sampling densities:

    164k (used by HCP pipelines for 3T and 7T anatomical analysis),

    59k (used by HCP pipelines for 7T MRI bold and DWI analysis),

    32k (used by HCP pipelines for 3T MRI bold and DWI analysis), or

    4k (used by HCP pipelines for MEG analysis) fsaverage_LR surface reconstructed
    from the T1w image.


    Used by Freesurfer and Connectome Workbench.

