  name: https://openminds.om-i.org/props/diffusionEncodingParameters
  data_type: array
  description: 'Add two diffusion encoding files: a b-value file specifying the diffusion
    weighting for each acquired volume and a b-vector file specifying the corresponding
    three-dimensional diffusion gradient directions. Ensure that both files are correctly
    ordered, that b-vectors are normalized, and that they are aligned with the image
    volumes.'
