  class: common_principles
  name: atlas
  description: 'An *atlas* is structured neuroanatomical or neurofunctional information
    expressed as spatial annotations,

    such as anatomical landmarks, segmentations, parcellations, probabilistic maps,
    or feature maps,

    typically defined in relation to a *space* engendered by a specific *template*.

    Within BIDS, atlases provide standardized spatially-organized knowledge to label,
    localize,

    and interpret data features.

    Atlases often rely on or embed templates as their reference framework.

    In BIDS, templates establish the spatial coordinate frames for atlases,

    independently of whether or not they are considered part of specific atlases''
    outcomes.

    '
