semantic:
  data_type: string
  constraints:
    allowed_values:
    - x
    - y
    - z
    - quat_x
    - quat_y
    - quat_z
    - quat_w
provenance:
- source: bids
  class: columns
  name: component
  description: 'Description of the spatial axis or label of quaternion component associated
