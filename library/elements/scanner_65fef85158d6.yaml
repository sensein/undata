  description: 'The intrinsic coordinate system of the original image (the first entry
    of `RawSources`)

    after reconstruction and conversion to NIfTI or equivalent for the case of surfaces
    and dual volume/surface

    files.


    The `scanner` coordinate system is implicit and assumed by default if the derivative
    filename does not

    define **any** `space-<label>`.

    Please note that `space-scanner` SHOULD NOT be used,

    it is mentioned in this specification to make its existence explicit.

