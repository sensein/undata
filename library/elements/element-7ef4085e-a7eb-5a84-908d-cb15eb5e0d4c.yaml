  name: https://openminds.om-i.org/props/sliceOrientation
  data_type: string
  description: Add the primary slice plane, defined relative to the scanner coordinate
    system, where axial corresponds to planes perpendicular to the scanner z-axis,
    sagittal to planes perpendicular to the x-axis, and coronal to planes perpendicular
    to the y-axis. This classification is independent of subject orientation and may
    therefore differ from anatomical planes when the subject is positioned non-standardly
    in the scanner.
