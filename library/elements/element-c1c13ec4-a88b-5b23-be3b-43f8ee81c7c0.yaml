  description: DEPRECATED The mean waveform shape, including standard deviation, of
    the different clusters. Ideally, the waveform analysis should be performed on
    data that is only high-pass filtered. This is a separate module because it is
    expected to require updating. For example, IMEC probes may require different storage
    requirements to store/display mean waveforms, requiring a new interface or an
    extension of this one.
