- version_num: 1
  name: IndexSeries
  data_type: object
  description: Stores indices that reference images defined in other containers. The
    primary purpose of the IndexSeries is to allow images stored in an Images container
    to be referenced in a specific sequence through the 'indexed_images' link. This
    approach avoids duplicating image data when the same image needs to be presented
    multiple times or when images need to be shown in a different order than they
    are stored. Since images in an Images container do not have an inherent order,
    the Images container needs to include an 'order_of_images' dataset (of type ImageReferences)
    when being referenced by an IndexSeries. This dataset establishes the ordered
    sequence that the indices in IndexSeries refer to. The 'data' field stores the
    index into this ordered sequence, and the 'timestamps' array indicates the precise
    presentation time of each indexed image during an experiment. This can be used
    for displaying individual images or creating movie segments by referencing a sequence
    of images with the appropriate timestamps. While IndexSeries can also reference
    frames from an ImageSeries through the 'indexed_timeseries' link, this usage is
    discouraged and will be deprecated in favor of using Images containers with 'order_of_images'.
  created_at: '2026-03-15T22:28:31.497884+00:00'
