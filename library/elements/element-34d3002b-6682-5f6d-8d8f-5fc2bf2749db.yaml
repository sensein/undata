  name: https://openminds.om-i.org/props/sliceAngulation
  data_type: array
  description: "Enter the slice plane orientation as a three-element unit normal vector\
    \ [nx, ny, nz] in scanner coordinates, where each component is a dimensionless\
    \ floating-point value between -1 and +1 and the vector has unit length (nx\xB2\
    \ + ny\xB2 + nz\xB2 = 1). For non-oblique acquisitions, the vector aligns with\
    \ a principal axis (for example, [0, 0, 1]), and for oblique acquisitions, the\
    \ components are fractional."
