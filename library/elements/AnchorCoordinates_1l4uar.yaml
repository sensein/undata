semantic:
  data_type: array
provenance:
- source: bids
  class: metadata
  name: AnchorCoordinates
  description: 'Coordinates of the `AnchorElectrode` in the parent (anatomical) coordinate
    system.

    This should be an array of numbers of length 3, in the units given in

    `EMGCoordinateSystemUnits` within the JSON object named in `ParentCoordinateSystem`.

    '
- source: bids
  class: metadata
  name: AcquisitionVoxelSize
  description: 'An array of numbers with a length of 3, in millimeters.

    This field denotes the original acquisition voxel size,

    excluding any inter-slice gaps and before any interpolation or resampling

    within reconstruction or image processing.

    Any point spread function effects, for example due to T2-blurring,

    that would decrease the effective resolution are not considered here.

    '
- source: bids
  class: metadata
  name: Authors
  description: 'List of individuals who contributed to the creation/curation of the
    dataset.

    '
- source: bids
  class: metadata
  name: BackgroundSuppressionPulseTime
  description: 'Array of numbers containing timing, in seconds,

    of the background suppression pulses with respect to the start of the

    labeling.

    In case of multi-PLD with different background suppression pulse times,

    only the pulse time of the first PLD should be defined.

    '
- source: bids
  class: metadata
  name: CalibrationPosition
  description: 'A list of `[x, y]` coordinates in the `CalibrationUnit`.

    For example, using 5 positions calibration presented on an HD screen,

    it could be `[[960,50],[960,540],[960,1030],[50,540],[1870,540]]`.

    '
- source: bids
  class: metadata
  name: ChunkTransformationMatrixAxis
  description: 'Describe the axis of the ChunkTransformationMatrix

    (for examples: `["X", "Y"]` or `["Z", "Y", "X"]`).

    '
- source: bids
  class: metadata
  name: Columns
  description: 'Names of columns in file.

    '
- source: bids
  class: metadata
  name: Curators
  description: 'List of curators who helped make the atlas accessible in a database
    or dataset.

    '
- source: bids
  class: metadata
  name: DecayCorrectionFactor
  description: 'Decay correction factor for each frame.

    '
- source: bids
  class: metadata
  name: DeidentificationMethod
  description: 'A description of the mechanism or method used to remove the Patient''s
    identity.

    Corresponds to [DICOM Tag 0012, 0063](http://www.dicomlookup.com/dicomtags/(0012,0063))

    `De-identification Method`.

    '
- source: bids
  class: metadata
  name: DeidentificationMethodCodeSequence
  description: 'A sequence of code objects describing the mechanism or method use
    to remove the Patient''s identity.

    Corresponds to [DICOM Tag 0012, 0064](http://www.dicomlookup.com/dicomtags/(0012,0064))

    `De-identification Method Code Sequence`.

    '
- source: bids
  class: metadata
  name: EthicsApprovals
  description: 'List of ethics committee approvals of the research protocols and/or

    protocol identifiers.

    '
- source: bids
  class: metadata
  name: FrameDuration
  description: 'Time duration of each frame in default unit seconds.

    This corresponds to [DICOM Tag 0018, 1242](http://www.dicomlookup.com/dicomtags/(0018,1242))

    `Actual Frame Duration` converted to seconds.

    '
- source: bids
  class: metadata
  name: FrameTimesStart
  description: 'Start times for all frames relative to `"TimeZero"` in default unit
    seconds.

    '
- source: bids
  class: metadata
  name: Funding
  description: 'List of sources of funding (grant numbers).

    '
- source: bids
  class: metadata
  name: GeneratedBy
  description: 'Used to specify provenance of the dataset.

    '
- source: bids
  class: metadata
  name: Keywords
  description: 'A list of keywords that describe the content or subject matter of
    the dataset.

    These may be used to enhance the findability of the dataset on public archives.

    '
- source: bids
  class: metadata
  name: LabelingOrientation
  description: 'Orientation of the labeling plane (`(P)CASL`) or slab (`PASL`).

    The direction cosines of a normal vector perpendicular to the ASL labeling

    slab or plane with respect to the patient.

    Corresponds to [DICOM Tag 0018, 9255](http://www.dicomlookup.com/dicomtags/(0018,9255))

    `ASL Slab Orientation`.

    '
- source: bids
  class: metadata
  name: MatrixSize
  description: 'An array of integers with a length of 3 denoting the matrix size of
    the acquisition slab.

    This should be specified as, for example, `[32, 32, 1]` for a 2D acquisition

    or `[32, 1, 1]` for a 1D acquisition.

    '
- source: bids
  class: metadata
  name: PixelSize
  description: 'A 2- or 3-number array of the physical size of a pixel, either `[PixelSizeX,
    PixelSizeY]`

    or `[PixelSizeX, PixelSizeY, PixelSizeZ]`, where X is the width, Y the height
    and Z the

    depth.

    If the file format is OME-TIFF, these values need to be consistent with `PhysicalSizeX`,

    `PhysicalSizeY` and `PhysicalSizeZ` OME metadata fields, after converting in

    `PixelSizeUnits` according to `PhysicalSizeXunit`, `PhysicalSizeYunit` and

    `PhysicalSizeZunit` OME fields.

    '
- source: bids
  class: metadata
  name: PromptRate
  description: 'Prompt rate for each frame (same units as `Units`, for example, `"Bq/mL"`).

    '
- source: bids
  class: metadata
  name: PulseSequencePulses
  description: 'The list of pulses used in the pulse sequence.

    If this field is specified, the array size MUST equal the array size of `"PulseSequenceTiming"`.

    The strings MAY be of the format `<pulse_name>_R<time-bandwidth_product>`.

    For example, a sLASER sequence may be described as such:

    `["P10_R6", "HS4_R25", "HS4_R25", "HS4_R25", "HS4_R25"]`.

    '
- source: bids
  class: metadata
  name: PulseSequenceTiming
  description: 'The time when each RF pulse of the pulse sequence was played out relative
    to

    the beginning of the pulse sequence (that is, the top of the excitation RF pulse),

    specified in seconds.

    '
- source: bids
  class: metadata
  name: RandomRate
  description: 'Random rate for each frame (same units as `"Units"`, for example,
    `"Bq/mL"`).

    '
- source: bids
  class: metadata
  name: RawSources
  description: 'A list of paths relative to dataset root pointing to the BIDS-Raw
    file(s)

    that were used in the creation of this derivative.

    This field is DEPRECATED, and this metadata SHOULD be recorded in the

    `Sources` field using [BIDS URIs](SPEC_ROOT/common-principles.md#bids-uri)

    to distinguish sources from different datasets.

    '
- source: bids
  class: metadata
  name: ReconMethodParameterLabels
  description: 'Names of reconstruction parameters (for example, `["subsets", "iterations"]`).

    '
- source: bids
  class: metadata
  name: ReconMethodParameterUnits
  description: 'Unit of reconstruction parameters (for example, `["none", "none"]`).

    '
- source: bids
  class: metadata
  name: ReconMethodParameterValues
  description: 'Values of reconstruction parameters (for example, `[21, 3]`).

    '
- source: bids
  class: metadata
  name: ReferencesAndLinks
  description: 'List of references to publications that contain information on the
    dataset.

    A reference may be textual or a

    [URI](SPEC_ROOT/common-principles.md#uniform-resource-indicator).

    '
- source: bids
  class: metadata
  name: ScaleFactor
  description: 'Scale factor for each frame. This field MUST be defined if the imaging
    data (`.nii[.gz]`) are scaled.

    If this field is not defined, then it is assumed that the scaling factor is 1.
    Defining this field

    when the scaling factor is 1 is RECOMMENDED, for the sake of clarity.

    '
- source: bids
  class: metadata
  name: ScatterFraction
  description: 'Scatter fraction for each frame (Units: 0-100%).

    '
- source: bids
  class: metadata
  name: ScreenOrigin
  description: 'Location of the spatial coordinates'' origin for the visual stimuli
    presentation,

    described by a list of two keywords such as ("top", "left") if the coordinates

    refer to the top-left corner of the screen, or ("center", "center") if the position

    (0, 0) is at the center or the screen''s extent.

    '
- source: bids
  class: metadata
  name: SinglesRate
  description: 'Singles rate for each frame (same units as `Units`, for example, `"Bq/mL"`).

    '
- source: bids
  class: metadata
  name: SliceTiming
  description: 'The time at which each slice was acquired within each volume (frame)
    of the

    acquisition.

    Slice timing is not slice order -- rather, it is a list of times containing

    the time (in seconds) of each slice acquisition in relation to the beginning

    of volume acquisition.

    The list goes through the slices along the slice axis in the slice encoding

    dimension (see below).

    Note that to ensure the proper interpretation of the `"SliceTiming"` field,

    it is important to check if the OPTIONAL `SliceEncodingDirection` exists.

    In particular, if `"SliceEncodingDirection"` is negative,

    the entries in `"SliceTiming"` are defined in reverse order with respect to the

    slice axis, such that the final entry in the `"SliceTiming"` list is the time

    of acquisition of slice 0. Without this parameter slice time correction will

    not be possible.

    '
- source: bids
  class: metadata
  name: SourceDatasets
  description: 'Used to specify the locations and relevant attributes of all source
    datasets (BIDS or not).

    Valid keys in each object include `"URL"`, `"DOI"` (see

    [URI](SPEC_ROOT/common-principles.md#uniform-resource-indicator)), and

    `"Version"` with

    [string](https://www.w3schools.com/js/js_json_datatypes.asp)

    values.

    '
- source: bids
  class: metadata
  name: Sources
  description: 'A list of files with the paths specified using

    [BIDS URIs](SPEC_ROOT/common-principles.md#bids-uri);

    these files were directly used in the creation of this derivative data file.

    For example, if a derivative A is used in the creation of another

    derivative B, which is in turn used to generate C in a chain of A->B->C,

    C should only list B in `"Sources"`, and B should only list A in `"Sources"`.

    However, in case both X and Y are directly used in the creation of Z,

    then Z should list X and Y in `"Sources"`,

    regardless of whether X was used to generate Y.

    Using paths specified relative to the dataset root is

    [DEPRECATED](SPEC_ROOT/common-principles.md#definitions).

    '
- source: bids
  class: metadata
  name: TablePosition
  description: 'The table position, relative to an implementation-specific reference
    point,

    often the isocenter. Values must be an array (1x3) of three distances in

    millimeters in absolute coordinates (world coordinates). If an observer

    stands in front of the scanner looking at it, a table moving to the left,

    up or into the scanner (from the observer''s point of view) will increase

    the 1st, 2nd and 3rd value in the array respectively. The origin is defined

    by the image affine.

    '
- source: bids
  class: metadata
  name: VolumeAffineMatrix
  description: 'A 4-by-4 matrix using identical conventions and coordinate system
    to

    the *{qs}form* NIfTI affine matrix to define the orientation,

    position, and size of an additional VOI.

    This VOI defines a spatial region in addition to the primary method of localization

    (encoded in the NIfTI header *{qs}form*).

    Typically not defined for data stored with a single spatial voxel or FID-MRSI.

    For example: `[[30, 0, 0, -30], [0, 30, -2.27, -72.67], [0, 2.27, 29.91, 5.47],

    [0, 0, 0, 1]]`.

    '
- source: bids
  class: metadata
  name: VolumeTiming
  description: 'The time at which each volume was acquired during the acquisition.

    It is described using a list of times referring to the onset of each volume

    in the series.

    The list must have the same length as the series,

    and the values must be non-negative and monotonically increasing.

    This field is mutually exclusive with `"RepetitionTime"`.

    '
