semantic:
  data_type: float
provenance:
- source: nwb
  class: Image
  name: resolution
  description: Pixel resolution of the image, in pixels per centimeter.
- source: nwb
  class: TimeSeries
  name: starting_time
  description: Timestamp of the first sample in seconds. When timestamps are uniformly
    spaced, the timestamp of the first sample can be specified and all subsequent
    ones calculated from the sampling rate attribute.
- source: nwb
  class: TimeSeries
  name: timestamps
  description: Timestamps for samples stored in data, in seconds, relative to the
    common experiment master-clock stored in NWBFile.timestamps_reference_time.
- source: nwb
  class: ElectricalSeries
  name: channel_conversion
  description: Channel-specific conversion factor. Multiply the data in the 'data'
    dataset by these values along the channel axis (as indicated by axis attribute)
    AND by the global conversion factor in the 'conversion' attribute of 'data' to
    get the data values in Volts, i.e, data in Volts = data * data.conversion * channel_conversion.
    This approach allows for both global and per-channel data conversion factors needed
    to support the storage of electrical recordings as native values generated by
    data acquisition systems. If this dataset is not present, then there is no channel-specific
    conversion factor, i.e. it is 1 for all channels.
- source: nwb
  class: SpikeEventSeries
  name: timestamps
  description: Timestamps for samples stored in data, in seconds, relative to the
    common experiment master-clock stored in NWBFile.timestamps_reference_time. Timestamps
    are required for the events. Unlike for TimeSeries, timestamps are required for
    SpikeEventSeries and are thus re-specified here.
- source: nwb
  class: FeatureExtraction
  name: features
  description: Multi-dimensional array of features extracted from each event.
- source: nwb
  class: FeatureExtraction
  name: times
  description: Times of events that features correspond to (can be a link).
- source: nwb
  class: EventDetection
  name: times
  description: DEPRECATED. Timestamps of events, in seconds.
- source: nwb
  class: ElectrodesTable
  name: x
  description: x coordinate of the channel location in the brain (+x is posterior).
    Units should be specified in microns.
- source: nwb
  class: ElectrodesTable
  name: y
  description: y coordinate of the channel location in the brain (+y is inferior).
    Units should be specified in microns.
- source: nwb
  class: ElectrodesTable
  name: z
  description: z coordinate of the channel location in the brain (+z is right). Units
    should be specified in microns.
- source: nwb
  class: ElectrodesTable
  name: imp
  description: Impedance of the channel, in ohms.
- source: nwb
  class: ElectrodesTable
  name: rel_x
  description: x coordinate in electrode group. Units should be specified in microns.
- source: nwb
  class: ElectrodesTable
  name: rel_y
  description: y coordinate in electrode group. Units should be specified in microns.
- source: nwb
  class: ElectrodesTable
  name: rel_z
  description: z coordinate in electrode group. Units should be specified in microns.
- source: nwb
  class: ClusterWaveforms
  name: waveform_mean
  description: The mean waveform for each cluster, using the same indices for each
    wave as cluster numbers in the associated Clustering module (i.e, cluster 3 is
    in array slot [3]). Waveforms corresponding to gaps in cluster sequence should
    be empty (e.g., zero- filled)
- source: nwb
  class: ClusterWaveforms
  name: waveform_sd
  description: Stdev of waveforms for each cluster, using the same indices as in mean
- source: nwb
  class: Clustering
  name: peak_over_rms
  description: Maximum ratio of waveform peak to RMS on any channel in the cluster
    (provides a basic clustering metric).
- source: nwb
  class: Clustering
  name: times
  description: Times of clustered events, in seconds. This may be a link to times
    field in associated FeatureExtraction module.
- source: nwb
  class: TimeIntervals
  name: start_time
  description: Start time of epoch, in seconds.
- source: nwb
  class: TimeIntervals
  name: stop_time
  description: Stop time of epoch, in seconds.
- source: nwb
  class: PatchClampSeries
  name: gain
  description: Gain of the recording, in units Volt/Amp (v-clamp) or Volt/Volt (c-clamp).
- source: nwb
  class: CurrentClampSeries
  name: bias_current
  description: Bias current, in amps.
- source: nwb
  class: CurrentClampSeries
  name: bridge_balance
  description: Bridge balance, in ohms.
- source: nwb
  class: CurrentClampSeries
  name: capacitance_compensation
  description: Capacitance compensation, in farads.
- source: nwb
  class: IZeroClampSeries
  name: bias_current
  description: Bias current, in amps, fixed to 0.0.
- source: nwb
  class: IZeroClampSeries
  name: bridge_balance
  description: Bridge balance, in ohms, fixed to 0.0.
- source: nwb
  class: IZeroClampSeries
  name: capacitance_compensation
  description: Capacitance compensation, in farads, fixed to 0.0.
- source: nwb
  class: VoltageClampSeries
  name: capacitance_fast
  description: Fast capacitance, in farads.
- source: nwb
  class: VoltageClampSeries
  name: capacitance_slow
  description: Slow capacitance, in farads.
- source: nwb
  class: VoltageClampSeries
  name: resistance_comp_bandwidth
  description: Resistance compensation bandwidth, in hertz.
- source: nwb
  class: VoltageClampSeries
  name: resistance_comp_correction
  description: Resistance compensation correction, in percent.
- source: nwb
  class: VoltageClampSeries
  name: resistance_comp_prediction
  description: Resistance compensation prediction, in percent.
- source: nwb
  class: VoltageClampSeries
  name: whole_cell_capacitance_comp
  description: Whole cell capacitance compensation, in farads.
- source: nwb
  class: VoltageClampSeries
  name: whole_cell_series_resistance_comp
  description: Whole cell series resistance compensation, in ohms.
- source: nwb
  class: OpticalSeries
  name: distance
  description: Distance from camera/monitor to target/eye.
- source: nwb
  class: OpticalSeries
  name: field_of_view
  description: Width, height and depth of image, or imaged area, in meters.
- source: nwb
  class: FrequencyBandsTable
  name: band_limits
  description: Low and high limit of each band in Hz. If it is a Gaussian filter,
    use 2 SD on either side of the center.
- source: nwb
  class: FrequencyBandsTable
  name: band_mean
  description: The mean Gaussian filters, in Hz.
- source: nwb
  class: FrequencyBandsTable
  name: band_stdev
  description: The standard deviation of Gaussian filters, in Hz.
- source: nwb
  class: Units
  name: spike_times
  description: Spike times for each unit in seconds.
- source: nwb
  class: Units
  name: obs_intervals
  description: Observation intervals for each unit.
- source: nwb
  class: Units
  name: waveform_mean
  description: Spike waveform mean for each spike unit.
- source: nwb
  class: Units
  name: waveform_sd
  description: Spike waveform standard deviation for each spike unit.
- source: nwb
  class: OptogeneticStimulusSite
  name: excitation_lambda
  description: Excitation wavelength, in nm.
- source: nwb
  class: OnePhotonSeries
  name: pmt_gain
  description: Photomultiplier gain.
- source: nwb
  class: OnePhotonSeries
  name: scan_line_rate
  description: Lines imaged per second. This is also stored in /general/optophysiology
    but is kept here as it is useful information for analysis, and so good to be stored
    w/ the actual data.
- source: nwb
  class: OnePhotonSeries
  name: exposure_time
  description: Exposure time of the sample; often the inverse of the frequency.
- source: nwb
  class: OnePhotonSeries
  name: power
  description: Power of the excitation in mW, if known.
- source: nwb
  class: OnePhotonSeries
  name: intensity
  description: Intensity of the excitation in mW/mm^2, if known.
- source: nwb
  class: TwoPhotonSeries
  name: pmt_gain
  description: Photomultiplier gain.
- source: nwb
  class: TwoPhotonSeries
  name: scan_line_rate
  description: Lines imaged per second. This is also stored in /general/optophysiology
    but is kept here as it is useful information for analysis, and so good to be stored
    w/ the actual data.
- source: nwb
  class: TwoPhotonSeries
  name: field_of_view
  description: Width, height and depth of image, or imaged area, in meters.
- source: nwb
  class: ImagingPlane
  name: excitation_lambda
  description: Excitation wavelength, in nm.
- source: nwb
  class: ImagingPlane
  name: imaging_rate
  description: Rate that images are acquired, in Hz. If the corresponding TimeSeries
    is present, the rate should be stored there instead.
- source: nwb
  class: ImagingPlane
  name: manifold
  description: DEPRECATED Physical position of each pixel. 'xyz' represents the position
    of the pixel relative to the defined coordinate space. Deprecated in favor of
    origin_coords and grid_spacing.
- source: nwb
  class: ImagingPlane
  name: origin_coords
  description: Physical location of the first element of the imaging plane (0, 0)
    for 2-D data or (0, 0, 0) for 3-D data. See also reference_frame for what the
    physical location is relative to (e.g., bregma).
- source: nwb
  class: ImagingPlane
  name: grid_spacing
  description: Space between pixels in (x, y) or voxels in (x, y, z) directions, in
    the specified unit. Assumes imaging plane is a regular grid. See also reference_frame
    to interpret the grid.
- source: nwb
  class: OpticalChannel
  name: emission_lambda
  description: Emission wavelength for channel, in nm.
- source: nwb
  class: ImagingRetinotopy
  name: axis_1_phase_map
  description: Phase response to stimulus on the first measured axis.
- source: nwb
  class: ImagingRetinotopy
  name: axis_1_power_map
  description: Power response on the first measured axis. Response is scaled so 0.0
    is no power in the response and 1.0 is maximum relative power.
- source: nwb
  class: ImagingRetinotopy
  name: axis_2_phase_map
  description: Phase response to stimulus on the second measured axis.
- source: nwb
  class: ImagingRetinotopy
  name: axis_2_power_map
  description: Power response on the second measured axis. Response is scaled so 0.0
    is no power in the response and 1.0 is maximum relative power.
- source: nwb
  class: ImagingRetinotopy
  name: sign_map
  description: Sine of the angle between the direction of the gradient in axis_1 and
    axis_2.
