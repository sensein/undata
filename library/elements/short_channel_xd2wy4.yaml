semantic:
  data_type: boolean
provenance:
- source: bids
  class: columns
  name: short_channel
  description: 'Is the channel designated as short.

    The total number of channels listed as short channels

    SHOULD be stored in `ShortChannelCount` in `*_nirs.json`.

    '
- source: bids
  class: metadata
  name: BackgroundSuppression
  description: 'Boolean indicating if background suppression is used.

    '
- source: bids
  class: metadata
  name: BolusCutOffFlag
  description: 'Boolean indicating if a bolus cut-off technique is used.

    Corresponds to [DICOM Tag 0018, 925C](http://www.dicomlookup.com/dicomtags/(0018,925C))

    `ASL Bolus Cut-off Flag`.

    '
- source: bids
  class: metadata
  name: ContinuousHeadLocalization
  description: '`true` or `false` value indicating whether continuous head localization

    was performed.

    '
- source: bids
  class: metadata
  name: Derivative
  description: 'Indicates that values in the corresponding column are transformations
    of values

    from other columns (for example a summary score based on a subset of items in
    a

    questionnaire).

    '
- source: bids
  class: metadata
  name: DigitizedHeadPoints
  description: '`true` or `false` value indicating whether head points outlining the

    scalp/face surface are contained within this recording.

    '
- source: bids
  class: metadata
  name: DigitizedLandmarks
  description: '`true` or `false` value indicating whether anatomical landmark points

    (fiducials) are contained within this recording.

    '
- source: bids
  class: metadata
  name: DispersionCorrected
  description: 'Boolean flag specifying whether the blood data have been dispersion-corrected.

    NOTE: not customary for manual samples, and hence should be set to `false`.

    '
- source: bids
  class: metadata
  name: ElectricalStimulation
  description: 'Boolean field to specify if electrical stimulation was done during
    the

    recording (options are `true` or `false`). Parameters for event-like

    stimulation should be specified in the `events.tsv` file.

    '
- source: bids
  class: metadata
  name: ImageDecayCorrected
  description: 'Boolean flag specifying whether the image data have been decay-corrected.

    '
- source: bids
  class: metadata
  name: LookLocker
  description: 'Boolean indicating if a Look-Locker readout is used.

    '
- source: bids
  class: metadata
  name: MTState
  description: 'Boolean stating whether the magnetization transfer pulse is applied.

    Corresponds to [DICOM Tag 0018, 9020](http://www.dicomlookup.com/dicomtags/(0018,9020))

    `Magnetization Transfer`.

    '
- source: bids
  class: metadata
  name: Manual
  description: 'Indicates if the segmentation was performed manually or via an automated

    process.

    '
- source: bids
  class: metadata
  name: MetaboliteAvail
  description: 'Boolean that specifies if metabolite measurements are available.

    If `true`, the `metabolite_parent_fraction` column MUST be present in the

    corresponding `*_blood.tsv` file.

    '
- source: bids
  class: metadata
  name: MetaboliteRecoveryCorrectionApplied
  description: 'Metabolite recovery correction from the HPLC, for tracers where it
    changes

    with time postinjection.

    If `true`, the `hplc_recovery_fractions` column MUST be present in the

    corresponding `*_blood.tsv` file.

    '
- source: bids
  class: metadata
  name: NegativeContrast
  description: '`true` or `false` value specifying whether increasing voxel intensity

    (within sample voxels) denotes a decreased value with respect to the

    contrast suffix.

    This is commonly the case when Cerebral Blood Volume is estimated via

    usage of a contrast agent in conjunction with a T2\* weighted acquisition

    protocol.

    '
- source: bids
  class: metadata
  name: NonlinearGradientCorrection
  description: 'Boolean stating if the image saved has been corrected for gradient

    nonlinearities by the scanner sequence.

    '
- source: bids
  class: metadata
  name: OuterVolumeSuppression
  description: 'Boolean indicating whether outer-volume suppression was used prior
    to acquisition.

    '
- source: bids
  class: metadata
  name: PlasmaAvail
  description: 'Boolean that specifies if plasma measurements are available.

    '
- source: bids
  class: metadata
  name: SkullStripped
  description: 'Whether the volume was skull stripped (non-brain voxels set to zero)
    or not.

    '
- source: bids
  class: metadata
  name: SpoilingState
  description: 'Boolean stating whether the pulse sequence uses any type of spoiling

    strategy to suppress residual transverse magnetization.

    '
- source: bids
  class: metadata
  name: VascularCrushing
  description: 'Boolean indicating if Vascular Crushing is used.

    Corresponds to [DICOM Tag 0018, 9259](http://www.dicomlookup.com/dicomtags/(0018,9259))

    `ASL Crusher Flag`.

    '
- source: bids
  class: metadata
  name: WaterSuppression
  description: 'Boolean indicating whether water suppression was used prior to acquisition.

    '
- source: bids
  class: metadata
  name: WholeBloodAvail
  description: 'Boolean that specifies if whole blood measurements are available.

    If `true`, the `whole_blood_radioactivity` column MUST be present in the

    corresponding `*_blood.tsv` file.

    '
