semantic:
  data_type: object
provenance:
- source: nwb
  class: TimeSeriesReferenceVectorData
  name: TimeSeriesReferenceVectorData
  description: Column storing references to a TimeSeries (rows). For each TimeSeries
    this VectorData column stores the start_index and count to indicate the range
    in time to be selected as well as an object reference to the TimeSeries.
- source: nwb
  class: NWBContainer
  name: NWBContainer
  description: An abstract data type for a generic container storing collections of
    data and metadata. Base type for all data and metadata containers.
- source: nwb
  class: NWBDataInterface
  name: NWBDataInterface
  description: An abstract data type for a generic container storing collections of
    data, as opposed to metadata.
- source: nwb
  class: TimeSeries
  name: TimeSeries
  description: General purpose time series.
- source: nwb
  class: ProcessingModule
  name: ProcessingModule
  description: A collection of processed data.
- source: nwb
  class: Images
  name: Images
  description: A collection of images with an optional way to specify the order of
    the images using the "order_of_images" dataset. An order must be specified if
    the images are referenced by index, e.g., from an IndexSeries.
- source: nwb
  class: SpatialSeries
  name: SpatialSeries
  description: 'Direction, e.g., of gaze or travel, or position. The TimeSeries::data
    field is a 2D array storing position or direction relative to some reference frame.
    Array structure: [num measurements] [num dimensions]. Each SpatialSeries has a
    text dataset reference_frame that indicates the zero-position, or the zero-axes
    for direction. For example, if representing gaze direction, ''straight-ahead''
    might be a specific pixel on the monitor, or some other point in space. For position
    data, the 0,0 point might be the top-left corner of an enclosure, as viewed from
    the tracking camera. The unit of data will indicate how to interpret SpatialSeries
    values.'
- source: nwb
  class: BehavioralEpochs
  name: BehavioralEpochs
  description: TimeSeries for storing behavioral epochs.  The objective of this and
    the other two Behavioral interfaces (e.g. BehavioralEvents and BehavioralTimeSeries)
    is to provide generic hooks for software tools/scripts. This allows a tool/script
    to take the output one specific interface (e.g., UnitTimes) and plot that data
    relative to another data modality (e.g., behavioral events) without having to
    define all possible modalities in advance. Declaring one of these interfaces means
    that one or more TimeSeries of the specified type is published. These TimeSeries
    should reside in a group having the same name as the interface. For example, if
    a BehavioralTimeSeries interface is declared, the module will have one or more
    TimeSeries defined in the module sub-group 'BehavioralTimeSeries'. BehavioralEpochs
    should use IntervalSeries. BehavioralEvents is used for irregular events. BehavioralTimeSeries
    is for continuous data.
- source: nwb
  class: BehavioralEvents
  name: BehavioralEvents
  description: TimeSeries for storing behavioral events. See description of BehavioralEpochs
    for more details.
- source: nwb
  class: BehavioralTimeSeries
  name: BehavioralTimeSeries
  description: TimeSeries for storing behavioral time series data. See description
    of BehavioralEpochs for more details.
- source: nwb
  class: PupilTracking
  name: PupilTracking
  description: Eye-tracking data, representing pupil size.
- source: nwb
  class: EyeTracking
  name: EyeTracking
  description: Eye-tracking data, representing direction of gaze.
- source: nwb
  class: CompassDirection
  name: CompassDirection
  description: With a CompassDirection interface, a module publishes a SpatialSeries
    object representing a floating point value for theta. The SpatialSeries::reference_frame
    field should indicate what direction corresponds to 0 and which is the direction
    of rotation (this should be clockwise). The si_unit for the SpatialSeries should
    be radians or degrees.
- source: nwb
  class: Position
  name: Position
  description: Position data, whether along the x, x/y or x/y/z axis.
- source: nwb
  class: Device
  name: Device
  description: Metadata about a specific instance of a data acquisition device, e.g.,
    recording system, electrode, microscope. Link to a DeviceModel.model to represent
    information about the model of the device.
- source: nwb
  class: DeviceModel
  name: DeviceModel
  description: Model properties of a data acquisition device, e.g., recording system,
    electrode, microscope. This should be extended for specific types of device models
    to include additional attributes specific to each type. The name of the DeviceModel
    should be the most common representation of the model name, e.g., Neuropixels
    1.0, V-Probe, Bergamo III.
- source: nwb
  class: ElectricalSeries
  name: ElectricalSeries
  description: A time series of acquired voltage data from extracellular recordings.
    The data field is an int or float array storing data in volts. The first dimension
    should always represent time. The second dimension, if present, should represent
    channels.
- source: nwb
  class: SpikeEventSeries
  name: SpikeEventSeries
  description: 'Stores snapshots/snippets of recorded spike events (i.e., threshold
    crossings). This may also be raw data, as reported by ephys hardware. If so, the
    TimeSeries::description field should describe how events were detected. All events
    span the same recording channels and store snapshots of equal duration. TimeSeries::data
    array structure: [num events] [num channels] [num samples] (or [num events] [num
    samples] for single electrode).'
- source: nwb
  class: FeatureExtraction
  name: FeatureExtraction
  description: Features, such as PC1 and PC2, that are extracted from signals stored
    in a SpikeEventSeries or other source.
- source: nwb
  class: EventDetection
  name: EventDetection
  description: Detected spike events from voltage trace(s).
- source: nwb
  class: EventWaveform
  name: EventWaveform
  description: DEPRECATED. Represents either the waveforms of detected events, as
    extracted from a raw data trace in /acquisition, or the event waveforms that were
    stored during experiment acquisition.
- source: nwb
  class: FilteredEphys
  name: FilteredEphys
  description: Electrophysiology data from one or more channels that has been subjected
    to filtering. Examples of filtered data include Theta and Gamma (LFP has its own
    interface). FilteredEphys modules publish an ElectricalSeries for each filtered
    channel or set of channels. The name of each ElectricalSeries is arbitrary but
    should be informative. The source of the filtered data, whether this is from analysis
    of another time series or as acquired by hardware, should be noted in each's TimeSeries::description
    field. There is no assumed 1::1 correspondence between filtered ephys signals
    and electrodes, as a single signal can apply to many nearby electrodes, and one
    electrode may have different filtered (e.g., theta and/or gamma) signals represented.
    Filter properties should be noted in the ElectricalSeries 'filtering' attribute.
- source: nwb
  class: LFP
  name: LFP
  description: LFP data from one or more channels. The electrode map in each published
    ElectricalSeries will identify which channels are providing LFP data. Filter properties
    should be noted in the ElectricalSeries 'filtering' attribute.
- source: nwb
  class: ElectrodeGroup
  name: ElectrodeGroup
  description: A physical grouping of electrodes, e.g., a shank of an array. An electrode
    group is typically used to describe electrodes that are physically connected on
    a single device and are often (but not always) used together for analysis, such
    as for spike sorting. Note that this is descriptive metadata; electrodes from
    different groups can still be spike-sorted together if needed.
- source: nwb
  class: ElectrodeGroup
  name: position
  description: stereotaxic or common framework coordinates
- source: nwb
  class: ElectrodesTable
  name: ElectrodesTable
  description: A table of all electrodes (i.e. channels) used for recording. Introduced
    in NWB 2.8.0. Replaces the "electrodes" table (neurodata_type_inc DynamicTable,
    no neurodata_type_def) that is part of NWBFile.
- source: nwb
  class: ClusterWaveforms
  name: ClusterWaveforms
  description: DEPRECATED The mean waveform shape, including standard deviation, of
    the different clusters. Ideally, the waveform analysis should be performed on
    data that is only high-pass filtered. This is a separate module because it is
    expected to require updating. For example, IMEC probes may require different storage
    requirements to store/display mean waveforms, requiring a new interface or an
    extension of this one.
- source: nwb
  class: Clustering
  name: Clustering
  description: DEPRECATED Clustered spike data, whether from automatic clustering
    tools (e.g., klustakwik) or as a result of manual sorting.
- source: nwb
  class: TimeIntervals
  name: TimeIntervals
  description: A container for aggregating epoch data and the TimeSeries that each
    epoch applies to.
- source: nwb
  class: NWBFile
  name: NWBFile
  description: An NWB file storing cellular-based neurophysiology data from a single
    experimental session.
- source: nwb
  class: LabMetaData
  name: LabMetaData
  description: Lab-specific meta-data.
- source: nwb
  class: Subject
  name: Subject
  description: Information about the animal or person from which the data was measured.
- source: nwb
  class: PatchClampSeries
  name: PatchClampSeries
  description: An abstract base class for patch-clamp data - stimulus or response,
    current or voltage.
- source: nwb
  class: CurrentClampSeries
  name: CurrentClampSeries
  description: Voltage data from an intracellular current-clamp recording. A corresponding
    CurrentClampStimulusSeries (stored separately as a stimulus) is used to store
    the current injected.
- source: nwb
  class: IZeroClampSeries
  name: IZeroClampSeries
  description: Voltage data from an intracellular recording when all current and amplifier
    settings are off (i.e., CurrentClampSeries fields will be zero). There is no CurrentClampStimulusSeries
    associated with an IZero series because the amplifier is disconnected and no stimulus
    can reach the cell.
- source: nwb
  class: CurrentClampStimulusSeries
  name: CurrentClampStimulusSeries
  description: Stimulus current applied during current clamp recording.
- source: nwb
  class: VoltageClampSeries
  name: VoltageClampSeries
  description: Current data from an intracellular voltage-clamp recording. A corresponding
    VoltageClampStimulusSeries (stored separately as a stimulus) is used to store
    the voltage injected.
- source: nwb
  class: VoltageClampStimulusSeries
  name: VoltageClampStimulusSeries
  description: Stimulus voltage applied during a voltage clamp recording.
- source: nwb
  class: IntracellularElectrode
  name: IntracellularElectrode
  description: An intracellular electrode and its metadata.
- source: nwb
  class: SweepTable
  name: SweepTable
  description: '[DEPRECATED] Table used to group different PatchClampSeries. SweepTable
    is being replaced by IntracellularRecordingsTable and SimultaneousRecordingsTable
    tables. Additional SequentialRecordingsTable, RepetitionsTable, and ExperimentalConditions
    tables provide enhanced support for experiment metadata.'
- source: nwb
  class: IntracellularElectrodesTable
  name: IntracellularElectrodesTable
  description: Table for storing intracellular electrode related metadata.
- source: nwb
  class: IntracellularStimuliTable
  name: IntracellularStimuliTable
  description: Table for storing intracellular stimulus related metadata.
- source: nwb
  class: IntracellularResponsesTable
  name: IntracellularResponsesTable
  description: Table for storing intracellular response related metadata.
- source: nwb
  class: IntracellularRecordingsTable
  name: IntracellularRecordingsTable
  description: A table to group together a stimulus and response from a single electrode
    and a single simultaneous recording. Each row in the table represents a single
    recording consisting typically of a stimulus and a corresponding response. In
    some cases, however, only a stimulus or a response is recorded as part of an experiment.
    In this case, both the stimulus and response will point to the same TimeSeries
    while the idx_start and count of the invalid column will be set to -1, thus, indicating
    that no values have been recorded for the stimulus or response, respectively.
    Note, a recording MUST contain at least a stimulus or a response. Typically the
    stimulus and response are PatchClampSeries. However, the use of AD/DA channels
    that are not associated to an electrode is also common in intracellular electrophysiology,
    in which case other TimeSeries may be used.
- source: nwb
  class: SimultaneousRecordingsTable
  name: SimultaneousRecordingsTable
  description: A table for grouping different intracellular recordings from the IntracellularRecordingsTable
    table together that were recorded simultaneously from different electrodes.
- source: nwb
  class: SequentialRecordingsTable
  name: SequentialRecordingsTable
  description: A table for grouping different sequential recordings from the SimultaneousRecordingsTable
    table together. This is typically used to group together sequential recordings
    where a sequence of stimuli of the same type with varying parameters have been
    presented in a sequence.
- source: nwb
  class: RepetitionsTable
  name: RepetitionsTable
  description: A table for grouping different sequential intracellular recordings
    together. With each SequentialRecording typically representing a particular type
    of stimulus, the RepetitionsTable table is typically used to group sets of stimuli
    applied in sequence.
- source: nwb
  class: ExperimentalConditionsTable
  name: ExperimentalConditionsTable
  description: A table for grouping different intracellular recording repetitions
    together that belong to the same experimental condition.
- source: nwb
  class: ImageSeries
  name: ImageSeries
  description: General image data that is common between acquisition and stimulus
    time series. Sometimes the image data is stored in the file in a raw format while
    other times it will be stored as a series of external image files in the host
    file system. The data field will either be binary data, if the data is stored
    in the NWB file, or empty, if the data is stored in an external image stack. [frame][x][y]
    or [frame][x][y][z].
- source: nwb
  class: ImageMaskSeries
  name: ImageMaskSeries
  description: DEPRECATED. An alpha mask that is applied to a presented visual stimulus.
    The 'data' array contains an array of mask values that are applied to the displayed
    image. Mask values are stored as RGBA. Mask can vary with time. The timestamps
    array indicates the starting time of a mask, and that mask pattern continues until
    it's explicitly changed.
- source: nwb
  class: OpticalSeries
  name: OpticalSeries
  description: Image data that is presented or recorded. A stimulus template movie
    will be stored only as an image. When the image is presented as stimulus, additional
    data is required, such as field of view (e.g., how much of the visual field the
    image covers, or how what is the area of the target being imaged). If the OpticalSeries
    represents acquired imaging data, orientation is also important.
- source: nwb
  class: IndexSeries
  name: IndexSeries
  description: Stores indices that reference images defined in other containers. The
    primary purpose of the IndexSeries is to allow images stored in an Images container
    to be referenced in a specific sequence through the 'indexed_images' link. This
    approach avoids duplicating image data when the same image needs to be presented
    multiple times or when images need to be shown in a different order than they
    are stored. Since images in an Images container do not have an inherent order,
    the Images container needs to include an 'order_of_images' dataset (of type ImageReferences)
    when being referenced by an IndexSeries. This dataset establishes the ordered
    sequence that the indices in IndexSeries refer to. The 'data' field stores the
    index into this ordered sequence, and the 'timestamps' array indicates the precise
    presentation time of each indexed image during an experiment. This can be used
    for displaying individual images or creating movie segments by referencing a sequence
    of images with the appropriate timestamps. While IndexSeries can also reference
    frames from an ImageSeries through the 'indexed_timeseries' link, this usage is
    discouraged and will be deprecated in favor of using Images containers with 'order_of_images'.
- source: nwb
  class: AbstractFeatureSeries
  name: AbstractFeatureSeries
  description: Abstract features, such as quantitative descriptions of sensory stimuli.
    The TimeSeries::data field is a 2D array, storing those features (e.g., for visual
    grating stimulus this might be orientation, spatial frequency and contrast). Null
    stimuli (eg, uniform gray) can be marked as being an independent feature (eg,
    1.0 for gray, 0.0 for actual stimulus) or by storing NaNs for feature values,
    or through use of the TimeSeries::control fields. A set of features is considered
    to persist until the next set of features is defined. The final set of features
    stored should be the null set. This is useful when storing the raw stimulus is
    impractical.
- source: nwb
  class: AnnotationSeries
  name: AnnotationSeries
  description: Stores user annotations made during an experiment. The data[] field
    stores a text array, and timestamps are stored for each annotation (ie, interval=1).
    This is largely an alias to a standard TimeSeries storing a text array but that
    is identifiable as storing annotations in a machine-readable way.
- source: nwb
  class: IntervalSeries
  name: IntervalSeries
  description: Stores intervals of data. The timestamps field stores the beginning
    and end of intervals. The data field stores whether the interval just started
    (>0 value) or ended (<0 value). Different interval types can be represented in
    the same series by using multiple key values (eg, 1 for feature A, 2 for feature
    B, 3 for feature C, etc). The field data stores an 8-bit integer. This is largely
    an alias of a standard TimeSeries but that is identifiable as representing time
    intervals in a machine-readable way.
- source: nwb
  class: FrequencyBandsTable
  name: FrequencyBandsTable
  description: Table for describing the bands that DecompositionSeries was generated
    from. There should be one row in this table for each band.
- source: nwb
  class: DecompositionSeries
  name: DecompositionSeries
  description: Spectral analysis of a time series, e.g. of an LFP or a speech signal.
- source: nwb
  class: Units
  name: Units
  description: Data about spiking units. Event times of observed units (e.g. cell,
    synapse, etc.) should be concatenated and stored in spike_times.
- source: nwb
  class: OptogeneticSeries
  name: OptogeneticSeries
  description: An optogenetic stimulus.
- source: nwb
  class: OptogeneticStimulusSite
  name: OptogeneticStimulusSite
  description: A site of optogenetic stimulation.
- source: nwb
  class: OnePhotonSeries
  name: OnePhotonSeries
  description: Image stack recorded over time from 1-photon microscope.
- source: nwb
  class: TwoPhotonSeries
  name: TwoPhotonSeries
  description: Image stack recorded over time from 2-photon microscope.
- source: nwb
  class: RoiResponseSeries
  name: RoiResponseSeries
  description: ROI responses over an imaging plane. The first dimension represents
    time. The second dimension, if present, represents ROIs.
- source: nwb
  class: DfOverF
  name: DfOverF
  description: dF/F information about a region of interest (ROI). Storage hierarchy
    of dF/F should be the same as for segmentation (i.e., same names for ROIs and
    for image planes).
- source: nwb
  class: Fluorescence
  name: Fluorescence
  description: Fluorescence information about a region of interest (ROI). Storage
    hierarchy of fluorescence should be the same as for segmentation (ie, same names
    for ROIs and for image planes).
- source: nwb
  class: ImageSegmentation
  name: ImageSegmentation
  description: Stores pixels in an image that represent different regions of interest
    (ROIs) or masks. All segmentation for a given imaging plane is stored together,
    with storage for multiple imaging planes (masks) supported. Each ROI is stored
    in its own subgroup, with the ROI group containing both a 2D mask and a list of
    pixels that make up this mask. Segments can also be used for masking neuropil.
    If segmentation is allowed to change with time, a new imaging plane (or module)
    is required and ROI names should remain consistent between them.
- source: nwb
  class: PlaneSegmentation
  name: PlaneSegmentation
  description: Results from image segmentation of a specific imaging plane. At least
    one of `image_mask`, `pixel_mask`, or `voxel_mask` is required.
- source: nwb
  class: PlaneSegmentation
  name: pixel_mask
  description: 'Pixel masks for each ROI: a list of indices and weights for the ROI.
    Pixel masks are concatenated and parsing of this dataset is maintained by the
    PlaneSegmentation. At least one of `image_mask`, `pixel_mask`, or `voxel_mask`
    is required.'
- source: nwb
  class: PlaneSegmentation
  name: voxel_mask
  description: 'Voxel masks for each ROI: a list of indices and weights for the ROI.
    Voxel masks are concatenated and parsing of this dataset is maintained by the
    PlaneSegmentation. At least one of `image_mask`, `pixel_mask`, or `voxel_mask`
    is required.'
- source: nwb
  class: ImagingPlane
  name: ImagingPlane
  description: An imaging plane and its metadata.
- source: nwb
  class: OpticalChannel
  name: OpticalChannel
  description: An optical channel used to record from an imaging plane.
- source: nwb
  class: MotionCorrection
  name: MotionCorrection
  description: 'An image stack where all frames are shifted (registered) to a common
    coordinate system, to account for movement and drift between frames. Note: each
    frame at each point in time is assumed to be 2-D (has only x & y dimensions).'
- source: nwb
  class: CorrectedImageStack
  name: CorrectedImageStack
  description: Results from motion correction of an image stack.
- source: nwb
  class: ImagingRetinotopy
  name: ImagingRetinotopy
  description: 'DEPRECATED. Intrinsic signal optical imaging or widefield imaging
    for measuring retinotopy. Stores orthogonal maps (e.g., altitude/azimuth; radius/theta)
    of responses to specific stimuli and a combined polarity map from which to identify
    visual areas. This group does not store the raw responses imaged during retinotopic
    mapping or the stimuli presented, but rather the resulting phase and power maps
    after applying a Fourier transform on the averaged responses. Note: for data consistency,
    all images and arrays are stored in the format [row][column] and [row, col], which
    equates to [y][x]. Field of view and dimension arrays may appear backward (i.e.,
    y before x).'
