# Domain ontologies
ontologies:
  # -- Core biomedical --
  - name: ncit
    url: http://purl.obolibrary.org/obo/ncit.obo
    format: obo
  - name: pato
    url: http://purl.obolibrary.org/obo/pato.obo
    format: obo
  - name: hp
    url: http://purl.obolibrary.org/obo/hp.obo
    format: obo
  - name: obi
    url: http://purl.obolibrary.org/obo/obi.owl
    format: owl
  - name: ncbitaxon
    url: http://purl.obolibrary.org/obo/ncbitaxon.obo
    format: obo

  # -- Anatomy & cell types --
  - name: uberon
    url: http://purl.obolibrary.org/obo/uberon.owl
    format: owl
  - name: cl
    url: http://purl.obolibrary.org/obo/cl.owl
    format: owl

  # -- Neuroscience-specific --
  - name: atom
    url: https://raw.githubusercontent.com/SciCrunch/NIF-Ontology/atlas/ttl/atom.ttl
    format: ttl
    notes: "Atlas Ontology Model — brain atlas elements, coordinate systems"
  - name: tmn
    url: https://raw.githubusercontent.com/BICCN/TMN/main/tmn-base.owl
    format: owl
    notes: "Techniques & Methods for Neuroscience — base only (no imports, ~53 native terms)"
  - name: bgo
    url: https://raw.githubusercontent.com/Cellular-Semantics/hmba_basal_ganglia_ontology/main/bgo-base.owl
    format: owl
    notes: "Basal Ganglia Ontology — base only (no imports, ~336 native terms)"
  - name: hbao
    url: https://raw.githubusercontent.com/brain-bican/human_brain_atlas_ontology/main/hbao.owl
    format: owl
    notes: "Human Brain Atlas Ontology (HOMBA) — 2341 brain/spinal cord structures"

  # -- Bioinformatics --
  - name: edam
    url: http://edamontology.org/EDAM.obo
    format: obo

  # -- Vocabulary standards --
  - name: skos
    url: https://www.w3.org/2009/08/skos-reference/skos.rdf
    format: owl
    notes: "SKOS vocabulary — validates mapping_relation terms"
  - name: prov-o
    url: https://www.w3.org/ns/prov-o#
    format: ttl
    notes: "W3C PROV-O — validates provenance terms"

  # -- Units --
  - name: qudt
    url: bundled
    path: data/qudt/VOCAB_QUDT-UNITS-ALL.ttl
    format: ttl
    notes: "QUDT v3.1 — 2,897 units with symbols, UCUM codes, conversion factors"
