[project]
name = "undata-library"
version = "2026.03.0"
description = "Flat-file library of neuroscience data elements and mappings in LinkML YAML"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "linkml-runtime>=1.8",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "click>=8.0",
    "requests>=2.31",
    "pyarrow>=15.0",
    "pronto>=2.5",
    "pyoxigraph>=0.4",
    "python-dotenv>=1.0",
    "cmixf>=0.2",
]

[project.optional-dependencies]
similarity = ["sentence-transformers>=3.0"]
embeddings = ["sentence-transformers>=3.0"]
llm = ["litellm>=1.40"]
docker = ["docker>=7.0"]
knowledge = ["datalad>=1.0", "pydicom>=2.4"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "litellm>=1.40",
]

[project.scripts]
undata-library = "undata_library.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/undata_library"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
