id: https://schema.undata.live/library/library-schema
name: undata-library-schema
version: "2026.03.1"
description: >-
  Content-addressed RDF property model for neuroscience data elements.
  Elements are rdf:Property instances identified by semantic graph hash.
  Schemas are sh:NodeShape instances identified by property set hash.

prefixes:
  linkml: https://w3id.org/linkml/
  undata: https://schema.undata.live/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  sh: http://www.w3.org/ns/shacl#
  owl: http://www.w3.org/2002/07/owl#
  schema: http://schema.org/
  prov: http://www.w3.org/ns/prov#
  sssom: https://w3id.org/sssom/

default_range: string
imports:
  - linkml:types

enums:
  DataType:
    permissible_values:
      string: { description: "UTF-8 text" }
      integer: { description: "Whole number" }
      float: { description: "Floating-point number" }
      boolean: { description: "true/false" }
      array: { description: "Ordered collection" }
      object: { description: "Composite value" }

  MappingFunctionType:
    permissible_values:
      identity: { description: "Exact synonym" }
      unit_conversion: { description: "Numeric with unit factor" }
      scaling: { description: "Linear scale factor" }
      structural: { description: "Field rename or type cast" }
      unknown: { description: "Not yet determined" }

classes:
  ElementRecord:
    description: A data element (rdf:Property) with content-addressed identity.
    class_uri: rdf:Property
    attributes:
      semantic:
        range: SemanticIdentity
        required: true
        inlined: true
      provenance:
        range: ProvenanceEntry
        multivalued: true
        inlined_as_list: true
        required: true

  SemanticIdentity:
    description: >-
      The essential disambiguators that determine element identity.
      Hashed to produce the content-addressed URI.
    attributes:
      ontology_term:
        range: uriorcurie
        description: Ontology concept URI
      data_type:
        range: DataType
        required: true
      unit:
        range: string
        description: Measurement unit (UCUM/QUDT symbol)
      constraints:
        range: Constraints
        inlined: true

  Constraints:
    attributes:
      minimum:
        range: float
      maximum:
        range: float
      pattern:
        range: string
      allowed_values:
        range: string
        multivalued: true

  ProvenanceEntry:
    description: One source's attestation of this property.
    class_uri: prov:Entity
    attributes:
      source:
        range: string
        required: true
      class:
        range: string
        required: true
      name:
        range: string
        required: true
        slot_uri: schema:name
      description:
        range: string
        slot_uri: schema:description
      required:
        range: boolean
      multivalued:
        range: boolean

  SchemaRecord:
    description: A class shape (sh:NodeShape) with content-addressed identity.
    class_uri: sh:NodeShape
    attributes:
      semantic:
        range: SchemaIdentity
        required: true
        inlined: true
      provenance:
        range: SchemaProvenance
        multivalued: true
        inlined_as_list: true
        required: true

  SchemaIdentity:
    description: >-
      Property set + inheritance that determine schema identity.
    attributes:
      properties:
        range: uriorcurie
        multivalued: true
        description: Element URIs this class shape requires
      subclass_of:
        range: uriorcurie
        slot_uri: rdfs:subClassOf
      mixins:
        range: uriorcurie
        multivalued: true

  SchemaProvenance:
    description: One source's attestation of this class shape.
    class_uri: prov:Entity
    attributes:
      source:
        range: string
        required: true
      name:
        range: string
        required: true
        slot_uri: schema:name
      description:
        range: string
        slot_uri: schema:description

  ValueConcept:
    description: A categorical value with content-addressed identity.
    class_uri: skos:Concept
    attributes:
      semantic:
        range: ValueSemanticIdentity
        required: true
        inlined: true
      provenance:
        range: ValueProvenance
        multivalued: true
        inlined_as_list: true
        required: true

  ValueSemanticIdentity:
    description: Identity block for a value concept.
    attributes:
      ontology_term:
        range: uriorcurie
      value_type:
        range: string
        description: "categorical (default)"
      label:
        range: string
        required: true
        slot_uri: rdfs:label

  ValueProvenance:
    description: One source's representation of this value.
    class_uri: prov:Entity
    attributes:
      source:
        range: string
        required: true
      raw_value:
        range: string
        required: true
