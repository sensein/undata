name: Tutorials (Offline)

on:
  push:
    paths:
      - "tutorials/**"
      - "ingestion/**"
      - ".github/workflows/tutorials-offline.yml"
  pull_request:
    paths:
      - "tutorials/**"
      - "ingestion/**"
      - ".github/workflows/tutorials-offline.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tutorials

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install ingestion package
        working-directory: ingestion
        run: uv sync --all-extras

      - name: Install tutorial dependencies
        run: uv sync --all-extras

      - name: Run offline tutorial (T06 — no services required)
        run: uv run pytest --nbmake 06_schema_roundtrip.ipynb -v

      - name: Build JupyterBook (no execution)
        run: uv run jupyter-book build .
