name: Library Tests

on:
  push:
    paths:
      - "library/**"
      - ".github/workflows/library-tests.yml"
  pull_request:
    paths:
      - "library/**"
      - ".github/workflows/library-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: library

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
