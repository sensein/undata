name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint ingestion
        working-directory: ingestion
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Lint tutorials
        working-directory: tutorials
        run: |
          uvx ruff check .
          uvx ruff format --check .
