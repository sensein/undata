name: Publish Tutorials Site

on:
  push:
    branches:
      - main
    paths:
      - "tutorials/**"
      - ".github/workflows/tutorials-site.yml"

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Build JupyterBook
        working-directory: tutorials
        run: |
          uv sync
          uv run jupyter-book build .

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: tutorials/_build/html
          destination_dir: tutorials
          force_orphan: false
