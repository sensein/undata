[project]
name = "undata-backend"
version = "2026.03.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "strawberry-graphql[fastapi]>=0.250",
    "python-json-logger>=2.0",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
    "undata-library",
]

[tool.uv.sources]
undata-library = { path = "../library", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
