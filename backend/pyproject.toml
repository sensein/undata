[project]
name = "schema-backend"
version = "2026.03.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "authlib>=1.0",
    "itsdangerous>=2.0",
    "cachetools>=5.0",
    "sentence-transformers>=3.0",
    "pgvector>=0.3",
    "httpx>=0.27",
    "python-json-logger>=2.0",
    "uvicorn[standard]>=0.29",
    "rdflib>=7.0",
    "cmixf>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
