services:
  backend:
    build: .
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      UNDATA_BASE_URL: "http://localhost:8002"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: undata
      POSTGRES_PASSWORD: undata
      POSTGRES_DB: undata
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undata"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  test:
    build: .
    entrypoint: ["/app/.venv/bin/python", "-m", "pytest"]
    command: tests/ -v --tb=short
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://undata:undata@db:5432/undata_test"
      TEST_DATABASE_URL: "postgresql+asyncpg://undata:undata@db:5432/undata_test"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
