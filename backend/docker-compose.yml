services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: undata
      POSTGRES_PASSWORD: undata
      POSTGRES_DB: undata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undata"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://undata:undata@db:5432/undata
      LOG_LEVEL: INFO
      UNDATA_BASE_URL: http://localhost:8002
    volumes:
      - ./src:/app/backend/src
      - ./seed:/app/backend/seed
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
