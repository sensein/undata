  value_type: categorical
  display_name: Path relative to the participant directory
provenance:
- source: bids
  class: formats
  name: participant_relative
  description: 'A path to a file, relative to the participant''s directory in the
    dataset.


    The validation for this format is minimal.

    It simply ensures that the value is a string with any characters that may appear
    in a valid path,

    without starting with "/" (an absolute path) or "sub/"

    (a relative path starting with the participant directory, rather than relative
    to that directory).

    '
