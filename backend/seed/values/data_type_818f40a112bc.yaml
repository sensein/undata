provenance:
- source: bids
  class: common_principles
  name: data_type
  description: "A functional group of different types of data.\nData files are contained\
    \ in a directory named for the data type.\nBIDS defines the following data types:\n\
    \n    1.  `func` (task based and resting state functional MRI)\n\n    2.  `dwi`\
    \ (diffusion weighted imaging)\n\n    3.  `fmap` (field inhomogeneity mapping\
    \ data such as field maps)\n\n    4.  `anat` (structural imaging such as T1, T2,\
    \ PD, and so on)\n\n    5.  `perf` (perfusion)\n\n    6.  `meg` (magnetoencephalography)\n\
    \n    7.  `eeg` (electroencephalography)\n\n    8.  `ieeg` (intracranial electroencephalography)\n\
    \n    9.  `beh` (behavioral)\n\n    10. `pet` (positron emission tomography)\n\
    \n    11. `micr` (microscopy)\n\n    12. `nirs` (near infrared spectroscopy)\n\
    \n    13. `motion` (motion)\n\n    14. `mrs` (magnetic resonance spectroscopy)\n\
    \n    15. `phenotype` (measurement and survey data)\n\n    16. `emg` (electromyography)\n\
    \nFor files that are subject- and session- specific, the data type directory\n\
    is nested inside those directories.\n`phenotype` data files are aggregated across\
    \ subjects and sessions,\nand so the `phenotype/` directory is placed in the dataset\
    \ root.\n"
