services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-undata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-undata}
      POSTGRES_DB: ${POSTGRES_DB:-undata}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-undata}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./backend/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  meilisearch:
    image: getmeili/meilisearch:v1
    ports:
      - "${MEILI_PORT:-7700}:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8002}:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-undata}:${POSTGRES_PASSWORD:-undata}@db:5432/${POSTGRES_DB:-undata}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-undata}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      ALIAS_SIMILARITY_THRESHOLD: ${ALIAS_SIMILARITY_THRESHOLD:-0.88}
      TOKEN_CACHE_TTL_SECONDS: ${TOKEN_CACHE_TTL_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UNDATA_BASE_URL: http://localhost:${BACKEND_PORT:-8002}
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/api/v1/sources"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  migration-api:
    build: ./migration-api
    ports:
      - "${MIGRATION_API_PORT:-8004}:8004"
    environment:
      BACKEND_URL: http://backend:8002
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build: ./migration-api
    command: celery -A src.tasks.celery_app worker --loglevel=info
    environment:
      BACKEND_URL: http://backend:8002
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:${BACKEND_PORT:-8002}
      NEXT_PUBLIC_MEILI_URL: http://localhost:${MEILI_PORT:-7700}
      NEXT_PUBLIC_MIGRATION_URL: http://localhost:${MIGRATION_API_PORT:-8004}
      BACKEND_INTERNAL_URL: http://backend:8002
      MIGRATION_INTERNAL_URL: http://migration-api:8004
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
      API_TOKEN: ${API_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

volumes:
  pg_data:
  meili_data:
