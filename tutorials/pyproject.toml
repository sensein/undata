[project]
name = "undata-tutorials"
version = "2026.03.0"
description = "Interactive tutorials for the undata system"
requires-python = ">=3.14"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = [
    "nbmake>=1.5",
    "ipykernel",
    "jupyter",
    "pytest",
    "ruff>=0.15.5",
    "jupyter-book>=1.0,<2",
]

[tool.pytest.ini_options]
addopts = ["--nbmake", "--nbmake-timeout=120"]
testpaths = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
