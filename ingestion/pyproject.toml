[project]
name = "undata"
version = "2026.03.1"
description = "Neuroscience schema integration CLI and library"
requires-python = ">=3.14"
dependencies = [
    "bidsschematools",
    "dandischema",
    "hdmf",
    "httpx>=0.27",
    "linkml-runtime>=1.8",
    "pydantic>=2",
    "python-json-logger>=3",
    "sentence-transformers>=3",
    "typer>=0.12",
]

[project.optional-dependencies]
all = [
    "bidsschematools",
    "dandischema",
    "hdmf",
    "httpx>=0.27",
    "linkml-runtime>=1.8",
    "pydantic>=2",
    "python-json-logger>=3",
    "sentence-transformers>=3",
    "typer>=0.12",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[project.scripts]
undata = "undata.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/undata"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
