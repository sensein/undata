# Minimal NWB-style spec for testing (simplified from hdmf NWBGroupSpec)
groups:
  - neurodata_type_def: NWBFile
    doc: An NWB:N file.
    attributes:
      - name: session_description
        dtype: text
        doc: A description of the experimental session and data in the file.
        required: true
      - name: identifier
        dtype: text
        doc: A unique text identifier for the file.
        required: true
      - name: session_start_time
        dtype: isodatetime
        doc: Date and time of the recording session start.
        required: true
      - name: experimenter
        dtype: text
        doc: Name of person who performed the experiment.
        required: false
        quantity: "?"
